[package]
name = "fingerprint_engine"
publish = false  # first-party proprietary crate — never published to crates.io
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
description = "Active tech stack fingerprinting for threat intel correlation"

[features]
default = ["live-aws"]
live-aws = []
# Compile critical OT/ICS attack engines into this binary. Omit for standard recon workers.
high_risk_engines = []
numa = ["dep:hwlocality"]

[dependencies]
fuzz_core = { path = "../fuzz_core" }
weissman-core = { path = "../backend/weissman-core" }
weissman-ui-provenance = { path = "../crates/weissman-ui-provenance" }
weissman-db = { path = "../crates/weissman-db" }
weissman-job-bus = { path = "../crates/weissman-job-bus" }
weissman-fleet-shaping = { path = "../crates/weissman-fleet-shaping" }
weissman-engines = { path = "../backend/weissman-engines" }
ml-kem = "0.2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "http2"] }
tokio = { version = "1", features = ["full", "sync"] }
regex = "1.10"
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ipnetwork = "0.21"
urlencoding = "2.1"
rand = "0.10"
# Full-stack server: live API + dashboard, no dummy
axum = { version = "0.7", features = ["json", "ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "chrono"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
url = "2.5"
# Full IANA Public Suffix List matching + IDN (punycode) normalization for the
# target-intelligence classifier (target_profile.rs).
idna = "1"
uuid = { version = "1", features = ["v4"] }
quick-xml = "0.41"
flate2 = "1"
bcrypt = "0.16"
chrono = "0.4"
jsonwebtoken = "9"
totp-rs = { version = "5", default-features = false, features = ["gen_secret", "otpauth"] }
chrono-tz = "0.10"
# Module 1: Immutable Audit Trail & RFC 3161-style PDF signing
openssl = "0.10"
sha2 = "0.10"
hmac = "0.12"
qrcode = "0.14"
base64 = "0.22"
# Module 3: Graph ASM & Cloud Hunter (DNS CNAME, subdomain takeover, S3/Azure exposure)
hickory-resolver = { version = "0.26" }
# Module 8: IaC / CI-CD pipeline analysis (YAML)
serde_yaml = "0.9"
# Production: granular locking for SSE registry (no global RwLock contention)
dashmap = "6"
# Binary PDF generation (Executive Report) is done natively in `pdf_report.rs`
# (self-contained %PDF-1.4 writer, base-14 Helvetica) — no third-party PDF crate, so the
# tree stays free of the printpdf/lopdf/time-0.2 supply-chain advisories.
# Load .env so WEISSMAN_ADMIN_EMAIL / WEISSMAN_ADMIN_PASSWORD are set
dotenvy = "0.15"
tempfile = "3"
# True DAG execution (concurrent engine scheduling)
petgraph = "0.6"
# 200% verification: ephemeral Docker container
bollard = "0.16"
# Deception: active cloud injection (AWS). Requires Rust ≥1.91 (aws-smithy-* / aws-sdk-* MSRV).
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
# All aws-sdk-* crates: default-features = false to drop their default `rustls` feature,
# which pulls aws-smithy-runtime/tls-rustls -> the legacy hyper-0.14 connector on
# rustls 0.21 / rustls-webpki 0.101.7 (RUSTSEC-2026-0098/0099/0104). We re-enable exactly
# the rest of each crate's own default set — `default-https-client` (the MODERN connector,
# aws-smithy-http-client/rustls-aws-lc on rustls 0.23), `rt-tokio`, and the per-crate extras
# (`sigv4a` for STS/EventBridge, `sigv4a` + `http-1x` for S3). TLS behaviour is unchanged —
# the SDK still auto-builds a default HTTPS client — only the vulnerable 0.21 chain is dropped.
# aws-config is left as-is: its default set has no legacy `rustls` feature.
aws-config = "1.1"
aws-sdk-iam = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-sdk-s3 = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a", "http-1x"] }
aws-sdk-ec2 = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudtrail = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-rds = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-accessanalyzer = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-guardduty = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-config = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-eks = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-elasticloadbalancingv2 = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3control = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecs = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-elasticache = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecr = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-acm = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-apigateway = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-apigatewayv2 = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-opensearch = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudfront = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-route53 = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-eventbridge = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-sdk-wafv2 = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudwatchlogs = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-redshift = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-docdb = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-neptune = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-memorydb = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-backup = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-organizations = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sfn = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssoadmin = { version = "1.14", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types = "1"
tokio-util = { version = "0.7", features = ["codec"] }
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
aes-gcm = "0.10"
hex = "0.4"
zeroize = "1"
syn = { version = "2.0", features = ["full", "visit"] }
subtle = "2.6"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
# HPC: lock-free async channels + zero-copy helpers; NUMA CPU bind (Linux) via hwloc.
bytes = "1.6"
flume = { version = "0.12", default-features = false, features = ["async"] }
governor = "0.6"
moka = { version = "0.12", features = ["future"] }
thiserror = "1"
# Sovereign Shield: OpenSSH-format Ed25519 for phantom SSH canaries
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "rand_core"] }
rand_core = "0.6"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls", "connect"] }
native-tls = "0.2"
# The OTel family must move together with tracing-opentelemetry: 0.33 is built against
# opentelemetry/opentelemetry_sdk 0.32, so leaving the core crates at 0.27 compiles TWO
# incompatible opentelemetry versions into the tree and `layer().with_tracer(tracer)` fails to
# type-check (the SDK tracer does not implement the *other* version's `Tracer` trait).
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# NOTE the exporter's HTTP client must be the BLOCKING one. `with_batch_exporter` (below, in
# observability.rs) builds the default `BatchSpanProcessor`, which since 0.30 owns a dedicated OS
# thread and drives the export future with `futures_executor::block_on` — that thread has no Tokio
# reactor. The async `reqwest-client` feature would compile fine and then panic at runtime
# ("there is no reactor running") on the first export. `reqwest-blocking-client` is also what this
# crate's own default feature set selects, for exactly this reason.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.33"

[target.'cfg(target_os = "linux")'.dependencies]
# System libhwloc via pkg-config (install libhwloc-dev). Vendored build needs autoconf/automake.
hwlocality = { version = "1.0.0-alpha.12", optional = true }
libc = "0.2"

[lints.rust]
# hpc_runtime::linux_affinity uses libc sched_setaffinity (documented SAFETY in module).
# All other modules must remain free of unsafe code.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
