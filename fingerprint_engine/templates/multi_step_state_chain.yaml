id: multi_step_state_chain
name: Multi-Step State Chain
description: "Live stateful HTTP probe: extract Server header, reuse it in the next step."
severity: info
steps:
  - id: extract_server
    request:
      method: GET
      path: /
      headers:
        User-Agent: "WeissmanTemplateEngine/1.0"
    extractors:
      - type: header
        name: server_header
        header: server
    matchers_condition: or
    matchers:
      - type: status
        statuses: [200, 301, 302, 307, 308]
  - id: reuse_state
    request:
      method: GET
      path: /
      headers:
        User-Agent: "WeissmanTemplateEngine/1.0"
        X-Weissman-State: "{{state.server_header}}"
    matchers_condition: or
    matchers:
      - type: status
        statuses: [200, 301, 302, 307, 308]
