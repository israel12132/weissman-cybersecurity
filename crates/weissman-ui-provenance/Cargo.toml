[package]
name = "weissman-ui-provenance"
version = "0.1.0"
edition = "2021"
description = "Cryptographic UI provenance — shared between backend signing and browser WASM verification"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[lints.rust]
unsafe_code = "forbid"
