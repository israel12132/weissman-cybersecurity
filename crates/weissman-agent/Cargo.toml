[package]
name = "weissman-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Weissman endpoint agent — local detections + WebSocket bridge to Weissman server"
publish = false

[[bin]]
name = "weissman-agent"
path = "src/main.rs"

[dependencies]
# Async runtime (multi-thread for parallel detections, signal handler).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "io-util", "net", "fs", "process"] }
# UEBA baseline uses chrono::Utc + Datelike for hour-of-week computation.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Streaming WebSocket + TLS.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots", "connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
url = "2"

# JSON + envelope serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging + tracing.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local detections — system inventory.
sysinfo = { version = "0.30", default-features = false }
hostname = "0.4"
whoami = "1"

# File hashing + kill-switch HMAC + TLS pin verifier.
sha2 = "0.10"
hex = "0.4"
hmac = { version = "0.12", features = ["std"] }
hkdf = "0.12"
aes-gcm = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Random nonce + uuid.
uuid = { version = "1", features = ["v4"] }

# JWT verification (only used to sanity-check the enrollment token client-side).
jsonwebtoken = { version = "9", default-features = false }

# HTTP fetch for enrollment (request a session token).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }

# CLI parsing.
clap = { version = "4", features = ["derive", "env"] }

# Errors.
thiserror = "1"
anyhow = "1"

# Platform-specific extras pulled in only on Windows so musl builds stay small.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

# Release profile is defined at workspace root Cargo.toml.
