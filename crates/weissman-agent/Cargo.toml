[package]
name = "weissman-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Weissman endpoint agent — local detections + WebSocket bridge to Weissman server"
publish = false

[[bin]]
name = "weissman-agent"
path = "src/main.rs"

[dependencies]
# Async runtime (multi-thread for parallel detections, signal handler).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "io-util", "net", "fs", "process"] }
# UEBA baseline uses chrono::Utc + Datelike for hour-of-week computation.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Streaming WebSocket + TLS. webpki public roots ∪ the host native store
# (enterprise SSL inspection) plus optional leaf pin.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
url = "2"

# JSON + envelope serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging + tracing.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

hostname = "0.4"
whoami = "1"

# File hashing + ring-buffer key derivation.
sha2 = "0.10"
hex = "0.4"

# Encrypted in-memory ring (XChaCha20-Poly1305, 192-bit random nonce, 10 MiB cap).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.2"
hmac = "0.12"
subtle = "2"

# Random nonce + uuid.
uuid = { version = "1", features = ["v4"] }

# JWT verification (only used to sanity-check the enrollment token client-side).
jsonwebtoken = { version = "9", default-features = false }

# HTTP fetch for enrollment (custom rustls config: native + webpki + pin).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }

# CLI parsing.
clap = { version = "4", features = ["derive", "env"] }

# Errors.
thiserror = "1"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Platform-specific extras pulled in only on Windows so musl builds stay small.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

# Release profile is defined at workspace root Cargo.toml.
