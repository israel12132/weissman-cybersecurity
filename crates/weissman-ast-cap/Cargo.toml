[package]
name = "weissman-ast-cap"
version = "0.1.0"
edition = "2021"
description = "WASM AST mutation capping — replaces heavy JS string processing in AstTreeViewer"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[lints.rust]
unsafe_code = "forbid"
