[package]
name = "weissman-job-bus"
publish = false  # first-party proprietary crate — never published to crates.io
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Military-grade job orchestration: event sourcing, zero-trust claims, swarm liveness, forensic DLQ"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "script", "streams"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid"] }
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
