[package]
name = "weissman-db"
publish = false  # first-party proprietary crate — never published to crates.io
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "PostgreSQL pools, sqlx migrations, RLS via app.current_tenant_id"

[dependencies]
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "migrate", "chrono", "uuid", "json"] }
bcrypt = "0.16"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# SHA-384 to match SQLx's own migration checksum format. Required so our
# out-of-transaction migration runner can record rows in `_sqlx_migrations`
# that sqlx::migrate!() will recognise as already-applied.
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "time"] }
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "run_migrate"
path = "examples/run_migrate.rs"

[[example]]
name = "rotate_auth_password"
path = "examples/rotate_auth_password.rs"
