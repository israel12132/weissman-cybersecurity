# Production overlay for docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The base docker-compose.yml is intentionally dev-friendly: it ships weak default
# secrets and does NOT set WEISSMAN_ENV, so the production guards never fire. This
# overlay fixes both problems:
#
#   1. Sets WEISSMAN_ENV=production, which activates every check in
#      fingerprint_engine/src/security_startup.rs (rejects weak JWT/DB secrets,
#      demands a strong metrics token + secure cookies, requires Redis, ...). The
#      app fails CLOSED at boot on any misconfiguration.
#   2. Uses `${VAR:?message}` for every secret, so `docker compose` itself refuses to
#      start with a clear error if a secret is unset — no silent fallback to a dev
#      default.
#
# One-command customer deploy: ./start_weissman_live.sh
#
# Provide these via a .env file beside this compose file or the shell environment:
#   WEISSMAN_JWT_SECRET (>=48 chars)   WEISSMAN_ADMIN_PASSWORD
#   WEISSMAN_METRICS_TOKEN (>=32)      WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET (>=32)
#   WEISSMAN_JOB_ORCHESTRATOR_SECRET (>=32)
#   WEISSMAN_RAG_PROVENANCE_SECRET (64 hex from the vault; no JWT fallback)
#   WEISSMAN_PUBLIC_BASE_URL (https)   POSTGRES_PASSWORD  DB_APP_PASSWORD
#   DB_AUTH_PASSWORD  REDIS_PASSWORD   (monitoring uses WEISSMAN_ADMIN_* — optional GRAFANA_ADMIN_PASSWORD override)
# Bounded container logs. Docker's json-file driver defaults to *unbounded* growth and
# /etc/docker/daemon.json does not exist on the deployment host, so nothing capped it. Postgres
# alone wrote 101 MB in 9.5h (155,589 ERROR + 155,588 STATEMENT entries, each dumping the full
# failing SQL) and on 2026-07-03 filled the disk outright:
#   PANIC: could not write to file "pg_logical/replorigin_checkpoint.tmp": No space left on device
# followed by 183 x FATAL and the checkpointer aborting — a whole-stack outage caused purely by
# log growth. 50m x 3 caps each container at 150 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    # 200 to match deploy/k8s/postgres-ha.yaml:26. The image default is 100 (97 usable after
    # superuser_reserved_connections=3), but the two application processes are configured to open
    # up to 152: backend 72 (app 48 + auth 12 + intel 12) and worker 80 (app 48 + auth 12 +
    # intel 12 + control 8). Under the concurrent load the pools exist to survive, Postgres starts
    # refusing with SQLSTATE 53300 and the worker's control-plane pool — built specifically so
    # job-state writes can never be starved — is the one that cannot connect, so finished jobs
    # never record their terminal state. Compose was the outlier here; k8s already had 200.
    command:
      - postgres
      - -c
      - max_connections=200
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD for production}
      # Page checksums, so silent corruption is detected rather than returned as data. The
      # live cluster was initialised without them and has since survived 8 unclean crashes,
      # 11 automatic recoveries, a checkpointer SIGABRT and a full-disk PANIC — each of
      # which can tear a page that Postgres would then read back without complaint.
      # Applies only to a FRESH data directory; an existing cluster needs a dump/restore.
      POSTGRES_INITDB_ARGS: "--data-checksums"

  redis:
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set a strong REDIS_PASSWORD for production}
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--save", "60", "1"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 20

  backend:
    logging: *default-logging
    # Pull in the operator's full .env so OPTIONAL settings the app reads directly
    # (WEISSMAN_SMTP_*, WEISSMAN_LLM_API_KEY, NVD_API_KEY, WEISSMAN_INTEGRATIONS_VAULT_KEY,
    # PADDLE_*, ...) actually reach the process. Without this, only the ~19 keys listed
    # under `environment:` below were passed and everything else in .env was silently
    # dropped. The explicit entries below still WIN over env_file, so every ${VAR:?} guard
    # and derived DSN keeps its exact value. `required: false` so `compose config` and the
    # interpolation-only path still work before a .env exists (Compose v2.24+).
    env_file:
      - path: .env
        required: false
    environment:
      WEISSMAN_ENV: production
      WEISSMAN_COOKIE_SECURE: "1"
      DATABASE_URL: postgresql://${DB_APP_USER:-weissman_app}:${DB_APP_PASSWORD:?set DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_AUTH_DATABASE_URL: postgresql://${DB_AUTH_USER:-weissman_auth}:${DB_AUTH_PASSWORD:?set DB_AUTH_PASSWORD}@postgres:5432/${POSTGRES_DB:-weissman}
      # "Ask Weissman" NL->SQL read-only role. Required so /api/ask works and so the boot
      # role-sync sets a real password + restores LOGIN (auth_rotation.rs) instead of
      # disabling the role. Generated by the launcher; see PRODUCTION.env.template.
      WEISSMAN_READ_ONLY_DATABASE_URL: postgresql://${DB_RO_USER:-weissman_ro}:${DB_RO_PASSWORD:?set DB_RO_PASSWORD}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_WORKER_DATABASE_URL: postgresql://${DB_WORKER_USER:-weissman_worker}:${DB_WORKER_PASSWORD:?set DB_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_ANALYTICS_DATABASE_URL: postgresql://${DB_ANALYTICS_USER:-weissman_analytics}:${DB_ANALYTICS_PASSWORD:?set DB_ANALYTICS_PASSWORD}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_MIGRATE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weissman}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      WEISSMAN_PUBLIC_BASE_URL: ${WEISSMAN_PUBLIC_BASE_URL:?set WEISSMAN_PUBLIC_BASE_URL to your https origin}
      WEISSMAN_JWT_SECRET: ${WEISSMAN_JWT_SECRET:?set a strong 32+ char WEISSMAN_JWT_SECRET}
      WEISSMAN_RAG_PROVENANCE_SECRET: ${WEISSMAN_RAG_PROVENANCE_SECRET:?set a 64-hex WEISSMAN_RAG_PROVENANCE_SECRET from the vault}
      WEISSMAN_ADMIN_PASSWORD: ${WEISSMAN_ADMIN_PASSWORD:?set a strong WEISSMAN_ADMIN_PASSWORD}
      WEISSMAN_METRICS_TOKEN: ${WEISSMAN_METRICS_TOKEN:?set a 32+ char WEISSMAN_METRICS_TOKEN}
      WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET: ${WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET:?set a 32+ char WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET}
      WEISSMAN_JOB_ORCHESTRATOR_SECRET: ${WEISSMAN_JOB_ORCHESTRATOR_SECRET:?set a 32+ char WEISSMAN_JOB_ORCHESTRATOR_SECRET}
      WEISSMAN_BILLING_STRICT: ${WEISSMAN_BILLING_STRICT:-0}
      WEISSMAN_AGENT_BIN_DIR: /srv/bin/agents
      # The gateway forwards X-Forwarded-For / X-Real-IP; without this the backend keys
      # every request off the gateway's container IP, collapsing per-IP rate limits and
      # login lockout into a single global bucket and making SSE session-IP binding a
      # no-op. Backend is only reachable from the gateway on the private compose network,
      # so the app's default (trust loopback/private peers) is safe; pin
      # WEISSMAN_TRUST_PROXY_CIDRS in .env to narrow it further.
      WEISSMAN_TRUST_PROXY_HEADERS: ${WEISSMAN_TRUST_PROXY_HEADERS:-1}
      # OAST out-of-band correlation (blind SSRF/XXE/Log4Shell). Optional: when
      # WEISSMAN_OAST_DOMAIN is set the launcher also starts the `oast` service and the
      # engines correlate callbacks via WEISSMAN_OAST_LISTENER_URL. Empty => the OAST engine
      # emits an informational "not configured" finding instead of confirmed ones.
      WEISSMAN_OAST_DOMAIN: ${WEISSMAN_OAST_DOMAIN:-}
      WEISSMAN_OAST_API_KEY: ${WEISSMAN_OAST_API_KEY:-}
      WEISSMAN_OAST_LISTENER_URL: ${WEISSMAN_OAST_LISTENER_URL:-http://oast:9090}

  worker:
    logging: *default-logging
    # Must exceed WEISSMAN_WORKER_DRAIN_SECS (25s). Docker's default is 10s, which
    # would SIGKILL the worker mid-drain and make the drain pointless — in-flight
    # scans would still be killed mid-write, just after a longer pause.
    stop_grace_period: 40s
    # Same as backend: the worker runs the scan engines and needs the operator's optional
    # settings (LLM keys, OAST config, vault keys, ...). Explicit entries below still win.
    env_file:
      - path: .env
        required: false
    environment:
      WEISSMAN_ENV: production
      DATABASE_URL: postgresql://${DB_APP_USER:-weissman_app}:${DB_APP_PASSWORD:?set DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_AUTH_DATABASE_URL: postgresql://${DB_AUTH_USER:-weissman_auth}:${DB_AUTH_PASSWORD:?set DB_AUTH_PASSWORD}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_WORKER_DATABASE_URL: postgresql://${DB_WORKER_USER:-weissman_worker}:${DB_WORKER_PASSWORD:?set DB_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_ANALYTICS_DATABASE_URL: postgresql://${DB_ANALYTICS_USER:-weissman_analytics}:${DB_ANALYTICS_PASSWORD:?set DB_ANALYTICS_PASSWORD}@postgres:5432/${POSTGRES_DB:-weissman}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      WEISSMAN_JWT_SECRET: ${WEISSMAN_JWT_SECRET:?set a strong 32+ char WEISSMAN_JWT_SECRET}
      WEISSMAN_RAG_PROVENANCE_SECRET: ${WEISSMAN_RAG_PROVENANCE_SECRET:?set a 64-hex WEISSMAN_RAG_PROVENANCE_SECRET from the vault}
      WEISSMAN_JOB_ORCHESTRATOR_SECRET: ${WEISSMAN_JOB_ORCHESTRATOR_SECRET:?set a 32+ char WEISSMAN_JOB_ORCHESTRATOR_SECRET}
      WEISSMAN_BILLING_STRICT: ${WEISSMAN_BILLING_STRICT:-0}
      # OAST correlation for engines running off the request thread (same as backend).
      WEISSMAN_OAST_DOMAIN: ${WEISSMAN_OAST_DOMAIN:-}
      WEISSMAN_OAST_API_KEY: ${WEISSMAN_OAST_API_KEY:-}
      WEISSMAN_OAST_LISTENER_URL: ${WEISSMAN_OAST_LISTENER_URL:-http://oast:9090}

  # OAST out-of-band interaction listener (blind SSRF/XXE/Log4Shell callback correlation).
  # Only started under the `oast` profile — the launcher enables it when WEISSMAN_OAST_DOMAIN
  # is set, because it requires a DNS zone you delegate to this host. Records callbacks into
  # the app DB (oast_interaction_hits); the engines poll it at WEISSMAN_OAST_LISTENER_URL.
  oast:
    logging: *default-logging
    build:
      context: .
      dockerfile: deploy/oast.Dockerfile
    image: weissman-oast:stable
    profiles: [oast]
    environment:
      DATABASE_URL: postgresql://${DB_APP_USER:-weissman_app}:${DB_APP_PASSWORD:?set DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_ENV: production
      # The zone you delegate to this server (e.g. oast.yourcompany.com). NOT `${VAR:?}`:
      # Compose interpolates EVERY service (even profile-gated ones) on `up`, so a `:?` here
      # would abort the DEFAULT (OAST-off) launch. The launcher only enables this profile
      # when WEISSMAN_OAST_DOMAIN is set, so it is always populated when this service runs.
      WEISSMAN_OAST_DOMAIN: ${WEISSMAN_OAST_DOMAIN:-}
      WEISSMAN_OAST_API_KEY: ${WEISSMAN_OAST_API_KEY:-}
      OAST_HTTP_LISTEN: 0.0.0.0:9090
      OAST_DNS_LISTEN: 0.0.0.0:5353
    ports:
      # HTTP callback catcher (also serves the correlation API). Default host 9091 so it does
      # not clash with Prometheus on 9090. Route your public HTTP callbacks here.
      - "${WEISSMAN_OAST_HTTP_PORT:-9091}:9090"
      # DNS callback catcher (UDP). Delegate your zone's NS to this host:port; forward public
      # :53/udp -> this if your host cannot bind 53 directly.
      - "${WEISSMAN_OAST_DNS_PORT:-5353}:5353/udp"
    expose:
      - "9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --connect-timeout 2 http://127.0.0.1:9090/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Pin monitoring images (base uses floating :latest) for reproducible production.
  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.1.0

  grafana:
    logging: *default-logging
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${WEISSMAN_ADMIN_EMAIL:-admin}
      # No WEISSMAN_ADMIN_PASSWORD fallback: silently reusing the platform super-admin
      # password for Grafana makes any Grafana compromise a platform compromise.
      # start_weissman_live.sh generates this independently.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD (openssl rand -base64 32) — must NOT equal WEISSMAN_ADMIN_PASSWORD}

  # The prod overlay puts Redis behind a password (requirepass), so the exporter must
  # authenticate or every redis_* metric is dead (auth error on each scrape).
  redis-exporter:
    logging: *default-logging
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  alertmanager:
    logging: *default-logging
    image: prom/alertmanager:v0.28.0
