version: 2
updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait 7 days before proposing a newly published version — a freshly
    # published package can be malicious or unstable (supply-chain guard).
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10

  # Rust dependencies (cargo)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
    ignore:
      # dtolnay/rust-toolchain's ref is a RUST TOOLCHAIN version (e.g. @1.91.1
      # installs Rust 1.91.1), not an action release version. Dependabot cannot
      # tell the difference and "bumped" it to @1.100.0 — a Rust version that
      # does not exist — so `Set up Rust toolchain` failed to resolve the ref and
      # the whole github-actions group PR went red. The toolchain version must be
      # chosen deliberately (in lockstep with the workspace's MSRV / clippy lints),
      # so exclude it from auto-bumps entirely; nightly-e2e.yml SHA-pins the same
      # action for supply-chain immutability.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]

  # Container base images — root Dockerfiles
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5

  # Container base images — production deploy Dockerfiles
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
