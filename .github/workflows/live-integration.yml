name: Live Integration (E2E + API smoke)

# Heavy live-stack integration + end-to-end suite, split out of ci.yml so the fast
# static / unit / build / ratchet gates in ci.yml stay green on every push. This suite
# boots the full product stack (Postgres + Redis services, live server + worker, Docker
# images) and runs DAST, Playwright live journeys, and the RLS/SOAR/FP-TP live contracts.
# It runs on pull requests and on demand; it is intentionally NOT a per-push blocker.
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-wiring-and-smoke:
    name: Engine wiring audit & API smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weissman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weissman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Verify engine wiring coverage
        run: node scripts/verify_engine_wiring.mjs

      - name: Generate engine catalog snapshot
        run: node scripts/generate_engine_catalog_snapshot.mjs

      - name: Verify engine scan wiring
        run: node scripts/verify_engine_scan_wiring.mjs

      - name: Verify hub local params wiring
        run: node scripts/verify_hub_local_params.mjs

      - name: Verify command center supreme coverage
        run: node scripts/verify_command_center_coverage.mjs

      - name: Engine reality audit
        run: node scripts/engine_reality_audit.mjs

      - name: Cloud posture catalog parity
        run: node scripts/verify_cloud_posture_catalog.mjs

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Weissman UI compliance audit
        run: node scripts/weissman-ui-audit.mjs

      - name: i18n defaultValue gate
        run: node scripts/verify_i18n_no_default_values.mjs

      - name: i18n templated-key resolution gate
        run: node scripts/verify_i18n_template_keys.mjs

      - name: Build frontend production bundle
        run: npm run build
        working-directory: frontend

      - name: Build weissman-server + worker (warm compile for health check)
        run: cargo build -p weissman-server -p weissman-worker

      - name: Apply database migrations
        env:
          WEISSMAN_MIGRATE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
        run: cargo run -q -p weissman-db --example run_migrate

      - name: Run Rust workspace tests (blocking gate)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          # Fail (don't skip) the DB-backed integration tests here, so a dropped
          # TEST_DATABASE_URL can never masquerade as a green run.
          WEISSMAN_REQUIRE_DB_TESTS: "1"
        run: cargo test --workspace --all-targets

      - name: Add swap for the memory-heavy release LTO build
        # The production image compiles the whole workspace with the Cargo.toml release
        # profile (lto = "fat", codegen-units = 1) — the most memory-hungry config. Fat
        # LTO holds the entire fingerprint_engine workspace IR in one process while
        # linking weissman-server/-worker, which peaks past the ~16 GB runner (also
        # hosting the Postgres/Redis service containers) and the kernel kills the VM
        # (exit 143, "runner received shutdown signal"). Add a large swapfile on the
        # roomy /mnt volume so the LTO link has headroom. Infra-only: the image and its
        # optimization profile are unchanged.
        run: |
          set -euo pipefail
          # dd (not fallocate): a fallocate'd file can have holes that swapon rejects
          # ("skipping - it appears to have holes"); dd writes a contiguous file.
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=14336 status=progress
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "--- memory after adding swap ---"
          free -h

      - name: Build Docker production images
        # `docker compose build` interpolates the whole compose file — including the
        # runtime `environment:` blocks — before building, so docker-compose.yml's
        # `:?` required-variable guards (WEISSMAN_JWT_SECRET, WEISSMAN_ADMIN_PASSWORD)
        # fire at build time even though the images bake none of them (no ARG consumes
        # these). Supply the same throwaway CI values the runtime start steps use so
        # interpolation resolves; the production-safety `:?` guards stay intact.
        env:
          WEISSMAN_JWT_SECRET: ci-weissman-production-smoke-jwt-secret-forty-eight-chars-minimum-v1
          WEISSMAN_ADMIN_PASSWORD: changeme
        run: docker compose build backend worker gateway

      - name: Scan built backend image (Trivy, CRITICAL+HIGH)
        # The fs scan in the security-scan job covers source/deps; this scans the
        # actual runtime image (base OS packages baked into weissman-backend:stable).
        # ignore-unfixed keeps it actionable — only CRITICAL/HIGH with an available fix
        # fail the build (then bump the base image; Dependabot 'docker' helps here).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: weissman-backend:stable
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: Validate docker-compose.test.yml
        run: docker compose -f docker-compose.test.yml config > /dev/null

      - name: Start weissman-server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_MIGRATE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          REDIS_URL: redis://127.0.0.1:6379/0
          WEISSMAN_JWT_SECRET: ci-weissman-production-smoke-jwt-secret-forty-eight-chars-minimum-v1
          WEISSMAN_METRICS_TOKEN: ci-metrics-token-32-bytes-minimum
          WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET: ci-destructive-confirm-secret-32-bytes-minimum
          WEISSMAN_JOB_ORCHESTRATOR_SECRET: ci-job-orchestrator-secret-32-bytes-minimum-v1
          WEISSMAN_ENV: production
          WEISSMAN_COOKIE_SECURE: "1"
          WEISSMAN_ADMIN_EMAIL: admin@localhost
          WEISSMAN_ADMIN_PASSWORD: changeme
          WEISSMAN_MASTER_BOOTSTRAP_EMAIL: ci-smoke@localhost
          WEISSMAN_MASTER_BOOTSTRAP_PASSWORD: ci-smoke-password
          PORT: "18000"
        run: ./target/debug/weissman-server > /tmp/weissman-server.log 2>&1 &

      - name: Start weissman-worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          REDIS_URL: redis://127.0.0.1:6379/0
          WEISSMAN_JWT_SECRET: ci-weissman-production-smoke-jwt-secret-forty-eight-chars-minimum-v1
          WEISSMAN_JOB_ORCHESTRATOR_SECRET: ci-job-orchestrator-secret-32-bytes-minimum-v1
          WEISSMAN_ENV: production
        run: ./target/debug/weissman-worker > /tmp/weissman-worker.log 2>&1 &

      - name: Wait for API health
        env:
          PORT: "18000"
        run: |
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:${PORT}/api/health" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "weissman-server did not become healthy"
          cat /tmp/weissman-server.log || true
          exit 1

      - name: DAST — OWASP ZAP baseline against the live stack (informational)
        # We sell DAST, so we run it against our own live stack every CI build. Non-blocking
        # for now (-I + fail_action:false); promote to blocking with a tuned .zap/rules.tsv
        # once the baseline is clean. ZAP runs inside a container, so 127.0.0.1 would be the
        # container itself — target the runner's docker-bridge gateway to reach the host.
        #
        # `-I` + `fail_action: false` suppress ZAP's alert-driven exit code, but the action
        # can still mark the step failed on other non-zero exits, which aborts the job and
        # skips the *real* live-stack contract gates below (RLS, engine smoke, scan E2E,
        # Playwright, pytest, SOAR, FP/TP). `continue-on-error: true` enforces the documented
        # "informational / non-blocking" intent: the ZAP HTML report is still generated and
        # uploaded as an artifact for triage; only the pipeline gating is lifted. Same pattern
        # as the i18n informational gate above. Promote to blocking once the baseline is tuned.
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://172.17.0.1:18000/api/health
          cmd_options: '-I -a'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Live RLS cross-tenant isolation contract
        env:
          # Superuser connection; the test does SET ROLE weissman_app to exercise
          # real row-level security (the role + migrations were created by the
          # weissman-server boot above).
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
        run: cargo test -p weissman-db --test rls_cross_tenant -- --nocapture

      - name: Smoke one engine per group
        env:
          WEISSMAN_SMOKE_BASE_URL: http://127.0.0.1:18000
          WEISSMAN_SMOKE_LOGIN_EMAIL: ci-smoke@localhost
          WEISSMAN_SMOKE_LOGIN_PASSWORD: ci-smoke-password
          WEISSMAN_TENANT_SLUG: default
          WEISSMAN_SMOKE_POLL_TIMEOUT_MS: "180000"
        run: node scripts/smoke_engine_groups.mjs

      - name: Audit UI scan button paths
        env:
          WEISSMAN_SMOKE_BASE_URL: http://127.0.0.1:18000
          WEISSMAN_SMOKE_LOGIN_EMAIL: ci-smoke@localhost
          WEISSMAN_SMOKE_LOGIN_PASSWORD: ci-smoke-password
          WEISSMAN_TENANT_SLUG: default
          WEISSMAN_UI_AUDIT_POLL_TIMEOUT_MS: "180000"
        run: node scripts/audit_ui_button_scan_paths.mjs

      - name: Live scan pipeline E2E contract
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
          WEISSMAN_E2E_POLL_MS: "2000"
          WEISSMAN_E2E_POLL_MAX: "90"
        run: node scripts/verify_scan_pipeline_e2e.mjs

      - name: Playwright live journey (login → scan → findings → PDF)
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
          PLAYWRIGHT_LIVE: "1"
        run: |
          cd frontend
          npx playwright install chromium
          npm run test:e2e:live -- live-journey live-ui-crawl

      # True-Live counterpart of the mock feature-verify.spec.ts: drives the
      # Findings-console features added this cycle (multi-select bulk status,
      # saved views, URL-shareable severity filter, row density) and the ⌘K
      # command palette against the REAL backend built above (WEISSMAN_ENV=
      # production), and verifies the bulk-status PATCH actually persisted in
      # Postgres via an API round-trip. Reuses the already-running server + the
      # findings the scan steps above wrote to the live DB.
      - name: Playwright True-Live feature specs (bulk · views · URL filter · density)
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
          PLAYWRIGHT_LIVE: "1"
        run: |
          cd frontend
          npm run test:e2e:live -- live-feature

      - name: Generate audit evidence pack
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_EVIDENCE_OUT: ${{ github.workspace }}/evidence-pack/ci
        run: |
          chmod +x scripts/generate_audit_evidence_pack.sh
          ./scripts/generate_audit_evidence_pack.sh

      - name: Upload audit evidence pack
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence-pack
          path: evidence-pack/ci/
          if-no-files-found: error

      - name: Live scan pipeline pytest contract
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
          WEISSMAN_E2E_POLL_MS: "2000"
          WEISSMAN_E2E_POLL_MAX: "90"
        run: python -m pytest tests/e2e/test_scan_pipeline_live.py -v --tb=short

      - name: Engine groups findings + risk E2E
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
          WEISSMAN_FINDINGS_E2E_POLL_MS: "2500"
          WEISSMAN_FINDINGS_E2E_POLL_MAX: "72"
        run: node scripts/verify_engine_groups_findings_e2e.mjs

      - name: SOAR playbook E2E contract
        env:
          WEISSMAN_SMOKE_BASE_URL: http://127.0.0.1:18000
          WEISSMAN_SMOKE_LOGIN_EMAIL: ci-smoke@localhost
          WEISSMAN_SMOKE_LOGIN_PASSWORD: ci-smoke-password
          WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET: ci-destructive-confirm-secret-32-bytes-minimum
          WEISSMAN_DUAL_APPROVAL_SECRET: ci-dual-approval-secret-32-bytes-minimum-v1
        run: node scripts/verify_soar_playbook_e2e.mjs

      - name: FP/TP confidence feedback E2E
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
        run: node scripts/verify_fp_tp_confidence_e2e.mjs

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo '--- weissman-server.log ---'
          cat /tmp/weissman-server.log || true
          echo '--- weissman-worker.log ---'
          cat /tmp/weissman-worker.log || true
