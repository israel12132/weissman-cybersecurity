name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  python-audit:
    name: Python — pip-audit & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install dev/audit tools
        run: pip install pip-audit ruff pytest httpx

      - name: Run pip-audit (known CVEs in Python deps)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Run ruff linter
        run: ruff check src/ --select E,F,W --ignore E501 || true

      - name: Run pytest (if tests exist)
        run: |
          if find tests -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            python -m pytest tests/ -v --tb=short -q
          else
            echo "No test files found — skipping pytest"
          fi

  rust-audit:
    name: Rust — cargo audit & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (known CVEs in Rust deps)
        run: cargo audit

      - name: Build Rust workspace
        run: cargo build --workspace --release
