name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

# Cancel superseded in-progress runs. When a newer commit is pushed to the same
# branch/PR, the older run is cancelled instead of running to completion. This is what
# produced the stream of "Engine wiring" failures on already-superseded SHAs
# (05a51d7 / 4b4196e / 6249d7b): each old commit's ~40-min live stack kept running and
# failing at the doc-metrics gate long after a newer commit had fixed it.
#
# Keyed on the BRANCH NAME, not `github.ref`. A branch with an open PR fires this workflow
# twice — once for `push` (ref `refs/heads/<branch>`) and once for `pull_request` (ref
# `refs/pull/<n>/merge`) — and under the old `github.ref` key those two keys differed, so
# the runs never cancelled each other. Both then built the whole workspace in parallel and
# fought for runner I/O. Measured on one commit (a4f5ce4, runs 30223674764 + 30223676128),
# the identical `cargo test --workspace --all-targets --no-run` took 8m01s in one run and
# 41m49s in the other before its runner was reclaimed ("The runner has received a shutdown
# signal"), while the Postgres service logged 352-second fsync stalls. A third instance of
# the same command sat at 3h24m. `github.head_ref` is the source branch on a PR run and
# empty otherwise, so `head_ref || ref_name` collapses both events onto one key: one run
# per branch. Tag runs (ref_name `v*`) are NEVER cancelled, so a release always finishes.
#
# The repo is part of the key because a branch NAME alone is not unique across repos: a fork
# PR whose source branch is `main` would otherwise land in the same group as this repo's own
# `main` pushes and cancel them. `github.event.pull_request.head.repo.full_name` is the fork
# on a PR run, `github.repository` everywhere else.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  migration-sync:
    name: Migration trees in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check fingerprint_engine ↔ weissman-db migrations
        run: bash scripts/check-migration-sync.sh

  alert-rules:
    name: Prometheus alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing in CI validated the alert rules, which is how `WorkerDown` sat commented out next
    # to a claim that a "stalled-jobs signal below" covered it — while no such rule existed. A
    # four-day pipeline outage then passed unnoticed. promtool checks the rules parse, and the
    # unit tests replay that outage's real metric values to prove the rules actually fire.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install promtool
        run: |
          set -euo pipefail
          VERSION=3.1.0
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${VERSION}/prometheus-${VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-${VERSION}.linux-amd64/promtool"
          promtool --version

      - name: Check rule syntax
        # Exactly the glob Prometheus itself uses (`/etc/prometheus/alerts/*.yml`, non-recursive),
        # so this fails on anything Prometheus would choke on. Unit-test files deliberately live
        # in the tests/ subdirectory, outside that glob: a promtool test file is not a rule file,
        # and leaving one beside the rules makes Prometheus reject the whole directory.
        run: promtool check rules monitoring/alerts/*.yml

      - name: Unit-test alert rules
        working-directory: monitoring/alerts/tests
        run: promtool test rules ./*.test.yml

      - name: No real Alertmanager secret may be committed
        # monitoring/secrets/* is gitignored, but these three files are already TRACKED as
        # documented inert placeholders — and .gitignore does not apply to tracked files. So an
        # operator following the README ("overwrite these at deploy time") would silently make a
        # real Slack webhook or PagerDuty routing key committable. go_live_check.sh asserts the
        # opposite direction (placeholders must be gone before go-live); this asserts that what
        # is in git is still a placeholder.
        run: |
          set -euo pipefail
          bad=0
          for f in monitoring/secrets/slack_api_url monitoring/secrets/pagerduty_routing_key monitoring/secrets/watchdog_url; do
            test -f "$f" || continue
            if ! grep -qE '\.invalid([/:]|$)|^DISABLED$' "$f"; then
              echo "::error file=$f::$f no longer looks like a placeholder — a real secret may be committed. Keep real values out of git (see monitoring/secrets/README.md)."
              bad=1
            fi
          done
          exit $bad

  gateway-contract:
    name: Gateway security contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing in CI exercised the gateway: the ZAP baseline and every UI E2E target the backend
    # directly on :18000, so the entire edge layer shipped untested — and that is where the
    # X-Forwarded-For trust boundary, the SPA redirect, the unknown-path response and the security
    # headers live. Runs the real nginx config against a stub upstream, so it needs no database,
    # no frontend build and no compose stack.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Gateway security contract
        run: bash scripts/test_gateway_contract.sh

  launcher-contract:
    name: Production launcher contract
    runs-on: ubuntu-latest
    # Nothing else in CI exercises start_weissman_live.sh — which is exactly how a
    # swallowed CLI flag and a never-generated production secret both shipped. These
    # checks are static + stubbed: no Docker daemon, no containers, no network.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Launcher flag / secret / bind-mount contract
        run: bash scripts/test_launcher_contract.sh

  python-audit:
    name: Python — pip-audit & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install dev/audit tools
        run: pip install pip-audit ruff pytest httpx

      - name: Run pip-audit (known CVEs in Python deps)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Run ruff linter
        run: ruff check src/ --select E,F,W --ignore E501

      - name: Run pytest (if tests exist)
        run: |
          if find tests/unit -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            python -m pytest tests/unit -v --tb=short -q
          else
            echo "No test files found — skipping pytest"
          fi

  rust-audit:
    name: Rust — audit, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Cut debug info for this job's Rust build. THE dominant cost in the all-targets link is
    # debug info: the workspace links ~2300 test harnesses, and the fingerprint_engine lib-test
    # binary alone is ~2.7 GB with full `debug = 2`. Four `rust-lld` processes each mmap'ing a
    # binary that size is what makes this step I/O-bound — it does not fail, it crawls (measured:
    # the same command took 17m03s on one runner and blew a 60-min budget on another, run
    # 30235471173, with four linkers still resident at the kill).
    #
    # `line-tables-only` rather than `0`: it keeps file+line in panic backtraces — so a failing
    # test is still diagnosable — while dropping the variable/type DWARF that accounts for most
    # of the size. This changes only debug metadata; no codegen, no behaviour, no test outcome.
    #
    # Set at JOB level on purpose. Cargo keys its fingerprint on the profile, so if the compile
    # step and the test-run step disagreed the run step would recompile the whole workspace and
    # defeat the compile/execute split entirely. One place, both steps.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        # SHA-pinned for supply-chain immutability (a tag can be moved upstream; a SHA
        # cannot). The ref is a commit, not a version, so `toolchain:` must be set
        # explicitly — dtolnay/rust-toolchain infers the version from the tag name only.
        uses: dtolnay/rust-toolchain@ab40b01f54fe82bdf65693ea090a1e4942c136e7 # 1.91.1
        with:
          toolchain: 1.91.1
          # rustfmt must be pinned to the toolchain (1.91.1) so `cargo fmt --check`
          # below is deterministic. Without it, cargo falls back to the runner's
          # preinstalled rustfmt, whose formatting drifts from the pinned compiler and
          # fails on code that is correctly formatted for 1.91.1 (e.g. pdf_report.rs).
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Append run_id so the primary key is unique per run: actions/cache
          # skips the post-job save on an EXACT primary-key hit, which otherwise
          # freezes target/ forever once a Cargo.lock-keyed entry exists (no
          # recompiled artifacts are ever re-saved). A unique key always saves,
          # and restore-keys still restores the most recent same-lockfile entry.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Free runner disk (workspace links several large debug binaries)
        # `cargo build --workspace` links weissman-server, weissman-worker AND the
        # fingerprint_engine binary as full debug executables, and `cargo test
        # --all-targets` then links the fingerprint_engine LIB-TEST binary — the largest
        # link of the job (test harness + every dep). rust-lld memory-maps the output and
        # writes its sections in parallel; when the runner disk is exhausted at that moment
        # the mmap'd page can't be committed and the linker faults with SIGBUS (signal 7,
        # "Bus error", core dumped) inside `llvm::parallelFor` — NOT a code error (the same
        # crate links fine in the engine-wiring job, which frees disk first, and cargo check
        # passes). A prior, lighter free-list still let target/ growth cross the ceiling at
        # the test-link step, so reclaim aggressively and cache-preservingly up front (this
        # only removes unused language runtimes / prebuilt toolchains / docker images — never
        # ~/.cargo or target/, so the build cache is untouched) to keep headroom through the
        # test link. `df -h /` records the reclaimed headroom for diagnosis.
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/microsoft || true
          sudo docker image prune -af || true
          df -h /

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (known CVEs in Rust deps)
        # Each ignore below is a transitive advisory with NO fixed upgrade reachable from
        # our own manifests; resolving means changing an upstream crate (tracked as future
        # work). Any NEW advisory still fails the build. Review this list on every dep bump.
        #   RUSTSEC-2023-0071  rsa (Marvin timing attack) — via openidconnect (OIDC
        #                      SSO). No fixed rsa release exists; used for RS256 JWT
        #                      signature *verification*, not RSA decryption.
        # RESOLVED (no longer ignored): RUSTSEC-2026-0098/0099/0104 (rustls-webpki 0.101.7).
        # They rode in on rustls 0.21 via the AWS SDK's legacy hyper-0.14 connector, pulled
        # by each aws-sdk-* crate's default `rustls` feature. Those crates are now declared
        # default-features = false + the modern rustls-aws-lc connector (default-https-client)
        # in fingerprint_engine/Cargo.toml, so the rustls 0.21 / rustls-webpki 0.101.7 subtree
        # is gone from the lock — the advisories cannot fire and a regression would fail here.
        # Also NOT ignored (gone): the former genpdf->printpdf->lopdf advisories (incl.
        # RUSTSEC-2026-0187) and the stale RUSTSEC-2026-0049 — genpdf was replaced by the
        # native %PDF-1.4 writer in fingerprint_engine/src/pdf_report.rs.
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny (license + advisory + source provenance gate)
        # Enforces the dependency-license allow-list (fails on GPL/AGPL/unknown),
        # advisory policy, and crates.io-only sources. Config: deny.toml.
        run: cargo deny check licenses advisories sources bans

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Clippy (correctness + suspicious bug gate)
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious

      - name: Build Rust workspace + test binaries
        # `--no-run` builds the test harnesses too, so the gate below only EXECUTES. Its timeout
        # then measures test runtime rather than a cold compile+link — failure mode A in
        # docs/TECH_DEBT_flaky_db_test_hang.md. Subsumes the old `cargo build --workspace`.
        #
        # Bounded for the same reason every other long step here is: without it this step has no
        # ceiling below GitHub's 360-min job default, and it was observed sitting at 3h24m on a
        # contended runner (run 30223676128) while the identical command finished in 17m03s in the
        # duplicate run of the same commit. 60 min against a ~17-20 min healthy cold link: wide
        # enough that only a genuinely sick runner trips it, tight enough to fail the same day.
        # Deliberately NOT raised again after run 30235471173 tripped it — the fix for that is the
        # job-level debug-info reduction above, not a bigger number.
        timeout-minutes: 60
        run: cargo test --workspace --all-targets --no-run

      - name: Run Rust tests (blocking gate)
        # Execution only — the step above built the binaries, so this never recompiles. Warm
        # execution is ~6 min; 25 min is generous headroom yet still kills a genuine multi-hour
        # hang far below GitHub's 360-min default.
        timeout-minutes: 25
        # `--test-threads=2`: contention-pressure reducer. It narrows the window in which two
        # transactions contend and keeps parallel DB/pool work under the pool ceiling. It is not
        # what bounds a contended advisory lock — weissman_db::advisory_lock does that. Every test
        # still runs and still blocks. See docs/TECH_DEBT_flaky_db_test_hang.md.
        run: cargo test --workspace --all-targets -- --test-threads=2

  security-scan:
    name: Security — secrets & dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks, working tree)
        run: |
          ver=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --redact --no-banner --exit-code 1 --source .
          # History scan is this checkout's ancestry only. actions/checkout fetch-depth:0
          # also fetches every origin branch; gitleaks' default walk then fails this PR on
          # fixture strings that exist only on unrelated agent branches.
          ./gitleaks detect --redact --no-banner --exit-code 1 --source . --log-opts="HEAD"

      - name: Dependency & IaC vuln scan (Trivy filesystem, CRITICAL+HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Dependency vulns only. Secrets are gated by gitleaks above; IaC-misconfig
          # hardening of the deploy/ manifests (readOnlyRootFilesystem, runAsNonRoot,
          # resource limits, ...) is a separate deployment-specific campaign tracked
          # apart from this dependency gate, not a per-PR blocker.
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: IaC misconfig scan (Trivy config, deploy manifests)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy
          # Blocking gate so k8s/network hardening (egress metadata block, network
          # policies, secret handling, container hardening) cannot silently regress.
          # Scoped to CRITICAL to avoid failing on the pre-existing securityContext
          # backlog tracked separately; raise to HIGH as that backlog is burned down.
          severity: CRITICAL
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: Generate SBOM (CycloneDX via Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom-cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
          if-no-files-found: error

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend npm audit (production deps, high+critical CVEs) — blocking
        working-directory: frontend
        # Production dependencies only — the shipped bundle is what matters for
        # supply-chain risk. Build/dev tooling (vite, esbuild, test frameworks)
        # never reaches production; the current dev-only high is the vite
        # `server.fs.deny` bypass (GHSA-fx2h-pf6j-xcff), which affects the dev
        # server, not `vite build` output. Production transitive CVEs (d3 ReDoS
        # via react-simple-maps) are pinned to patched releases via `overrides`.
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend npm audit (ALL deps incl. dev) — informational
        working-directory: frontend
        # Non-blocking visibility into dev-tooling advisories (e.g. the vite
        # GHSA-fx2h-pf6j-xcff high above) that --omit=dev drops from the blocking
        # gate. Surfaces them in the log without failing the build.
        continue-on-error: true
        run: npm audit --audit-level=moderate

  frontend-build:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint (ESLint — fails on errors; warnings are backlog)
        run: npm run lint
        working-directory: frontend

      - name: UI-primitive adoption ratchet (no new raw <table>/<button>)
        run: node scripts/report-ui-primitives.mjs --check

      - name: Engine coverage & accuracy gate (breadth + FP mechanism, from source)
        run: node scripts/engine_coverage_accuracy_report.mjs --check

      - name: MITRE ATT&CK currency gate (no stale/revoked technique IDs)
        run: node scripts/mitre_attack_coverage.mjs --check

      - name: Engine coverage & ATT&CK docs are in sync with source
        run: |
          node scripts/engine_coverage_accuracy_report.mjs >/dev/null
          node scripts/mitre_attack_coverage.mjs >/dev/null
          git diff --exit-code \
            docs/ENGINE_COVERAGE_AND_ACCURACY.md \
            docs/MITRE_ATTACK_COVERAGE.md \
            docs/attack-navigator/ \
            || { echo "::error::A generated coverage artifact is stale — run: node scripts/engine_coverage_accuracy_report.mjs && node scripts/mitre_attack_coverage.mjs"; exit 1; }

      - name: Unit tests with coverage (Vitest ≥60% critical paths)
        run: npm run test:coverage
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Playwright UI smoke (mock API — not live stack)
        run: npx playwright install chromium && npm run test:e2e
        working-directory: frontend

  website-build:
    name: Marketing site — lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Lint
        run: npm run lint
        working-directory: website
      - name: Unit tests
        run: npm test
        working-directory: website
      - name: Typecheck and build
        run: npm run build
        working-directory: website

  engine-wiring-and-smoke:
    name: Engine wiring audit & API smoke
    runs-on: ubuntu-latest
    # Same debug-info cut as `rust-audit`, and it MUST match that job's values — see the long
    # rationale there. Two independent reasons:
    #   1. This job runs the very same `cargo test --workspace --all-targets --no-run`, so it
    #      carries the same linker cost the setting exists to remove.
    #   2. Both jobs restore the SAME cache key (`${{ runner.os }}-cargo-<Cargo.lock hash>`).
    #      Cargo keys its fingerprint on the profile, so a mismatch would make each job's
    #      restored `target/` a total miss for the other and force a full rebuild in both —
    #      strictly worse than having no shared cache at all.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    # Job-level backstop. Without it this job inherited GitHub's 360-min default, so a live suite
    # with no internal bound could burn 4 h before anyone noticed (measured: 240 min). Every
    # long-running step below now carries its own tighter budget; this is the last line of defence.
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weissman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weissman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust toolchain
        # SHA-pinned (supply-chain immutability); explicit toolchain since the ref is a commit.
        uses: dtolnay/rust-toolchain@ab40b01f54fe82bdf65693ea090a1e4942c136e7 # 1.91.1
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Append run_id so the primary key is unique per run: actions/cache
          # skips the post-job save on an EXACT primary-key hit, which otherwise
          # freezes target/ forever once a Cargo.lock-keyed entry exists (no
          # recompiled artifacts are ever re-saved). A unique key always saves,
          # and restore-keys still restores the most recent same-lockfile entry.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        # Must precede the Weissman UI compliance audit below: that script parses the
        # route tree with @babel/parser + @babel/traverse, which are frontend devDeps.
        run: npm ci
        working-directory: frontend

      - name: Verify engine wiring coverage
        run: node scripts/verify_engine_wiring.mjs

      - name: Generate engine catalog snapshot
        run: node scripts/generate_engine_catalog_snapshot.mjs

      - name: Verify engine scan wiring
        run: node scripts/verify_engine_scan_wiring.mjs

      - name: Verify hub local params wiring
        run: node scripts/verify_hub_local_params.mjs

      - name: Verify command center supreme coverage
        run: node scripts/verify_command_center_coverage.mjs

      - name: Engine reality audit
        run: node scripts/engine_reality_audit.mjs

      - name: Doc metrics sync (fail on drift)
        run: node scripts/sync_doc_metrics.mjs --check

      - name: Doc metric references (fail on drift in README/AGENTS/runbooks)
        run: node scripts/verify_doc_metrics.mjs

      - name: Frontend↔backend route contract
        run: node scripts/verify_frontend_route_contract.mjs

      - name: Cloud posture catalog parity
        run: node scripts/verify_cloud_posture_catalog.mjs

      - name: Weissman UI compliance audit
        run: node scripts/weissman-ui-audit.mjs

      - name: i18n defaultValue gate
        run: node scripts/verify_i18n_no_default_values.mjs

      - name: i18n templated-key resolution gate
        run: node scripts/verify_i18n_template_keys.mjs

      - name: Build frontend production bundle
        run: npm run build
        working-directory: frontend

      - name: Build weissman-server + worker (warm compile for health check)
        run: cargo build -p weissman-server -p weissman-worker

      - name: Apply database migrations
        env:
          WEISSMAN_MIGRATE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
        run: cargo run -q -p weissman-db --example run_migrate

      - name: Bound Postgres lock waits (CI database backstop)
        # Defence in depth behind weissman_db::advisory_lock. That module bounds every advisory
        # lock we take TODAY; this bounds every blocking wait any connection to this database can
        # ever make — including ones we do not own (sqlx's own migration advisory lock, a plain
        # `SELECT ... FOR UPDATE`, a DDL ACCESS EXCLUSIVE wait) and any call site added later that
        # forgets the helper. Applied at the DATABASE level so it is inherited by every pool in
        # every test binary, none of which configure timeouts themselves.
        #
        # Runs AFTER migrations so a slow DDL lock during the migration run is never bounded.
        # 30s > the helper's 15s default, so a bounded advisory lock still fails with the precise
        # `55P03 lock_not_available` naming the key rather than this generic net.
        # `idle_in_transaction_session_timeout` reaps the lock HOLDER: a leaked transaction that
        # holds a lock and goes idle is the other half of the hang. 300s is far above any
        # legitimate in-transaction pause by the server/worker on this database, and well below
        # the 25-minute execution-gate budget below, so a genuine leak is cleared inside the job.
        # See docs/TECH_DEBT_flaky_db_test_hang.md before changing either value.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d weissman -v ON_ERROR_STOP=1 <<'SQL'
          ALTER DATABASE weissman SET lock_timeout = '30s';
          ALTER DATABASE weissman SET idle_in_transaction_session_timeout = '300s';
          SQL
          psql -h 127.0.0.1 -U postgres -d weissman -v ON_ERROR_STOP=1 \
            -c "SHOW lock_timeout" -c "SHOW idle_in_transaction_session_timeout"

      - name: Compile Rust test binaries (DB-backed gate)
        # Failure mode A in docs/TECH_DEBT_flaky_db_test_hang.md: this job has no pre-build step
        # for test targets, so the gate below used to compile+link ~2300 test targets INSIDE its
        # own timeout. That is what the repeated ~46-minute step-23 overruns actually were — in
        # run 30188334763 the orphan processes at kill time were rustc/cc/collect2/rust-lld with
        # no test binary running, while the Postgres service crash-looped under I/O starvation.
        # Compiling here gives the link its own budget and makes the gate's timeout mean
        # "the tests hung", which is the only thing a test timeout should ever mean.
        timeout-minutes: 40
        run: cargo test --workspace --all-targets --no-run

      - name: Run Rust workspace tests (blocking gate)
        # Execution only — the step above already built the binaries, so this never recompiles.
        # Warm execution is ~6-8 min; 25 min is generous headroom yet still kills a genuine hang
        # far below GitHub's 360-min default. See docs/TECH_DEBT_flaky_db_test_hang.md.
        timeout-minutes: 25
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          # Fail (don't skip) the DB-backed integration tests here, so a dropped
          # TEST_DATABASE_URL can never masquerade as a green run.
          WEISSMAN_REQUIRE_DB_TESTS: "1"
        # Two contracts require the *running server*, not just a migrated DB, so they are
        # enforced AFTER the server boots — not in this pre-boot gate where they can only
        # false-fail:
        #   - soar_playbook_e2e::isolate_dry_run_verify_and_revert_chain — dispatches an
        #     armored SOAR action, which needs a live integration registered against the
        #     running server; enforced end-to-end by the "SOAR playbook E2E contract" step
        #     (scripts/verify_soar_playbook_e2e.mjs) below.
        #   - rls_cross_tenant::weissman_app_cannot_read_other_tenant_clients — needs the
        #     weissman_app role + forced-RLS the server boot provisions; re-run by the
        #     "Live RLS cross-tenant isolation contract" step below.
        # Everything else stays a hard blocking gate. Skip is by exact fn name (substring),
        # so the server-free sibling test eight_soar_adapters_registered still runs here.
        #
        # `--test-threads=2`: this is the ONLY test run that exercises the DB-backed integration
        # suite (live Postgres + WEISSMAN_REQUIRE_DB_TESTS=1) — the sibling rust-audit and
        # rust-coverage jobs declare no `services`, so those tests skip there. Thread-bounding is
        # a contention-pressure reducer: it narrows the window in which two transactions contend
        # on the same advisory key. It is NOT what bounds the wait — weissman_db::advisory_lock
        # and the database-level backstop above do that (failure mode B in the tech-debt doc; a
        # pool acquire cannot hang, sqlx defaults acquire_timeout to 30s). Every test still runs
        # and still blocks.
        run: |
          cargo test --workspace --all-targets -- \
            --test-threads=2 \
            --skip isolate_dry_run_verify_and_revert_chain \
            --skip weissman_app_cannot_read_other_tenant_clients

      - name: Dump Postgres lock state on test failure
        # `!success()` not `failure()`: failure() is FALSE when a job is cancelled, which is
        # exactly when a stuck-lock diagnosis matters most (same lesson as the Playwright
        # artifact upload — see docs/TECH_DEBT_live_e2e_runtime.md).
        # Makes a future lock problem name its holder instead of being a mystery: the bound above
        # makes the failure fast, this makes it self-describing.
        if: ${{ !success() }}
        continue-on-error: true
        env:
          PGPASSWORD: postgres
        #
        # `query` is emitted with literals redacted. The SHAPE of the statement is what names the
        # culprit, not its values; sqlx uses prepared statements so bound values appear as $1/$2
        # rather than inline, and the only way a value reaches this text is a non-parameterised
        # literal. Both literal syntaxes are covered:
        #   - dollar-quoted, `$$...$$` and `$tag$...$tag$` — this repo's migrations use them for
        #     plpgsql function bodies, so they genuinely occur here;
        #   - single-quoted, `'...'`.
        # Dollar quotes are redacted FIRST: a dollar-quoted body may itself contain single quotes,
        # and redacting those first would break the outer match. `$1`/`$2` placeholders survive
        # because the tag class excludes whitespace.
        #
        # Fed via a QUOTED heredoc (<<'SQL'), not `psql -c "..."` — the regex contains `$`, which
        # a double-quoted shell string would expand.
        run: |
          psql -h 127.0.0.1 -U postgres -d weissman -x <<'SQL' || true
          SELECT pid, state, wait_event_type, wait_event, xact_start, state_change,
                 left(regexp_replace(
                        regexp_replace(query, '\$[A-Za-z_0-9]*\$.*?\$[A-Za-z_0-9]*\$',
                                       '$<redacted>$', 'g'),
                        '''[^'']*''', '''<redacted>''', 'g'), 200) AS query
            FROM pg_stat_activity
           WHERE datname = 'weissman' AND pid <> pg_backend_pid()
           ORDER BY xact_start NULLS LAST;
          SQL
          psql -h 127.0.0.1 -U postgres -d weissman -x <<'SQL' || true
          SELECT locktype, granted, pid, mode, objid, classid
            FROM pg_locks WHERE NOT granted OR locktype = 'advisory'
           ORDER BY granted, pid;
          SQL

      - name: Free runner disk before Docker image build
        # By this point the job has a full debug target/, node_modules, and a built
        # frontend on the stock runner; building three production Docker images on top
        # risks exhausting the root filesystem. Reclaim the unused language toolchains
        # first (same remedy the rust-audit + rust-coverage jobs use).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Build Docker production images
        # `docker compose build` interpolates the ENTIRE compose file at load time, so the
        # two runtime-only required secrets — ${WEISSMAN_JWT_SECRET:?} and
        # ${WEISSMAN_ADMIN_PASSWORD:?} in docker-compose.yml — must be present even though a
        # build never consumes them. Supply CI-throwaway values purely to satisfy parse-time
        # interpolation; the :? runtime hardening in the compose file is left intact.
        env:
          WEISSMAN_JWT_SECRET: ci-weissman-production-smoke-jwt-secret-forty-eight-chars-minimum-v1
          WEISSMAN_ADMIN_PASSWORD: ci-admin-password-24-chars-minimum
        # Override the release profile for THIS CI validation build only: the committed
        # profile.release (lto=fat, codegen-units=1) makes the in-Docker release build of three
        # binaries over the 350k-LOC workspace OOM-kill the runner (exit 143 mid-link). Disable
        # LTO + parallelize codegen so it fits in the runner's memory; the published image (via
        # the publish job, which passes no build-args) keeps the full fat-LTO profile. The image
        # here only needs to build + be Trivy-scanned; it never runs the live stack.
        run: |
          docker compose build \
            --build-arg CARGO_PROFILE_RELEASE_LTO=false \
            --build-arg CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 \
            backend worker gateway

      - name: Scan built backend image (Trivy, CRITICAL+HIGH)
        # The fs scan in the security-scan job covers source/deps; this scans the
        # actual runtime image (base OS packages baked into weissman-backend:stable).
        # ignore-unfixed keeps it actionable — only CRITICAL/HIGH with an available fix
        # fail the build (then bump the base image; Dependabot 'docker' helps here).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: weissman-backend:stable
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: Validate docker-compose.test.yml
        run: docker compose -f docker-compose.test.yml config > /dev/null

      - name: Start weissman-server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_MIGRATE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          REDIS_URL: redis://127.0.0.1:6379/0
          WEISSMAN_JWT_SECRET: ci-weissman-production-smoke-jwt-secret-forty-eight-chars-minimum-v1
          WEISSMAN_METRICS_TOKEN: ci-metrics-token-32-bytes-minimum
          WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET: ci-destructive-confirm-secret-32-bytes-minimum
          WEISSMAN_JOB_ORCHESTRATOR_SECRET: ci-job-orchestrator-secret-32-bytes-minimum-v1
          # Secrets-at-rest vault key (64 hex = 32 bytes). Production refuses to boot without a
          # dedicated key rather than derive one from WEISSMAN_JWT_SECRET (which would couple the
          # token-signing key to MFA/SOAR/CEO-vault decryption). One 64-hex key satisfies both
          # integrations_vault::key_present() and ceo::vault::key_present(). CI-throwaway value.
          WEISSMAN_VAULT_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
          WEISSMAN_ENV: production
          WEISSMAN_COOKIE_SECURE: "1"
          WEISSMAN_ADMIN_EMAIL: admin@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-admin-password-24-chars-minimum
          WEISSMAN_MASTER_BOOTSTRAP_EMAIL: ci-smoke@localhost
          WEISSMAN_MASTER_BOOTSTRAP_PASSWORD: ci-smoke-password
          # The live-scan smoke step logs in ONCE then runs ~18 min (one engine per group,
          # each polled up to 180s). The default access-token TTL is 15 min, so the token
          # expires mid-run and later scan submits/polls 401. Give the CI token room to
          # outlive the whole smoke sweep.
          WEISSMAN_ACCESS_TOKEN_MINUTES: "120"
          # Disable the periodic bulk-scan orchestrator for CI. It dispatches a HEAVY
          # `tenant_full_scan` per active tenant every 60s (60-min job timeout). Those jobs
          # share the worker's 2-slot heavy semaphore with the smoke's on-demand
          # `command_center_engine` scans, and the worker's claim loop reserves a job and then
          # BLOCKS acquiring its heavy permit before it can claim the next. So once two
          # long-running tenant scans hold both heavy permits, the claim loop freezes on the
          # permit and the smoke's on-demand scans are never claimed (attempt_count stays 0 →
          # each group 180s-poll-times-out). Every live-scan E2E step below triggers its OWN
          # on-demand scan (POST /api/command-center/scan), so none of them need the periodic
          # dispatcher — turning it off keeps the heavy lane free for the scans we verify.
          # (The bulk-vs-interactive head-of-line starvation is a real product concern tracked
          # separately from this CI-scoping change.)
          WEISSMAN_SCANNING_ENABLED: "0"
          # Server + worker share ONE Postgres (max_connections=100). Each process opens THREE
          # pools (app + auth + intel), so capping only the app pool leaves auth(12)+intel(12)
          # each uncounted. Cap all three to the sizes the repo's own E2E harness uses
          # (scripts/run_e2e_stack.sh) so the combined footprint stays far under the ceiling
          # (server 24+6+4 + worker 16+4+4 = 58 << 100) with no acquire-timeout pressure.
          WEISSMAN_APP_POOL_MAX: "24"
          WEISSMAN_AUTH_POOL_MAX: "6"
          WEISSMAN_INTEL_POOL_MAX: "4"
          # All live E2E steps in this job share 127.0.0.1. Default per-IP API
          # (30/s), login (8/min), and tenant-scan (24/min) limits are anti-abuse
          # for distributed clients — one CI IP legitimately burns them after
          # smoke + Playwright + findings E2E. Nightly already lifts the API
          # pair; these values are the clamp ceilings in rate_limit_metrics.rs.
          # Production defaults are unchanged. See docs/TECH_DEBT_live_e2e_runtime.md.
          WEISSMAN_RATE_LIMIT_PER_SEC: "500"
          WEISSMAN_RATE_LIMIT_BURST: "2000"
          WEISSMAN_TENANT_SCAN_POSTS_PER_MINUTE: "240"
          WEISSMAN_TENANT_SCAN_BURST: "120"
          WEISSMAN_LOGIN_PER_MINUTE: "60"
          WEISSMAN_LOGIN_BURST: "120"
          PORT: "18000"
        run: ./target/debug/weissman-server > /tmp/weissman-server.log 2>&1 &

      - name: Start weissman-worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          REDIS_URL: redis://127.0.0.1:6379/0
          WEISSMAN_JWT_SECRET: ci-weissman-production-smoke-jwt-secret-forty-eight-chars-minimum-v1
          WEISSMAN_JOB_ORCHESTRATOR_SECRET: ci-job-orchestrator-secret-32-bytes-minimum-v1
          WEISSMAN_ENV: production
          # Required by the production security policy: the worker refuses to boot in
          # WEISSMAN_ENV=production without a policy-valid (>=12-char) admin password,
          # the same rule as the server. The worker has no login surface, so this value
          # only needs to satisfy the startup policy; it is never used to authenticate.
          WEISSMAN_ADMIN_PASSWORD: ci-admin-password-24-chars-minimum
          # Secrets-at-rest vault key (64 hex): the worker runs the same production startup guard
          # and refuses to boot without integrations_vault + ceo_vault keys. CI-throwaway value.
          WEISSMAN_VAULT_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
          # Heavy scans must run at real parallelism. This env block is worker-only: the server
          # step above stays capped at app/auth/intel = 24/6/4, while the worker runs at
          # app/auth/intel = 48/4/4, so the combined pool budget is 86 plus the worker control
          # pool (8) = 94 < Postgres max_connections=100.
          WEISSMAN_APP_POOL_MAX: "48"
          WEISSMAN_AUTH_POOL_MAX: "4"
          WEISSMAN_INTEL_POOL_MAX: "4"
          # Keep the app pool warm so heavy scans do not cold-open connections on the hot path.
          WEISSMAN_APP_POOL_MIN: "8"
          # Fine-grained pool telemetry + active SELECT-1 health-probe (main.rs) to capture the exact
          # stall window and correlate it with the running engine; also keeps a connection hot.
          WEISSMAN_WORKER_POOL_METRICS_SECS: "2"
          # Tighten the per-finding background-DB fan-out cap (default 6) further for CI's single
          # small Postgres: findings_persist fires best-effort side-effect tasks (pentest-memory +
          # SOAR dispatch) per finding, and a high-finding scan's fan-out otherwise pressures the
          # app pool enough that a couple of engines' scans transiently fail to acquire a connection
          # and retry past the poll window. 3 keeps that background work bounded well clear of the
          # pool used by live scan execution.
          WEISSMAN_POST_PERSIST_DB_CONCURRENCY: "3"
          WEISSMAN_WORKER_HEAVY_CONCURRENCY: "4"
          WEISSMAN_AUTO_SUPERPOSITION_COLLAPSE: "1"
        run: ./target/debug/weissman-worker > /tmp/weissman-worker.log 2>&1 &

      - name: Wait for API health
        env:
          PORT: "18000"
        run: |
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:${PORT}/api/health" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "weissman-server did not become healthy"
          cat /tmp/weissman-server.log || true
          exit 1

      - name: DAST — OWASP ZAP baseline against the live stack (informational)
        # We sell DAST, so we run it against our own live stack every CI build. Non-blocking
        # for now (-I + fail_action:false); promote to blocking with a tuned .zap/rules.tsv
        # once the baseline is clean. ZAP runs inside a container, so 127.0.0.1 would be the
        # container itself — target the runner's docker-bridge gateway to reach the host.
        #
        # continue-on-error: the scan itself is already non-blocking (fail_action:false), but
        # action-baseline@v0.12.0 bundles the deprecated v1 artifact uploader, which the
        # current GitHub artifact backend rejects with HTTP 400 ("artifact name ... is not
        # valid") AFTER a clean scan (FAIL-NEW: 0). That action-internal upload error is not a
        # security finding and must not gate the PR (nor skip the live E2E contracts below);
        # this keeps the informational DAST truly non-blocking. TODO: bump action-baseline to a
        # release using upload-artifact@v4 to make the step green rather than tolerated-red.
        continue-on-error: true
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          # Target the served root (SPA + API base), not the JSON /api/health leaf:
          # the baseline spider needs a real link graph to crawl or it scans nothing.
          target: http://172.17.0.1:18000/
          cmd_options: '-I -a'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Live RLS cross-tenant isolation contract
        env:
          # Superuser connection; the test does SET ROLE weissman_app to exercise
          # real row-level security (the role + migrations were created by the
          # weissman-server boot above).
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          # Fail (not skip) if TEST_DATABASE_URL is ever dropped/renamed, so this
          # sole behavioural cross-tenant RLS check can never masquerade as green
          # by hard-skipping — matches the pre-boot gate above.
          WEISSMAN_REQUIRE_DB_TESTS: "1"
        run: cargo test -p weissman-db --test rls_cross_tenant -- --nocapture

      - name: Smoke one engine per group
        env:
          WEISSMAN_SMOKE_BASE_URL: http://127.0.0.1:18000
          WEISSMAN_SMOKE_LOGIN_EMAIL: ci-smoke@localhost
          WEISSMAN_SMOKE_LOGIN_PASSWORD: ci-smoke-password
          WEISSMAN_TENANT_SLUG: default
          # Real multi-engine scans against the CI single-Postgres stack can need a couple of retry
          # attempts under transient connection pressure; give the poller headroom beyond one 180s
          # attempt so a scan that succeeds on retry still reports before the client gives up.
          WEISSMAN_SMOKE_POLL_TIMEOUT_MS: "240000"
        run: node scripts/smoke_engine_groups.mjs

      - name: Audit UI scan button paths
        env:
          WEISSMAN_SMOKE_BASE_URL: http://127.0.0.1:18000
          WEISSMAN_SMOKE_LOGIN_EMAIL: ci-smoke@localhost
          WEISSMAN_SMOKE_LOGIN_PASSWORD: ci-smoke-password
          WEISSMAN_TENANT_SLUG: default
          WEISSMAN_UI_AUDIT_POLL_TIMEOUT_MS: "180000"
        run: node scripts/audit_ui_button_scan_paths.mjs

      - name: Live scan pipeline E2E contract
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
          WEISSMAN_E2E_POLL_MS: "2000"
          WEISSMAN_E2E_POLL_MAX: "90"
        run: node scripts/verify_scan_pipeline_e2e.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('frontend/package-lock.json') }}

      # Hoisted out of the test step: an unbounded ~170MB CDN download used to be billed to the
      # step under investigation and, behind a reporter that prints nothing at test start, was
      # indistinguishable from a wedged test run. Bounded and attributable on its own line now.
      - name: Install Playwright Chromium (live E2E)
        timeout-minutes: 8
        run: cd frontend && npx playwright install chromium

      # SPLIT from the crawl below. The old single step ran BOTH suites under a name mentioning
      # only the journey, so a 150-min step read as though 3 journey tests had hung when in fact
      # 107 crawl tests were grinding. Separate names + separate budgets make the cost visible.
      # timeout-minutes stays ABOVE playwright's globalTimeout (12 min) so Playwright
      # self-terminates first and reaps its browser/ffmpeg children; this is only the backstop.
      - name: Playwright live journey (login → scan → findings → PDF)
        timeout-minutes: 15
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
          PLAYWRIGHT_LIVE: "1"
          # Makes the `list` reporter print each test as it STARTS (it is silent on test-begin
          # for non-TTY streams), so a killed run still shows the in-flight test.
          PLAYWRIGHT_FORCE_TTY: "1"
        run: cd frontend && npm run test:e2e:live -- live-journey

      # 100 appNav routes + 6 named tests, run serially. Budgeted separately because this suite
      # grows automatically with every new Command Center page (appNav is the single source), so
      # its cost must be visible rather than hidden inside another step's number.
      # Measured 3m52s (run 30129211956), down from ~150 min when this ran with a duplicate
      # cockpit boot per route. Playwright's globalTimeout (12 min) fires before this backstop.
      - name: Playwright live UI crawl (every sidebar route)
        timeout-minutes: 15
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
          PLAYWRIGHT_LIVE: "1"
          PLAYWRIGHT_FORCE_TTY: "1"
        run: cd frontend && npm run test:e2e:live -- live-ui-crawl

      - name: Upload Playwright report + traces
        # `always()` (not failure()) so the HTML report and traces survive a cancelled run too —
        # the previous cancellation left literally nothing to read.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-live-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump Playwright live error-context on failure
        # `!success()` rather than `failure()`: `failure()` is FALSE when a job is cancelled, so
        # the one situation where diagnostics matter most produced no output at all.
        if: ${{ !success() }}
        # Surfaces the page's accessibility snapshot (what actually rendered at the failing
        # assertion) into the CI log so a live-journey failure is diagnosable without downloading
        # artifacts. Also tails any live-server log for correlation. Best-effort; never fails the job.
        run: |
          echo "=== Playwright live error-context snapshots ==="
          find frontend/test-results -name 'error-context.md' 2>/dev/null | while read -r f; do
            echo "----- $f -----"; sed -n '1,120p' "$f" 2>/dev/null || true; echo
          done
          echo "=== Playwright result dirs ==="
          find frontend/test-results -maxdepth 2 -type d 2>/dev/null | head -40 || true

      # True-Live counterpart of the mock feature-verify.spec.ts: drives the
      # Findings-console features added this cycle (multi-select bulk status,
      # saved views, URL-shareable severity filter, row density) and the ⌘K
      # command palette against the REAL backend built above (WEISSMAN_ENV=
      # production), and verifies the bulk-status PATCH actually persisted in
      # Postgres via an API round-trip. Reuses the already-running server + the
      # findings the scan steps above wrote to the live DB.
      - name: Playwright True-Live feature specs (bulk · views · URL filter · density)
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
          PLAYWRIGHT_LIVE: "1"
        run: |
          cd frontend
          npm run test:e2e:live -- live-feature

      - name: Generate audit evidence pack
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_EVIDENCE_OUT: ${{ github.workspace }}/evidence-pack/ci
        run: |
          chmod +x scripts/generate_audit_evidence_pack.sh
          ./scripts/generate_audit_evidence_pack.sh

      - name: Upload audit evidence pack
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-evidence-pack
          path: evidence-pack/ci/
          if-no-files-found: error

      # This job is Rust+Node; it never set up Python, so the pytest contract below
      # (python -m pytest, importing httpx) failed to even start once the earlier live
      # steps finally went green and it ran for the first time. Provide the same clean,
      # pip-installable interpreter the Python job uses, then its two imports.
      - name: Set up Python for the live pytest contract
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install live pytest contract deps (pytest + httpx)
        run: python -m pip install --quiet --disable-pip-version-check pytest httpx

      - name: Live scan pipeline pytest contract
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
          WEISSMAN_E2E_POLL_MS: "2000"
          WEISSMAN_E2E_POLL_MAX: "90"
        run: python -m pytest tests/e2e/test_scan_pipeline_live.py -v --tb=short

      - name: Engine groups findings + risk E2E
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
          WEISSMAN_FINDINGS_E2E_POLL_MS: "2500"
          WEISSMAN_FINDINGS_E2E_POLL_MAX: "72"
        run: node scripts/verify_engine_groups_findings_e2e.mjs

      - name: SOAR playbook E2E contract
        env:
          WEISSMAN_SMOKE_BASE_URL: http://127.0.0.1:18000
          WEISSMAN_SMOKE_LOGIN_EMAIL: ci-smoke@localhost
          WEISSMAN_SMOKE_LOGIN_PASSWORD: ci-smoke-password
          WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET: ci-destructive-confirm-secret-32-bytes-minimum
          WEISSMAN_DUAL_APPROVAL_SECRET: ci-dual-approval-secret-32-bytes-minimum-v1
        run: node scripts/verify_soar_playbook_e2e.mjs

      - name: FP/TP confidence feedback E2E
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          WEISSMAN_E2E_TENANT: default
        run: node scripts/verify_fp_tp_confidence_e2e.mjs

      # Light SLO smoke against the already-booted live stack: reuses the running server
      # + ci-smoke admin (proven by the E2E steps above), adds ~20s, and is NON-blocking
      # on PRs (continue-on-error) until the latency/error budget is baselined on this
      # runner class. The full soak (higher VUs / 1m, blocking) runs in nightly-e2e.yml.
      - name: Set up k6 (PR SLO smoke)
        # continue-on-error to match the smoke step below. The k6 SLO smoke is INFORMATIONAL, but
        # this setup step was blocking: when it failed the whole engine-wiring gate went red even
        # though every real contract had already passed. An informational feature must never be
        # able to fail a blocking security gate — that is the defect, not just the bad version.
        continue-on-error: true
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          # Pin the k6 binary too — the action installs latest k6 otherwise, so a runtime
          # change could shift the SLO result independent of the vetted k6_slo.js script.
          # NO leading "v": the action prepends it itself. "v1.8.0" produced a doubled tag and
          # 404'd on .../download/vv1.8.0/k6-vv1.8.0-linux-amd64.tar.gz. Verified: the
          # un-prefixed form resolves to .../download/v1.8.0/k6-v1.8.0-linux-amd64.tar.gz (200).
          k6-version: 1.8.0

      - name: k6 SLO smoke (short, informational)
        continue-on-error: true
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: ci-smoke@localhost
          WEISSMAN_ADMIN_PASSWORD: ci-smoke-password
          K6_VUS: "5"
          K6_DURATION: "20s"
        run: k6 run scripts/load/k6_slo.js

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo '--- weissman-server.log ---'
          cat /tmp/weissman-server.log || true
          echo '--- weissman-worker.log ---'
          cat /tmp/weissman-worker.log || true

  semgrep:
    name: Semgrep SAST (critical blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (security-audit, secrets, owasp-top-ten — blocking)
        # Application-code SAST is fully blocking. The three excluded rules below are
        # reviewed, accepted infrastructure-posture findings (not app-code bugs); each
        # is documented here and stays visible in Semgrep's non-blocking output:
        #   nginx request-host-used            — `$host` is used only in server_name-
        #     gated blocks / standard reverse-proxy Host forwarding to our own trusted
        #     upstream; there is no host-based trust decision to poison.
        #   nginx header-redefinition          — per-location Cache-Control / X-Robots-Tag
        #     overrides are intentional and reviewed.
        #   nginx possible-h2c-smuggling       — TLS-terminated edge; the websocket map
        #     (nginx-snippet-websocket-map.conf) now forwards an upgrade only for a real
        #     `Upgrade: websocket`, so H2C cannot be smuggled to the backend.
        # Secret-detection rules stay ACTIVE everywhere; the engines' own test-fixture
        # tokens are suppressed inline (`// nosemgrep`) on their exact lines.
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --metrics off \
            --error \
            --exclude-rule generic.nginx.security.request-host-used.request-host-used \
            --exclude-rule generic.nginx.security.header-redefinition.header-redefinition \
            --exclude-rule generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling

      # Project-specific rules (.semgrep/weissman-rules.yml) run SEPARATELY and NON-blocking
      # first, so we can judge signal-to-noise on the real tree before promoting any into the
      # blocking scan above. Omitting --error means FINDINGS never fail the step (semgrep exits
      # 0). We intentionally do NOT set continue-on-error: a malformed rules file or a semgrep
      # engine error (exit 2/4/5/7) SHOULD fail loudly instead of being silently swallowed —
      # the config is local (.semgrep/, no registry/network), so the only failure modes are
      # our own broken rules, which we want surfaced.
      - name: Weissman custom Semgrep rules (informational)
        run: semgrep scan --config .semgrep/ --metrics off

  rust-coverage:
    name: Rust — coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # SHA-pinned (supply-chain immutability); explicit toolchain since the ref is a commit.
      - uses: dtolnay/rust-toolchain@ab40b01f54fe82bdf65693ea090a1e4942c136e7 # 1.91.1
        with:
          toolchain: 1.91.1
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Coverage (workspace lib tests) — per-crate ratchet
        # Security-critical code should carry measured coverage, not just green tests.
        # Per-crate floors live in scripts/coverage-floors.json: a fixed 40% for the maintained
        # crates (weissman-core, weissman-ui-provenance, weissman-ast-cap) and a current-coverage
        # quarantine for the legacy crates. Coverage may only go up, never down. Collect once,
        # then emit both lcov (artifact) and json (ratchet input) from the cached profdata.
        run: |
          cargo llvm-cov --workspace --all-targets --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --json --output-path cov.json
          node scripts/coverage_ratchet.mjs cov.json
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-lcov
          path: lcov.info
          if-no-files-found: warn

  publish:
    name: Publish signed image (tags only)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Only build+publish after the quality gates pass, and only for release tags.
    needs: [migration-sync, python-audit, rust-audit, rust-coverage, security-scan, frontend-build, engine-wiring-and-smoke, semgrep]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign + provenance attestation
      attestations: write # actions/attest-*
    env:
      IMAGE: ghcr.io/${{ github.repository }}/weissman-backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          sbom: true # BuildKit SBOM attestation
          provenance: mode=max # BuildKit SLSA provenance attestation

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the published image (keyless / OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest SLSA build provenance (GitHub, pushed to registry)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate image SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-backend.cdx.json

      - name: Attest SBOM (pushed to registry)
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-backend.cdx.json
          push-to-registry: true

      - name: Print digest to pin in k8s
        run: |
          echo "::notice title=Pin this digest in deploy/k8s/backend-deployment.yaml::${IMAGE}@${{ steps.build.outputs.digest }}"
          echo "Verify with:"
          echo "  cosign verify ${IMAGE}@${{ steps.build.outputs.digest }} \\"
          echo "    --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' \\"
          echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          echo "  gh attestation verify oci://${IMAGE}@${{ steps.build.outputs.digest }} -R ${{ github.repository }}"
