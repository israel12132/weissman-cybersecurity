name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  migration-sync:
    name: Migration trees in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check fingerprint_engine ↔ weissman-db migrations
        run: bash scripts/check-migration-sync.sh

  python-audit:
    name: Python — pip-audit & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install dev/audit tools
        run: pip install pip-audit ruff pytest httpx

      - name: Run pip-audit (known CVEs in Python deps)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Run ruff linter
        run: ruff check src/ --select E,F,W --ignore E501

      - name: Run pytest (if tests exist)
        run: |
          if find tests/unit -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            python -m pytest tests/unit -v --tb=short -q
          else
            echo "No test files found — skipping pytest"
          fi

  rust-audit:
    name: Rust — audit, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (known CVEs in Rust deps)
        # Each ignore below is a transitive advisory with NO fixed upgrade available;
        # resolving means replacing the upstream crate (tracked as future work). Any
        # NEW advisory still fails the build. Review this list on every dep bump.
        #   RUSTSEC-2023-0071  rsa (Marvin timing attack) — via openidconnect (OIDC
        #                      SSO). No fixed rsa release exists; used for RS256 JWT
        #                      signature *verification*, not RSA decryption.
        #   RUSTSEC-2026-0098/0099/0104  time 0.2.x — via genpdf→lopdf/printpdf (PDF
        #                      reports). genpdf 0.2.0 is the latest/unmaintained;
        #                      fixing requires migrating off genpdf.
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Clippy (correctness + suspicious bug gate)
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious

      - name: Run Rust tests
        run: cargo test --workspace

  security-scan:
    name: Security — secrets & dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Secret scan (gitleaks, working tree)
        run: |
          ver=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --redact --no-banner --exit-code 1 --source .

      - name: Dependency & IaC vuln scan (Trivy filesystem, CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend npm audit (critical CVEs only)
        working-directory: frontend
        run: npm audit --audit-level=critical

  frontend-build:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint (ESLint — fails on errors; warnings are backlog)
        run: npm run lint
        working-directory: frontend

      - name: Unit tests (Vitest)
        run: npm run test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  engine-wiring-and-smoke:
    name: Engine wiring audit & API smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weissman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weissman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Verify engine wiring coverage
        run: node scripts/verify_engine_wiring.mjs

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend production bundle
        run: npm run build
        working-directory: frontend

      - name: Build weissman-server + worker (warm compile for health check)
        run: cargo build -p weissman-server -p weissman-worker

      - name: Build Docker production images
        run: docker compose build backend worker gateway

      - name: Scan built backend image (Trivy, CRITICAL)
        # The fs scan in the security-scan job covers source/deps; this scans the
        # actual runtime image (base OS packages baked into weissman-backend:stable).
        # ignore-unfixed keeps it actionable — only CRITICALs with an available fix
        # fail the build (then bump the base image; Dependabot 'docker' helps here).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: weissman-backend:stable
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Validate docker-compose.test.yml
        run: docker compose -f docker-compose.test.yml config > /dev/null

      - name: Start weissman-server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_MIGRATE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          REDIS_URL: redis://127.0.0.1:6379/0
          WEISSMAN_JWT_SECRET: ci-engine-smoke-secret
          WEISSMAN_METRICS_TOKEN: ci-metrics-token-32-bytes-minimum
          WEISSMAN_ENV: production
          WEISSMAN_COOKIE_SECURE: "1"
          WEISSMAN_ADMIN_EMAIL: admin@localhost
          WEISSMAN_ADMIN_PASSWORD: changeme
          WEISSMAN_MASTER_BOOTSTRAP_EMAIL: ci-smoke@localhost
          WEISSMAN_MASTER_BOOTSTRAP_PASSWORD: ci-smoke-password
          PORT: "18000"
        run: ./target/debug/weissman-server > /tmp/weissman-server.log 2>&1 &

      - name: Start weissman-worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          REDIS_URL: redis://127.0.0.1:6379/0
          WEISSMAN_JWT_SECRET: ci-engine-smoke-secret
          WEISSMAN_ENV: production
        run: ./target/debug/weissman-worker > /tmp/weissman-worker.log 2>&1 &

      - name: Wait for API health
        env:
          PORT: "18000"
        run: |
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:${PORT}/api/health" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "weissman-server did not become healthy"
          cat /tmp/weissman-server.log || true
          exit 1

      - name: Live RLS cross-tenant isolation contract
        env:
          # Superuser connection; the test does SET ROLE weissman_app to exercise
          # real row-level security (the role + migrations were created by the
          # weissman-server boot above).
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
        run: cargo test -p weissman-db --test rls_cross_tenant -- --ignored --nocapture

      - name: Smoke one engine per group
        env:
          WEISSMAN_SMOKE_BASE_URL: http://127.0.0.1:18000
          WEISSMAN_SMOKE_LOGIN_EMAIL: ci-smoke@localhost
          WEISSMAN_SMOKE_LOGIN_PASSWORD: ci-smoke-password
          WEISSMAN_TENANT_SLUG: default
          WEISSMAN_SMOKE_POLL_TIMEOUT_MS: "180000"
        run: node scripts/smoke_engine_groups.mjs

      - name: Audit UI scan button paths
        env:
          WEISSMAN_SMOKE_BASE_URL: http://127.0.0.1:18000
          WEISSMAN_SMOKE_LOGIN_EMAIL: ci-smoke@localhost
          WEISSMAN_SMOKE_LOGIN_PASSWORD: ci-smoke-password
          WEISSMAN_TENANT_SLUG: default
          WEISSMAN_UI_AUDIT_POLL_TIMEOUT_MS: "180000"
        run: node scripts/audit_ui_button_scan_paths.mjs

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo '--- weissman-server.log ---'
          cat /tmp/weissman-server.log || true
          echo '--- weissman-worker.log ---'
          cat /tmp/weissman-worker.log || true

  semgrep:
    name: Semgrep SAST (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      # Report-only: `semgrep scan` exits 0 on findings (only --error blocks), so this
      # never breaks the build today. Findings print to the CI log. Once the baseline
      # is clean, add `--error` to turn this into a hard gate. Complements CodeQL
      # (codeql.yml) which covers JS/TS + Python via the Security tab.
      - name: Run Semgrep (security-audit, secrets, owasp-top-ten)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --metrics off || true
