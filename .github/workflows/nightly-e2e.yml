name: Nightly E2E (full findings)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  findings-e2e-full:
    name: Full engine groups findings E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Ephemeral CI-only secrets. Production boot gates in
    # fingerprint_engine::security_startup refuse to start unless these are all
    # present and strong (JWT >=48 chars; orchestrator/metrics/destructive >=32;
    # vault key 64 hex). Shared at job scope so weissman-server and
    # weissman-worker sign/verify the job bus and decrypt vault data with the
    # SAME values. These are throwaway values for the ephemeral runner DB only.
    env:
      WEISSMAN_JWT_SECRET: nightly-e2e-jwt-secret-min-48-chars-rotate-in-real-prod-0123456789
      WEISSMAN_JOB_ORCHESTRATOR_SECRET: nightly-e2e-orchestrator-secret-min-32-chars-0123456789
      WEISSMAN_METRICS_TOKEN: nightly-e2e-metrics-token-min-32-chars-0123456789
      WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET: nightly-e2e-destructive-confirm-min-32-chars-0123456789
      WEISSMAN_VAULT_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # Dedicated RAG HMAC (64 hex). Production refuses JWT/council fallback.
      WEISSMAN_RAG_PROVENANCE_SECRET: a1b2c3d4e5f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff00
      # Cap DB pools so weissman-server + weissman-worker together stay well under
      # postgres max_connections (default 100). At defaults each process opens
      # ~68 connections (app 48 + auth 12 + intel 8); two processes exceeded 100,
      # so sqlx acquire timed out under scan load ("pool timed out while waiting
      # for an open connection") and engine jobs failed to record completion.
      # Each process opens app+auth+intel = 24+6+4 = 34; two processes = 68 < 100.
      WEISSMAN_APP_POOL_MAX: "24"
      WEISSMAN_AUTH_POOL_MAX: "6"
      WEISSMAN_INTEL_POOL_MAX: "4"
      # Raise the per-IP API rate limit for the single-source load generator.
      # The k6 SLO smoke drives ~60-75 req/s from ONE IP (127.0.0.1); the edge +
      # inner per-IP limiters default to 30/s (burst 60) and correctly 429 that
      # single hammering IP — which is anti-abuse behavior, NOT a backend
      # availability defect. The SLO gate itself is the k6 latency/error budget
      # (http_req_failed<1%, p95 read<800ms), and those thresholds still apply in
      # full. In production the 99.9% SLA is measured across thousands of client
      # IPs, none individually exceeding 30/s, so the per-IP throttle never fires.
      # Lift it to the clamp ceiling here so the load test measures true backend
      # throughput/latency instead of the abuse limiter (same spirit as the
      # ephemeral-DB fsync tuning: CI infra config, not a change to the gate).
      WEISSMAN_RATE_LIMIT_PER_SEC: "500"
      WEISSMAN_RATE_LIMIT_BURST: "2000"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weissman
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weissman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@ab40b01f54fe82bdf65693ea090a1e4942c136e7 # 1.91.1
        with:
          toolchain: 1.91.1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend production bundle (served by weissman-server)
        working-directory: frontend
        run: npm run build

      - name: Tune Postgres for CI (ephemeral DB — disable durability to kill checkpoint I/O stalls)
        run: |
          # ROOT CAUSE of the live-E2E flakiness: this runner's disk is slow, so
          # postgres checkpoints fsync dirty buffers for 40-80s. During that
          # window queries stall (I/O starvation), connections stay checked out
          # past the 30s sqlx acquire_timeout, and the pool exhausts — surfacing
          # as "pool timed out while waiting for an open connection" (worker
          # claim + event-sourced completion) and "unexpected EOF on client
          # connection with an open transaction". Each run a random engine's job
          # failed to record completion and the E2E timed out.
          # The CI database is thrown away at job end, so durability is
          # irrelevant: turning fsync off makes checkpoints near-instant and
          # removes the stalls entirely. fsync/full_page_writes/checkpoint_timeout
          # are SIGHUP-reloadable, so pg_reload_conf() applies them with no
          # restart (max_connections would need a restart; we don't touch it).
          for i in $(seq 1 30); do
            PGPASSWORD=postgres pg_isready -h 127.0.0.1 -U postgres -d weissman && break
            sleep 2
          done
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d weissman -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SYSTEM SET fsync = off;
          ALTER SYSTEM SET synchronous_commit = off;
          ALTER SYSTEM SET full_page_writes = off;
          ALTER SYSTEM SET checkpoint_timeout = '30min';
          ALTER SYSTEM SET max_wal_size = '4GB';
          SELECT pg_reload_conf();
          SHOW fsync;
          SQL

      - name: Apply database migrations
        env:
          WEISSMAN_MIGRATE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
        run: cargo run -q -p weissman-db --example run_migrate

      - name: Build server and worker
        run: cargo build -p weissman-server -p weissman-worker

      - name: Start weissman-server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_MIGRATE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          REDIS_URL: redis://127.0.0.1:6379/0
          WEISSMAN_ENV: production
          RUST_LOG: info,weissman_server=debug,fingerprint_engine=info,weissman_db=info
          WEISSMAN_COOKIE_SECURE: "1"
          WEISSMAN_MASTER_BOOTSTRAP_EMAIL: nightly@localhost
          WEISSMAN_MASTER_BOOTSTRAP_PASSWORD: nightly-e2e-password
          PORT: "18000"
          # Disable the orchestrator's 60s auto-dispatch loop: otherwise it floods
          # the worker's heavy slots with tenant_full_scan jobs, starving the
          # findings-E2E's explicit per-engine scans (they timed out). The E2E
          # drives scans itself via /api/command-center/scan.
          WEISSMAN_SCANNING_ENABLED: "0"
        run: ./target/debug/weissman-server > /tmp/weissman-server.log 2>&1 &

      - name: Start weissman-worker
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          WEISSMAN_AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/weissman
          REDIS_URL: redis://127.0.0.1:6379/0
          WEISSMAN_ENV: production
          RUST_LOG: info,weissman_server=debug,fingerprint_engine=info,weissman_db=info
          # Nightly must exercise the real heavy lane rather than a serialized fallback. This env
          # block is worker-only: the job-level server cap remains app/auth/intel = 24/6/4, while
          # the worker runs at 48/6/4, so the combined footprint is 88 < Postgres max_connections=100.
          WEISSMAN_APP_POOL_MAX: "48"
          WEISSMAN_WORKER_HEAVY_CONCURRENCY: "4"
          WEISSMAN_WORKER_LIGHT_CONCURRENCY: "2"
          WEISSMAN_AUTO_SUPERPOSITION_COLLAPSE: "1"
        run: ./target/debug/weissman-worker > /tmp/weissman-worker.log 2>&1 &

      - name: Wait for API health
        run: |
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:18000/api/health" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Full findings E2E (all engine groups)
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: nightly@localhost
          WEISSMAN_ADMIN_PASSWORD: nightly-e2e-password
          WEISSMAN_E2E_TENANT: default
          WEISSMAN_FINDINGS_E2E_FULL: "1"
          WEISSMAN_FINDINGS_E2E_POLL_MS: "2500"
          # 160 * 2.5s = 400s per engine. The runner's slow disk causes 40-84s
          # postgres checkpoint stalls; a fast engine whose DB persist lands
          # inside a stall can momentarily exceed the old 300s window even
          # though it completes. 400s absorbs that variance without masking a
          # genuinely hung engine (those are bounded via job_params).
          WEISSMAN_FINDINGS_E2E_POLL_MAX: "160"
        run: node scripts/verify_engine_groups_findings_e2e.mjs

      # True-Live UI feature specs against the same production-mode backend: the
      # findings written above now have UI features driven end-to-end (bulk
      # status → verified persisted in Postgres, saved views, URL severity
      # filter, row density, ⌘K palette).
      - name: Playwright True-Live feature specs (bulk · views · URL filter · density)
        working-directory: frontend
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: nightly@localhost
          WEISSMAN_ADMIN_PASSWORD: nightly-e2e-password
          WEISSMAN_E2E_TENANT: default
          PLAYWRIGHT_LIVE: "1"
        run: |
          npx playwright install chromium
          npm run test:e2e:live -- live-feature

      # Load/SLO smoke: grounds the 99.9% availability SLA with a real latency +
      # error budget (k6 thresholds fail the job) against the same live backend.
      - name: Set up k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1

      - name: Load/SLO smoke (k6)
        env:
          WEISSMAN_E2E_BASE: http://127.0.0.1:18000
          WEISSMAN_ADMIN_EMAIL: nightly@localhost
          WEISSMAN_ADMIN_PASSWORD: nightly-e2e-password
          K6_VUS: "15"
          K6_DURATION: 1m
        run: k6 run scripts/load/k6_slo.js

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo '--- weissman-server.log ---'
          cat /tmp/weissman-server.log || true
          echo '--- weissman-worker.log ---'
          cat /tmp/weissman-worker.log || true

  fuzz:
    name: Fuzz fuzz_core (nightly, time-boxed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install nightly toolchain + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo install cargo-fuzz --locked
      - name: Fuzz mutate target (120s)
        working-directory: fuzz_core
        run: cargo +nightly fuzz run mutate -- -max_total_time=120 -rss_limit_mb=4096
      - name: Fuzz analyze target (120s)
        working-directory: fuzz_core
        run: cargo +nightly fuzz run analyze -- -max_total_time=120 -rss_limit_mb=4096
      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz_core/fuzz/artifacts/
          if-no-files-found: ignore

  backup-restore-verify:
    name: Backup PITR restore-verify (self-contained)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Prove a pg_basebackup can actually be RESTORED, not just that files exist. Fully
      # self-contained: create a source cluster, back it up with the image's own
      # (version-matched) pg_basebackup, then run the production restore-verify script.
      - name: Backup → restore round-trip
        run: |
          set -euo pipefail
          IMG=pgvector/pgvector:pg16
          BASE_DIR=/tmp/weissman-backups/base
          mkdir -p "$BASE_DIR/base_ci"

          docker run -d --name bkp-src \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=weissman "$IMG"
          for _ in $(seq 1 30); do docker exec bkp-src pg_isready -U postgres -q && break; sleep 2; done

          # Seed a _sqlx_migrations table so the restore sanity check has data to assert on.
          docker exec bkp-src psql -U postgres -d weissman -c \
            "CREATE TABLE IF NOT EXISTS _sqlx_migrations(version bigint primary key, description text); \
             INSERT INTO _sqlx_migrations VALUES (1,'ci-seed') ON CONFLICT DO NOTHING;"

          # Base backup via the container's own pg_basebackup over the local socket
          # (local replication is trust in the official image).
          docker exec bkp-src bash -lc 'rm -rf /tmp/bb && mkdir -p /tmp/bb && \
            pg_basebackup -U postgres -D /tmp/bb -Ft -z -X stream'
          docker cp bkp-src:/tmp/bb/base.tar.gz "$BASE_DIR/base_ci/base.tar.gz"
          docker cp bkp-src:/tmp/bb/pg_wal.tar.gz "$BASE_DIR/base_ci/pg_wal.tar.gz" || true
          ln -sfn "$BASE_DIR/base_ci" "$BASE_DIR/latest"
          docker rm -f bkp-src

          WEISSMAN_PITR_BASE_DIR="$BASE_DIR" ./scripts/backup_restore_verify.sh
