name: Deploy (verify-signed image → k8s)

# Closes the deploy loop: the publish job (ci.yml, on tags) builds, cosign-signs
# (keyless) and SLSA-attests the backend image by digest — but nothing consumed
# that signature, and deploy/k8s used the mutable `:latest` tag. This workflow makes
# the signature enforced at the consumption point: it VERIFIES the signature for a
# given digest (fail-closed) before pinning that digest into the manifests and
# applying them. Manual (workflow_dispatch) so a human authorizes each rollout.

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Signed backend image digest to deploy (e.g. sha256:abc123...)"
        required: true

permissions:
  contents: read
  id-token: write # cosign keyless verify

env:
  IMAGE: ghcr.io/israel12132/weissman-cybersecurity/weissman-backend
  # Bind the workflow input to an env var so it is never interpolated as ${{ }} inside a
  # run: shell (which Semgrep flags as a code-injection sink). Shells read it as "$IMAGE_DIGEST".
  IMAGE_DIGEST: ${{ inputs.image_digest }}

jobs:
  deploy:
    name: Verify signature and roll out
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate the cluster credential behind a GitHub Environment so KUBECONFIG_B64 can
    # live in the environment's secret scope (with required reviewers / ref
    # restrictions configured in repo settings) rather than at repository scope.
    # If the environment has no protection rules yet this is a no-op, but it makes
    # the intended review/ref gate the single place to enforce.
    environment: production
    # Never let two rollouts interleave kubectl apply against the same namespace.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Read-only checkout: this job never pushes back, so don't leave the
          # GitHub token in .git/config for later steps (least privilege).
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signature (fail closed)
        # `inputs.image_digest` is passed via env (never interpolated into the
        # script text) so untrusted workflow input can't inject shell — see
        # Semgrep run-shell-injection (sg.run/pkzk).
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          # Anchor (^…$) and escape the dots so the identity is the literal workflow
          # URI, not a substring match (an unescaped `.` matches any char, and without
          # anchors `/.github/` would match `/Xgithub/`). The publish job that signs
          # only runs on `refs/tags/v*`, so bind to that ref prefix. Independently
          # assert the workflow-repository extension so a matching SAN from a fork or
          # unrelated workflow cannot satisfy the check.
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/israel12132/weissman-cybersecurity/\.github/workflows/ci\.yml@refs/tags/v.*$' \
            --certificate-github-workflow-repository israel12132/weissman-cybersecurity \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${IMAGE_DIGEST}"

      - name: Pin the verified digest into the k8s manifests
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          DIGEST_REF="${IMAGE}@${IMAGE_DIGEST}"
          # Replace any `image: <IMAGE>:tag` or existing digest with the verified digest.
          # NUL-delimited so filenames with spaces/newlines are handled safely.
          # NOTE: use `#` as the sed delimiter — the regex alternation below contains `|`,
          # which collides with `|` if it is also used as the s/// delimiter (invalid script).
          while IFS= read -r -d '' f; do
            sed -i -E "s#image: ${IMAGE}(:[^[:space:]]+|@sha256:[^[:space:]]+)#image: ${DIGEST_REF}#g" "$f"
            echo "pinned $f -> ${DIGEST_REF}"
          done < <(grep -rlZ "${IMAGE}" deploy/k8s || true)

      - name: Render pinned manifests (artifact for review / GitOps)
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          mkdir -p _render && cp deploy/k8s/*.yaml _render/
          # GitHub artifact names forbid ':', so map `sha256:<hex>` -> `sha256-<hex>`.
          # Value comes via the environment (IMAGE_DIGEST) to keep shell-injection safe.
          echo "ARTIFACT_NAME=rendered-k8s-${IMAGE_DIGEST//:/-}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: _render/

      - name: Apply to cluster (only when a KUBECONFIG secret is configured)
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_DATA:-}" ]; then
            echo "No KUBECONFIG_B64 secret set — signature verified and manifests pinned/rendered (uploaded as artifact), but not applied. Configure KUBECONFIG_B64 to enable rollout."
            exit 0
          fi
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl apply -f deploy/k8s/backend-deployment.yaml -f deploy/k8s/worker-deployment.yaml
          kubectl rollout status deployment/weissman-backend -n weissman --timeout=180s
          kubectl rollout status deployment/weissman-worker -n weissman --timeout=180s
