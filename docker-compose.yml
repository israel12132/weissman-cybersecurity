# Weissman Phase 2: PostgreSQL + Rust API + Nginx (SPA + /api /ws proxy on :80).
# Run from repo root: docker compose up --build
#
# Prerequisites: copy `.env.example` → `.env` and set WEISSMAN_JWT_SECRET + WEISSMAN_ADMIN_PASSWORD.
# Production: also set WEISSMAN_ENV=production, WEISSMAN_COOKIE_SECURE=1, strong DB_* passwords,
# WEISSMAN_METRICS_TOKEN (≥32 chars), and WEISSMAN_PUBLIC_BASE_URL (HTTPS).
#
# URLs: http://localhost/ → Command Center. Migrations run once at backend start when WEISSMAN_MIGRATE_URL is set.
#
# DB roles (from sqlx migrations): postgres superuser runs migrations; app uses weissman_app (RLS); auth uses weissman_auth (BYPASSRLS).

# Bounded container logs. Docker's json-file driver defaults to *unbounded* growth and
# /etc/docker/daemon.json does not exist on the deployment host, so nothing capped it. Postgres
# alone wrote 101 MB in 9.5h (155,589 ERROR + 155,588 STATEMENT entries, each dumping the full
# failing SQL) and on 2026-07-03 filled the disk outright:
#   PANIC: could not write to file "pg_logical/replorigin_checkpoint.tmp": No space left on device
# followed by 183 x FATAL and the checkpointer aborting — a whole-stack outage caused purely by
# log growth. 50m x 3 caps each container at 150 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    # cap_drop ALL alone makes this image exit at startup — its entrypoint chowns the data
    # directory and gosu's to the postgres user, which needs these five. Verified by
    # running the image both ways.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging: *default-logging
    # 200 to match deploy/k8s/postgres-ha.yaml:26. The image default is 100 (97 usable after
    # superuser_reserved_connections=3), but the two application processes are configured to open
    # up to 152: backend 72 (app 48 + auth 12 + intel 12) and worker 80 (app 48 + auth 12 +
    # intel 12 + control 8). Under the concurrent load the pools exist to survive, Postgres starts
    # refusing with SQLSTATE 53300 and the worker's control-plane pool — built specifically so
    # job-state writes can never be starved — is the one that cannot connect, so finished jobs
    # never record their terminal state. Compose was the outlier here; k8s already had 200.
    command:
      - postgres
      - -c
      - max_connections=200
    # pgvector/pgvector:pg16 = official Postgres 16 with pgvector pre-installed.
    # Drop-in replacement for postgres:16; same data files, same env vars.
    # Required for: supreme_council_memory.embedding (vector(1536)) RAG retrieval.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-weissman}
      # Page checksums, so silent corruption is detected instead of returned as data.
      # The live cluster was initialised without them ("Data page checksums are
      # disabled.") and has since survived 8 unclean crashes, 11 automatic recoveries,
      # a checkpointer SIGABRT and a full-disk PANIC — every one of which can tear a
      # page. With checksums off Postgres reads a torn page back without complaint.
      #
      # NOTE: initdb args apply only to a FRESH data directory. An existing cluster
      # needs a dump/restore to gain checksums; until then run pg_amcheck periodically.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - weissman_pg:/var/lib/postgresql/data
    # No host port mapping: Postgres is reachable only on the internal compose network
    # (backend/worker connect via postgres:5432; migrations run in-container at boot via
    # WEISSMAN_MIGRATE_URL). Debug locally with `docker compose exec postgres psql -U postgres`.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-weissman}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M

  redis:
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    # Same as postgres: setpriv drops to the redis user at entrypoint and needs these.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging: *default-logging
    image: redis:7-alpine
    # No host port mapping: Redis is reachable only on the internal compose network
    # (backend/worker connect via redis://redis:6379). Debug locally with
    # `docker compose exec redis redis-cli`. Never expose 6379 to the host/Internet.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 64M

  backend:
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: weissman-backend:stable
    environment:
      DATABASE_URL: postgresql://${DB_APP_USER:-weissman_app}:${DB_APP_PASSWORD:-weissman_dev_secret}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_AUTH_DATABASE_URL: postgresql://${DB_AUTH_USER:-weissman_auth}:${DB_AUTH_PASSWORD:-weissman_auth_dev}@postgres:5432/${POSTGRES_DB:-weissman}
      # Read-only role for "Ask Weissman" (NL->SQL, /api/ask). SELECT-only, 15s statement
      # timeout, RLS-scoped (migration 20260608140300). Without it the endpoint returns 503.
      WEISSMAN_READ_ONLY_DATABASE_URL: postgresql://${DB_RO_USER:-weissman_ro}:${DB_RO_PASSWORD:-weissman_ro_dev}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_MIGRATE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_MIGRATIONS_DIR: /srv/migrations
      REDIS_URL: redis://redis:6379/0
      WEISSMAN_PUBLIC_BASE_URL: ${WEISSMAN_PUBLIC_BASE_URL:-http://localhost}
      # Required secrets — set in `.env` (see .env.example). Compose refuses to start without them.
      WEISSMAN_JWT_SECRET: "${WEISSMAN_JWT_SECRET:?Set WEISSMAN_JWT_SECRET in .env (openssl rand -base64 48)}"
      # Optional: require X-Weissman-Destructive-Confirm header (exact match) for Auto-Heal, containment execute, deception cloud deploy
      WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET: ${WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET:-}
      # Zero-trust job bus HMAC signing (server signs, worker verifies — they MUST match).
      # Required >=32 chars in production; security_startup.rs fails the boot closed without it.
      WEISSMAN_JOB_ORCHESTRATOR_SECRET: ${WEISSMAN_JOB_ORCHESTRATOR_SECRET:-}
      WEISSMAN_ADMIN_EMAIL: ${WEISSMAN_ADMIN_EMAIL:-admin@localhost}
      WEISSMAN_ADMIN_PASSWORD: "${WEISSMAN_ADMIN_PASSWORD:?Set WEISSMAN_ADMIN_PASSWORD in .env}"
      # HTTPS-only session cookies in production (WEISSMAN_ENV=production); default 0 for local http://localhost
      WEISSMAN_COOKIE_SECURE: ${WEISSMAN_COOKIE_SECURE:-0}
      # Strict Paddle subscription + monthly scan quota (auto-on when WEISSMAN_ENV=production)
      WEISSMAN_BILLING_STRICT: ${WEISSMAN_BILLING_STRICT:-0}
      # Production: set WEISSMAN_ENV=production + WEISSMAN_METRICS_TOKEN (≥32 chars) in `.env`
      WEISSMAN_ENV: ${WEISSMAN_ENV:-}
      WEISSMAN_METRICS_TOKEN: ${WEISSMAN_METRICS_TOKEN:-}
      # Secrets-at-rest keys. Production boot (security_startup.rs) refuses to derive these
      # from WEISSMAN_JWT_SECRET. They must be listed here — Compose does not pass host/.env
      # variables into the container unless they appear in `environment:` or `env_file`.
      WEISSMAN_VAULT_KEY: ${WEISSMAN_VAULT_KEY:-}
      WEISSMAN_INTEGRATIONS_VAULT_KEY: ${WEISSMAN_INTEGRATIONS_VAULT_KEY:-}
      # Optional first-boot master admin. All THREE must reach the container or the feature
      # is inert: crates/weissman-db/src/lib.rs skips bootstrap unless WEISSMAN_MASTER_BOOTSTRAP_EMAIL
      # is set together with a password or bcrypt hash. (EMAIL was previously never plumbed.)
      WEISSMAN_MASTER_BOOTSTRAP_EMAIL: ${WEISSMAN_MASTER_BOOTSTRAP_EMAIL:-}
      WEISSMAN_MASTER_BOOTSTRAP_PASSWORD: ${WEISSMAN_MASTER_BOOTSTRAP_PASSWORD:-}
      WEISSMAN_MASTER_BOOTSTRAP_BCRYPT: ${WEISSMAN_MASTER_BOOTSTRAP_BCRYPT:-}
      PORT: "8000"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # PORT env var defaults to 8000 - see backend environment section.
      # Use 127.0.0.1, not localhost: Debian images often resolve localhost to ::1 first,
      # and this process binds IPv4 (0.0.0.0), so an IPv6 probe can fail while the API is up.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          memory: 512M

  # Async jobs (scan pipelines, engines off the HTTP request thread). Same image as backend.
  worker:
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    # Must exceed WEISSMAN_WORKER_DRAIN_SECS (25s). Docker's default is 10s, which
    # would SIGKILL the worker mid-drain and make the drain pointless — in-flight
    # scans would still be killed mid-write, just after a longer pause.
    stop_grace_period: 40s
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: weissman-backend:stable
    entrypoint: ["/usr/local/bin/weissman-worker"]
    environment:
      DATABASE_URL: postgresql://${DB_APP_USER:-weissman_app}:${DB_APP_PASSWORD:-weissman_dev_secret}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_AUTH_DATABASE_URL: postgresql://${DB_AUTH_USER:-weissman_auth}:${DB_AUTH_PASSWORD:-weissman_auth_dev}@postgres:5432/${POSTGRES_DB:-weissman}
      REDIS_URL: redis://redis:6379/0
      WEISSMAN_JWT_SECRET: "${WEISSMAN_JWT_SECRET:?Set WEISSMAN_JWT_SECRET in .env}"
      # Must be byte-identical to the backend's value — the worker verifies job envelopes the server signed.
      WEISSMAN_JOB_ORCHESTRATOR_SECRET: ${WEISSMAN_JOB_ORCHESTRATOR_SECRET:-}
      WEISSMAN_BILLING_STRICT: ${WEISSMAN_BILLING_STRICT:-0}
      # Production guards run in the worker too (security_startup.rs). These must reach
      # this process, not only the API container.
      WEISSMAN_ENV: ${WEISSMAN_ENV:-}
      WEISSMAN_ADMIN_PASSWORD: ${WEISSMAN_ADMIN_PASSWORD:-}
      WEISSMAN_VAULT_KEY: ${WEISSMAN_VAULT_KEY:-}
      WEISSMAN_INTEGRATIONS_VAULT_KEY: ${WEISSMAN_INTEGRATIONS_VAULT_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness = "the dequeue path works", not "the process exists".
      #
      # This used to be `cat /proc/1/comm | grep -q weissman-worker`, which only asked whether the
      # binary was running. Between 2026-08-06 and 2026-08-10 the worker was running and failing
      # every single claim with `invalid input syntax for type bigint: ""`; that check reported
      # healthy for the entire four days.
      #
      # The worker now writes /tmp/weissman-worker-alive after each dequeue round-trip that
      # reached the database (an empty queue counts — that is a healthy steady state; a failed
      # claim does not). This asserts the file was modified within the last 2 minutes, which is
      # ~160 idle poll cycles of headroom at POLL_IDLE_MS=750, or 60 error-backoff cycles.
      # `$$` escapes compose's own interpolation so the shell sees a single `$`.
      test:
        - CMD-SHELL
        - test -n "$$(find /tmp/weissman-worker-alive -mmin -2 2>/dev/null)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
        reservations:
          memory: 512M

  gateway:
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    # Without a tag, compose names the built image after the project directory, so it cannot be
    # pulled, promoted between environments, or Trivy-scanned the way weissman-backend:stable is.
    image: weissman-gateway:stable
    ports:
      # Bound to loopback by DEFAULT because this listener is plain HTTP. There is no TLS
      # anywhere in the stack — no 443 listener, no redirect, no terminator container — so
      # publishing on 0.0.0.0 put the Command Center login, the admin password and the issued
      # JWT on the wire in cleartext for anyone on the host's LAN or any on-path device. For a
      # security product that is not an acceptable default.
      #
      # To expose it, put a TLS terminator in front and point it at 127.0.0.1:80, or set
      # WEISSMAN_GATEWAY_BIND=0.0.0.0 to consciously accept cleartext on the network.
      - "${WEISSMAN_GATEWAY_BIND:-127.0.0.1}:${WEISSMAN_GATEWAY_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Exercise the proxy path, not just the filesystem. The previous check fetched
      # /command-center/ — a static file nginx serves from its own image — so it passed
      # whenever nginx was alive, which is the one thing that was never in doubt. It stayed
      # green with the backend unreachable, and "gateway healthy" told an operator nothing
      # about whether the site actually worked. /api/health proxies to weissman_backend, so
      # this now fails when the upstream is down.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          memory: 64M

  # ─── Observability stack ────────────────────────────────────────────────────
  # Optional but strongly recommended for production. Start with:
  #   docker compose --profile monitoring up -d
  # Prometheus scrapes /metrics from the backend service (port 9090 internal).
  prometheus:
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    image: prom/prometheus:latest
    profiles: [monitoring]
    environment:
      WEISSMAN_METRICS_TOKEN: ${WEISSMAN_METRICS_TOKEN:-}
      WEISSMAN_ADMIN_EMAIL: ${WEISSMAN_ADMIN_EMAIL:-admin@localhost}
      WEISSMAN_ADMIN_PASSWORD: ${WEISSMAN_ADMIN_PASSWORD:-}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - ./monitoring/prometheus-web.generated.yml:/etc/prometheus/web.yml:ro
      # Plaintext credential for Prometheus's own self-scrape: --web.config.file gates
      # /metrics too, so without this the self-scrape 401s (it did, for 30 days straight).
      # Generated by scripts/sync_monitoring_admin.sh; gitignored.
      - ./monitoring/prometheus-scrape-password.generated:/etc/prometheus/scrape-password:ro
      - weissman_prometheus:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -n "$${WEISSMAN_METRICS_TOKEN:-}" ]; then
          printf '%s' "$$WEISSMAN_METRICS_TOKEN" > /etc/prometheus/metrics_token
          chmod 600 /etc/prometheus/metrics_token
        else
          echo "WARN: WEISSMAN_METRICS_TOKEN unset — create /etc/prometheus/metrics_token manually for scrape auth" >&2
          : > /etc/prometheus/metrics_token
        fi
        # Require a REGULAR non-empty file. `[ -s ]` alone is true for a directory (its
        # size is non-zero), and Docker silently creates web.yml as a directory when the
        # host bind source is missing — which used to launch Prometheus with
        # --web.config.file pointing at a directory, and it exited 1 in a crash loop.
        # Fail closed: refuse to start unauthenticated rather than expose :9090 wide open.
        if [ ! -f /etc/prometheus/web.yml ] || [ ! -s /etc/prometheus/web.yml ]; then
          echo "FATAL: /etc/prometheus/web.yml is missing or empty — run 'scripts/sync_monitoring_admin.sh prometheus' before starting the monitoring profile (the launcher does this in preflight)." >&2
          exit 1
        fi
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.config.file=/etc/prometheus/web.yml
    # Bound to loopback: the banner advertises 127.0.0.1:9090, and Prometheus exposes the
    # full metric set (tenant ids, host telemetry, DB internals). Publishing on all
    # interfaces would expose it to anyone who can reach the host. --web.enable-lifecycle
    # is intentionally dropped (nothing POSTs /-/reload; it would allow remote /-/quit).
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    image: grafana/grafana:latest
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${WEISSMAN_ADMIN_EMAIL:-admin}
      # Dev default is a distinct literal, never WEISSMAN_ADMIN_PASSWORD — see
      # docker-compose.prod.yml for why the two must not be the same credential.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-weissman-grafana-dev}
      # Consumed by monitoring/grafana/provisioning/datasources/prometheus.yml. Without
      # them the datasource is provisioned with no credentials and every panel 401s.
      MONITORING_BASIC_AUTH_USER: ${MONITORING_BASIC_AUTH_USER:-weissman-monitoring}
      MONITORING_BASIC_AUTH_PASSWORD: ${MONITORING_BASIC_AUTH_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    # Loopback only, matching the advertised URL. Grafana has its own login, but keeping
    # it off public interfaces by default is safer; front it with the reverse proxy/TLS
    # (or change this mapping) to expose it.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - weissman_grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  alertmanager:
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    image: prom/alertmanager:latest
    profiles: [monitoring]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Persist silences + the notification log, else they are lost on every restart
      # (an operator's "silence this alert for 4h" would evaporate).
      - weissman_alertmanager:/alertmanager
      # Delivery secrets as files (api_url_file / routing_key_file / url_file). The config
      # loads and Alertmanager starts even when these are empty/absent; drop real values
      # in to activate Slack/PagerDuty/heartbeat. Previously the config used un-substituted
      # ${SLACK_WEBHOOK_URL} placeholders with no envsubst step, so it crash-looped on boot.
      # Committed placeholders in monitoring/secrets/ let the stack start (see its README).
      - ./monitoring/secrets:/etc/alertmanager/secrets:ro
      - ./monitoring/alertmanager-web.generated.yml:/etc/alertmanager/web.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      # Without this the API is wide open to every container on the compose network:
      # GET /api/v2/alerts and POST /api/v2/silences both returned 200 unauthenticated,
      # so any container — including the backend, which runs attack-engine code and ships
      # an SSRF engine — could silence the entire alerting pipeline untraceably.
      - '--web.config.file=/etc/alertmanager/web.yml'
    expose:
      - "9093"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # --- Exporters (host / redis / postgres metrics + synthetic HTTP probes) ---
  node-exporter:
    # The four exporters ran with no memory limit, no CPU limit and no
    # healthcheck: a leaking or wedged exporter could consume the host and
    # would still report as running, while its metrics silently went stale.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    image: prom/node-exporter:v1.8.2
    profiles: [monitoring]
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    restart: unless-stopped

  redis-exporter:
    # The four exporters ran with no memory limit, no CPU limit and no
    # healthcheck: a leaking or wedged exporter could consume the host and
    # would still report as running, while its metrics silently went stale.
    # No healthcheck: oliver006/redis_exporter is a scratch image with no shell and no wget, so
    # any CMD-SHELL probe would fail permanently and report the container unhealthy forever —
    # worse than having none. Verified by running the image. Its liveness is covered by
    # ExporterDown (up{job="redis"} == 0) in monitoring/alerts/infra-alerts.yml, which is the
    # signal that actually matters: whether Prometheus can scrape it.
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    image: oliver006/redis_exporter:v1.66.0
    profiles: [monitoring]
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    depends_on:
      - redis
    restart: unless-stopped

  postgres-exporter:
    # The four exporters ran with no memory limit, no CPU limit and no
    # healthcheck: a leaking or wedged exporter could consume the host and
    # would still report as running, while its metrics silently went stale.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9187/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    profiles: [monitoring]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-weissman}?sslmode=disable"
    expose:
      - "9187"
    depends_on:
      - postgres
    restart: unless-stopped

  blackbox-exporter:
    # Runs its daemon as root by default (verified: PID 1 `blackbox_export` uid=0),
    # unlike every other exporter here, which already drops to nobody. This deployment
    # only issues HTTP probes, so it needs no CAP_NET_RAW and nothing above nobody.
    # (postgres and redis were also reported as root, but their daemons already drop
    # privileges — `docker exec id -u` shows the image user, not PID 1.)
    user: "65534:65534"
    # The four exporters ran with no memory limit, no CPU limit and no
    # healthcheck: a leaking or wedged exporter could consume the host and
    # would still report as running, while its metrics silently went stale.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9115/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    image: prom/blackbox-exporter:v0.25.0
    profiles: [monitoring]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    expose:
      - "9115"
    restart: unless-stopped

  # --- Distributed tracing backend (Grafana Tempo, OTLP receiver). To export spans, set
  #     WEISSMAN_OTLP_ENDPOINT=http://tempo:4318/v1/traces on backend + worker. ---
  tempo:
    # Least privilege. The stack previously ran every container with the full default
    # capability set and no no-new-privileges, so a compromised engine had setuid
    # escalation and CAP_NET_RAW available to it by default.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    image: grafana/tempo:2.6.1
    profiles: [tracing]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
      - weissman_tempo:/var/tempo
    expose:
      - "4318" # OTLP/HTTP
      - "3200" # Tempo query API
    restart: unless-stopped

volumes:
  weissman_pg:
  weissman_prometheus:
  weissman_grafana:
  weissman_alertmanager:
  weissman_tempo:

# Pin the bridge subnet. deploy/nginx-gateway.conf trusts exactly 172.19.0.1/32 as its
# X-Forwarded-For proxy (the address a same-host reverse proxy arrives from); if Docker were
# free to auto-assign a different subnet on network re-create, that entry would silently stop
# matching and real_ip resolution would break — or, worse, start matching something else.
networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/16
