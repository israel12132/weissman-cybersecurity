# Weissman Phase 2: PostgreSQL + Rust API + Nginx (SPA + /api /ws proxy on :80).
# Run from repo root: docker compose up --build
#
# Prerequisites: copy `.env.example` → `.env` and set WEISSMAN_JWT_SECRET + WEISSMAN_ADMIN_PASSWORD.
# Production: also set WEISSMAN_ENV=production, WEISSMAN_COOKIE_SECURE=1, strong DB_* passwords,
# WEISSMAN_METRICS_TOKEN (≥32 chars), and WEISSMAN_PUBLIC_BASE_URL (HTTPS).
#
# URLs: http://localhost/ → Command Center. Migrations run once at backend start when WEISSMAN_MIGRATE_URL is set.
#
# DB roles (from sqlx migrations): postgres superuser runs migrations; app uses weissman_app (RLS); auth uses weissman_auth (BYPASSRLS).

services:
  postgres:
    # pgvector/pgvector:pg16 = official Postgres 16 with pgvector pre-installed.
    # Drop-in replacement for postgres:16; same data files, same env vars.
    # Required for: supreme_council_memory.embedding (vector(1536)) RAG retrieval.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-weissman}
    volumes:
      - weissman_pg:/var/lib/postgresql/data
    # No host port mapping: Postgres is reachable only on the internal compose network
    # (backend/worker connect via postgres:5432; migrations run in-container at boot via
    # WEISSMAN_MIGRATE_URL). Debug locally with `docker compose exec postgres psql -U postgres`.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-weissman}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    # No host port mapping: Redis is reachable only on the internal compose network
    # (backend/worker connect via redis://redis:6379). Debug locally with
    # `docker compose exec redis redis-cli`. Never expose 6379 to the host/Internet.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 64M

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: weissman-backend:stable
    environment:
      DATABASE_URL: postgresql://${DB_APP_USER:-weissman_app}:${DB_APP_PASSWORD:-weissman_dev_secret}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_AUTH_DATABASE_URL: postgresql://${DB_AUTH_USER:-weissman_auth}:${DB_AUTH_PASSWORD:-weissman_auth_dev}@postgres:5432/${POSTGRES_DB:-weissman}
      # Read-only role for "Ask Weissman" (NL->SQL, /api/ask). SELECT-only, 15s statement
      # timeout, RLS-scoped (migration 20260608140300). Without it the endpoint returns 503.
      WEISSMAN_READ_ONLY_DATABASE_URL: postgresql://${DB_RO_USER:-weissman_ro}:${DB_RO_PASSWORD:-weissman_ro_dev}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_MIGRATE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_MIGRATIONS_DIR: /srv/migrations
      REDIS_URL: redis://redis:6379/0
      WEISSMAN_PUBLIC_BASE_URL: ${WEISSMAN_PUBLIC_BASE_URL:-http://localhost}
      # Required secrets — set in `.env` (see .env.example). Compose refuses to start without them.
      WEISSMAN_JWT_SECRET: "${WEISSMAN_JWT_SECRET:?Set WEISSMAN_JWT_SECRET in .env (openssl rand -base64 48)}"
      # Optional: require X-Weissman-Destructive-Confirm header (exact match) for Auto-Heal, containment execute, deception cloud deploy
      WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET: ${WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET:-}
      # Zero-trust job bus HMAC signing (server signs, worker verifies — they MUST match).
      # Required >=32 chars in production; security_startup.rs fails the boot closed without it.
      WEISSMAN_JOB_ORCHESTRATOR_SECRET: ${WEISSMAN_JOB_ORCHESTRATOR_SECRET:-}
      WEISSMAN_ADMIN_EMAIL: ${WEISSMAN_ADMIN_EMAIL:-admin@localhost}
      WEISSMAN_ADMIN_PASSWORD: "${WEISSMAN_ADMIN_PASSWORD:?Set WEISSMAN_ADMIN_PASSWORD in .env}"
      # HTTPS-only session cookies in production (WEISSMAN_ENV=production); default 0 for local http://localhost
      WEISSMAN_COOKIE_SECURE: ${WEISSMAN_COOKIE_SECURE:-0}
      # Strict Paddle subscription + monthly scan quota (auto-on when WEISSMAN_ENV=production)
      WEISSMAN_BILLING_STRICT: ${WEISSMAN_BILLING_STRICT:-0}
      # Production: set WEISSMAN_ENV=production + WEISSMAN_METRICS_TOKEN (≥32 chars) in `.env`
      WEISSMAN_ENV: ${WEISSMAN_ENV:-}
      WEISSMAN_METRICS_TOKEN: ${WEISSMAN_METRICS_TOKEN:-}
      # Optional first-boot master admin. All THREE must reach the container or the feature
      # is inert: crates/weissman-db/src/lib.rs skips bootstrap unless WEISSMAN_MASTER_BOOTSTRAP_EMAIL
      # is set together with a password or bcrypt hash. (EMAIL was previously never plumbed.)
      WEISSMAN_MASTER_BOOTSTRAP_EMAIL: ${WEISSMAN_MASTER_BOOTSTRAP_EMAIL:-}
      WEISSMAN_MASTER_BOOTSTRAP_PASSWORD: ${WEISSMAN_MASTER_BOOTSTRAP_PASSWORD:-}
      WEISSMAN_MASTER_BOOTSTRAP_BCRYPT: ${WEISSMAN_MASTER_BOOTSTRAP_BCRYPT:-}
      PORT: "8000"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # PORT env var defaults to 8000 - see backend environment section
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          memory: 512M

  # Async jobs (scan pipelines, engines off the HTTP request thread). Same image as backend.
  worker:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: weissman-backend:stable
    entrypoint: ["/usr/local/bin/weissman-worker"]
    environment:
      DATABASE_URL: postgresql://${DB_APP_USER:-weissman_app}:${DB_APP_PASSWORD:-weissman_dev_secret}@postgres:5432/${POSTGRES_DB:-weissman}
      WEISSMAN_AUTH_DATABASE_URL: postgresql://${DB_AUTH_USER:-weissman_auth}:${DB_AUTH_PASSWORD:-weissman_auth_dev}@postgres:5432/${POSTGRES_DB:-weissman}
      REDIS_URL: redis://redis:6379/0
      WEISSMAN_JWT_SECRET: "${WEISSMAN_JWT_SECRET:?Set WEISSMAN_JWT_SECRET in .env}"
      # Must be byte-identical to the backend's value — the worker verifies job envelopes the server signed.
      WEISSMAN_JOB_ORCHESTRATOR_SECRET: ${WEISSMAN_JOB_ORCHESTRATOR_SECRET:-}
      WEISSMAN_BILLING_STRICT: ${WEISSMAN_BILLING_STRICT:-0}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Check the process is alive by verifying /proc/1/comm matches the binary name.
      test: ["CMD-SHELL", "cat /proc/1/comm | grep -q weissman-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
        reservations:
          memory: 512M

  gateway:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/command-center/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          memory: 64M

  # ─── Observability stack ────────────────────────────────────────────────────
  # Optional but strongly recommended for production. Start with:
  #   docker compose --profile monitoring up -d
  # Prometheus scrapes /metrics from the backend service (port 9090 internal).
  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    environment:
      WEISSMAN_METRICS_TOKEN: ${WEISSMAN_METRICS_TOKEN:-}
      WEISSMAN_ADMIN_EMAIL: ${WEISSMAN_ADMIN_EMAIL:-admin@localhost}
      WEISSMAN_ADMIN_PASSWORD: ${WEISSMAN_ADMIN_PASSWORD:-}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - ./monitoring/prometheus-web.generated.yml:/etc/prometheus/web.yml:ro
      - weissman_prometheus:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -n "$${WEISSMAN_METRICS_TOKEN:-}" ]; then
          printf '%s' "$$WEISSMAN_METRICS_TOKEN" > /etc/prometheus/metrics_token
          chmod 600 /etc/prometheus/metrics_token
        else
          echo "WARN: WEISSMAN_METRICS_TOKEN unset — create /etc/prometheus/metrics_token manually for scrape auth" >&2
          : > /etc/prometheus/metrics_token
        fi
        # Require a REGULAR non-empty file. `[ -s ]` alone is true for a directory (its
        # size is non-zero), and Docker silently creates web.yml as a directory when the
        # host bind source is missing — which used to launch Prometheus with
        # --web.config.file pointing at a directory, and it exited 1 in a crash loop.
        # Fail closed: refuse to start unauthenticated rather than expose :9090 wide open.
        if [ ! -f /etc/prometheus/web.yml ] || [ ! -s /etc/prometheus/web.yml ]; then
          echo "FATAL: /etc/prometheus/web.yml is missing or empty — run 'scripts/sync_monitoring_admin.sh prometheus' before starting the monitoring profile (the launcher does this in preflight)." >&2
          exit 1
        fi
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.config.file=/etc/prometheus/web.yml
    # Bound to loopback: the banner advertises 127.0.0.1:9090, and Prometheus exposes the
    # full metric set (tenant ids, host telemetry, DB internals). Publishing on all
    # interfaces would expose it to anyone who can reach the host. --web.enable-lifecycle
    # is intentionally dropped (nothing POSTs /-/reload; it would allow remote /-/quit).
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${WEISSMAN_ADMIN_EMAIL:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${WEISSMAN_ADMIN_PASSWORD:-weissman-grafana-dev}}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    # Loopback only, matching the advertised URL. Grafana has its own login, but keeping
    # it off public interfaces by default is safer; front it with the reverse proxy/TLS
    # (or change this mapping) to expose it.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - weissman_grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  alertmanager:
    image: prom/alertmanager:latest
    profiles: [monitoring]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Persist silences + the notification log, else they are lost on every restart
      # (an operator's "silence this alert for 4h" would evaporate).
      - weissman_alertmanager:/alertmanager
      # Delivery secrets as files (api_url_file / routing_key_file / url_file). The config
      # loads and Alertmanager starts even when these are empty/absent; drop real values
      # in to activate Slack/PagerDuty/heartbeat. Previously the config used un-substituted
      # ${SLACK_WEBHOOK_URL} placeholders with no envsubst step, so it crash-looped on boot.
      # Committed placeholders in monitoring/secrets/ let the stack start (see its README).
      - ./monitoring/secrets:/etc/alertmanager/secrets:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    expose:
      - "9093"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # --- Exporters (host / redis / postgres metrics + synthetic HTTP probes) ---
  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: [monitoring]
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    profiles: [monitoring]
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    depends_on:
      - redis
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    profiles: [monitoring]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-weissman}?sslmode=disable"
    expose:
      - "9187"
    depends_on:
      - postgres
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    profiles: [monitoring]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    expose:
      - "9115"
    restart: unless-stopped

  # --- Distributed tracing backend (Grafana Tempo, OTLP receiver). To export spans, set
  #     WEISSMAN_OTLP_ENDPOINT=http://tempo:4318/v1/traces on backend + worker. ---
  tempo:
    image: grafana/tempo:2.6.1
    profiles: [tracing]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
      - weissman_tempo:/var/tempo
    expose:
      - "4318" # OTLP/HTTP
      - "3200" # Tempo query API
    restart: unless-stopped

volumes:
  weissman_pg:
  weissman_prometheus:
  weissman_grafana:
  weissman_alertmanager:
  weissman_tempo:
