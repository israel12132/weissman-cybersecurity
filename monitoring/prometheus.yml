# Prometheus configuration for Weissman Cybersecurity
# Production scrape targets match docker-compose.yml service names.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'weissman-prod'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Weissman backend application metrics (Rust metrics endpoint).
  # IMPORTANT: weissman-server exposes Prometheus metrics at `/api/metrics` on the
  # same HTTP port as the API (8000 in docker-compose), NOT on :9090 or `/metrics`.
  # See fingerprint_engine/src/observability.rs and http/serve.rs ("/api/metrics").
  - job_name: 'weissman-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/api/metrics'
    scrape_interval: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

  # Exporters — provided by the `monitoring` profile in docker-compose.yml.
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Synthetic (blackbox) probes — external-perspective health of the API + public status page.
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://backend:8000/api/health
          - http://gateway:80/status
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
