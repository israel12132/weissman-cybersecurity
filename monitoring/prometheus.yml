# Prometheus configuration for Weissman Cybersecurity
# Production scrape targets match docker-compose.yml service names.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'weissman-prod'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Weissman backend application metrics (Rust metrics endpoint)
  - job_name: 'weissman-backend'
    static_configs:
      - targets: ['backend:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis metrics via redis_exporter sidecar (add redis-exporter service to compose if needed)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # PostgreSQL metrics via postgres_exporter sidecar (add pg-exporter service to compose if needed)
  - job_name: 'postgres'
    static_configs:
      - targets: ['pg-exporter:9187']

  # Node exporter (system metrics — install on the host or as a Docker sidecar)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
