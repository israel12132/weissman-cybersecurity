apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    # Stable uid so dashboards (platform-overview.json) and the Tempo tracesToMetrics link
    # can reference it explicitly — a panel that names a missing uid does NOT fall back to
    # default. Keep this in sync with those references.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
