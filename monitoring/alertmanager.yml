# Alertmanager configuration for Weissman Cybersecurity
# https://prometheus.io/docs/alerting/latest/configuration/
#
# Delivery secrets (Slack webhook, PagerDuty routing key, watchdog heartbeat URL) are read
# from files under /etc/alertmanager/secrets/ via Alertmanager's native *_file options — the
# minimal prom/alertmanager image ships no envsubst, so the previous ${SLACK_WEBHOOK_URL}-style
# placeholders were never substituted and crash-looped the container. This config is VALID and
# Alertmanager starts even when those files are empty/absent, so the default stack boots with
# alerting inert; populate the files to turn each channel on. Committed placeholders in
# monitoring/secrets/ let the stack start; operators overwrite them with real values (see
# monitoring/secrets/README.md).
#   slack_api_url            -> #security-alerts / #security-warnings Slack Incoming Webhook
#   pagerduty_routing_key    -> PagerDuty Events API v2 routing key
#   watchdog_url             -> external dead-man's-switch ping URL

global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'category']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Dead-man's switch: forward the always-firing Watchdog to an external heartbeat
    # monitor on a tight cadence. Its absence (not its presence) is the alarm.
    - match:
        alertname: Watchdog
      receiver: 'watchdog-heartbeat'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'default'
    # No-op receiver: alerts are logged by Alertmanager but not forwarded.

  - name: 'critical-alerts'
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_api_url
        channel: '#security-alerts'
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    # PagerDuty paging for critical alerts. The routing key is read from
    # /etc/alertmanager/secrets/pagerduty_routing_key (see monitoring/secrets/README.md);
    # the committed placeholder is inert, so critical alerts go Slack-only until an
    # operator writes a real routing key into that file (leave it empty to stay Slack-only).
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        description: '{{ .GroupLabels.alertname }}: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        severity: 'critical'
        send_resolved: true

  - name: 'watchdog-heartbeat'
    # The heartbeat URL is read from /etc/alertmanager/secrets/watchdog_url
    # (see monitoring/secrets/README.md). Point it at an external dead-man's-switch
    # endpoint (healthchecks.io, Dead Man's Snitch, or a PagerDuty heartbeat
    # integration); the endpoint must alarm when it STOPS receiving this ping.
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/watchdog_url
        send_resolved: false

  - name: 'warning-alerts'
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_api_url
        channel: '#security-warnings'
        title: '[WARNING] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

inhibit_rules:
    # `equal` used to include 'alertname', which made this rule unmatchable: every one of the
    # 31 loaded alert names is defined exactly once with a single fixed severity, so no alertname
    # can ever produce both a critical and a warning instance. The rule looked like configured
    # noise suppression and did nothing.
    #
    # Correlating on `category` alone is what was intended: during a broad availability incident,
    # suppress the warning-level noise while the critical alert for the same category is firing.
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['category']
