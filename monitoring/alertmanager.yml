# Alertmanager configuration for Weissman Cybersecurity
# https://prometheus.io/docs/alerting/latest/configuration/
#
# Delivery secrets are read from files under /etc/alertmanager/secrets (mounted from
# ./monitoring/alertmanager-secrets). This config is VALID and Alertmanager starts even
# when those files are empty/absent, so the default stack boots with alerting inert;
# populate the files to turn each channel on. (The previous ${SLACK_WEBHOOK_URL}-style
# placeholders were never substituted by any step and crash-looped the container.)
#   slack_webhook_url        -> #security-alerts / #security-warnings Slack Incoming Webhook
#   pagerduty_routing_key    -> PagerDuty Events API v2 routing key
#   watchdog_heartbeat_url   -> external dead-man's-switch ping URL

global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'category']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Dead-man's switch: forward the always-firing Watchdog to an external heartbeat
    # monitor on a tight cadence. Its absence (not its presence) is the alarm.
    - match:
        alertname: Watchdog
      receiver: 'watchdog-heartbeat'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'default'
    # No-op receiver: alerts are logged by Alertmanager but not forwarded.

  - name: 'critical-alerts'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        channel: '#security-alerts'
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    # PagerDuty paging for critical alerts. Leave the routing-key file empty to run
    # Slack-only.
    pagerduty_configs:
      - routing_key_file: '/etc/alertmanager/secrets/pagerduty_routing_key'
        description: '{{ .GroupLabels.alertname }}: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        severity: 'critical'
        send_resolved: true

  - name: 'watchdog-heartbeat'
    # Point WATCHDOG_HEARTBEAT_URL at an external dead-man's-switch endpoint
    # (healthchecks.io, Dead Man's Snitch, or a PagerDuty heartbeat integration).
    # The endpoint must alarm when it STOPS receiving this ping.
    webhook_configs:
      - url_file: '/etc/alertmanager/secrets/watchdog_heartbeat_url'
        send_resolved: false

  - name: 'warning-alerts'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_url'
        channel: '#security-warnings'
        title: '[WARNING] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'category']
