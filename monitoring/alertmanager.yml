# Alertmanager configuration for Weissman Cybersecurity
# Set SLACK_WEBHOOK_URL and PAGERDUTY_ROUTING_KEY env vars for live alerting.
# https://prometheus.io/docs/alerting/latest/configuration/

global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'category']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Dead-man's switch: forward the always-firing Watchdog to an external heartbeat
    # monitor on a tight cadence. Its absence (not its presence) is the alarm.
    - match:
        alertname: Watchdog
      receiver: 'watchdog-heartbeat'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'default'
    # No-op receiver: alerts are logged by Alertmanager but not forwarded.

  - name: 'critical-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#security-alerts'
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    # PagerDuty paging for critical alerts. PAGERDUTY_ROUTING_KEY is substituted at
    # deploy time (same envsubst pattern as SLACK_WEBHOOK_URL); leave it unset to run
    # Slack-only.
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        severity: 'critical'
        send_resolved: true

  - name: 'watchdog-heartbeat'
    # Point WATCHDOG_HEARTBEAT_URL at an external dead-man's-switch endpoint
    # (healthchecks.io, Dead Man's Snitch, or a PagerDuty heartbeat integration).
    # The endpoint must alarm when it STOPS receiving this ping.
    webhook_configs:
      - url: '${WATCHDOG_HEARTBEAT_URL}'
        send_resolved: false

  - name: 'warning-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#security-warnings'
        title: '[WARNING] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'category']
