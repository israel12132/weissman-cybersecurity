<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Weissman Cybersecurity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g opacity="0.08" stroke="#22d3ee" stroke-width="1">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>
  <!-- shield -->
  <g transform="translate(120,180)">
    <path d="M100 0 L200 40 V120 C200 200 100 240 100 240 C100 240 0 200 0 120 V40 Z"
          fill="url(#shield)" stroke="#0e7490" stroke-width="3"/>
    <path d="M40 100 L80 170 L120 60 L160 170 L195 80"
          stroke="#020617" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- wordmark -->
  <text x="360" y="305"
        font-family="'Orbitron','Rajdhani',sans-serif"
        font-weight="800" font-size="90" letter-spacing="6"
        fill="url(#text)">WEISSMAN</text>
  <text x="362" y="365"
        font-family="'JetBrains Mono',monospace"
        font-weight="500" font-size="28" letter-spacing="10"
        fill="#22d3ee" opacity="0.9">CYBERSECURITY</text>
  <!-- value prop -->
  <text x="360" y="445"
        font-family="'JetBrains Mono',monospace"
        font-size="34" fill="#cbd5e1">545 production engines · zero simulation.</text>
  <text x="360" y="495"
        font-family="'JetBrains Mono',monospace"
        font-size="24" fill="#94a3b8">Continuous offensive security for SOC teams.</text>
  <!-- bottom band -->
  <rect x="0" y="580" width="1200" height="50" fill="#0b1120"/>
  <text x="60" y="613"
        font-family="'JetBrains Mono',monospace"
        font-size="22" fill="#22d3ee">weissman.io</text>
  <text x="1140" y="613" text-anchor="end"
        font-family="'JetBrains Mono',monospace"
        font-size="16" fill="#64748b" letter-spacing="4">EU-WEST � ISO27001 � GDPR</text>
</svg>
