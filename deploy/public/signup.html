<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create your workspace — Weissman Cybersecurity</title>
  <meta name="description" content="Create a Weissman Cybersecurity workspace. Free 14-day trial. No credit card required." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="canonical" href="/signup.html" />
  <link rel="stylesheet" href="/_shared.css" />
  <meta name="robots" content="index,follow" />
</head>
<body>
  <nav>
    <div class="container nav-inner">
      <a href="/"><strong style="font-family:Orbitron,sans-serif;letter-spacing:2px;color:#22d3ee">WEISSMAN</strong></a>
      <div class="nav-links">
        <a href="/pricing.html">Pricing</a>
        <a href="/command-center/login" class="cta-ghost">Sign in</a>
      </div>
    </div>
  </nav>

  <main style="display:flex;align-items:center;justify-content:center;min-height:calc(100dvh - 4rem);padding:3rem 1rem">
    <div style="width:100%;max-width:480px;background:linear-gradient(180deg,rgba(15,23,42,0.7),rgba(2,6,23,0.4));border:1px solid rgba(34,211,238,0.2);border-radius:1rem;padding:2.5rem">
      <header style="margin-bottom:2rem;text-align:center">
        <h1 style="font-family:Orbitron,sans-serif;font-size:1.5rem;color:#fff;margin:0 0 .5rem">Create your workspace</h1>
        <p style="color:#94a3b8;font-size:.9rem;margin:0">14-day free trial · no credit card</p>
      </header>

      <form id="signup-form" novalidate>
        <label style="display:block;font-size:.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.15em;margin-bottom:.4rem" for="workspace_name">Workspace name</label>
        <input type="text" id="workspace_name" name="workspace_name" required minlength="2" maxlength="80" autocomplete="organization"
               placeholder="Acme Security"
               style="width:100%;padding:.7rem .9rem;background:#020617;border:1px solid rgba(255,255,255,0.12);border-radius:.5rem;color:#e2e8f0;font-family:JetBrains Mono,monospace;font-size:.9rem;margin-bottom:1.25rem" />

        <label style="display:block;font-size:.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.15em;margin-bottom:.4rem" for="email">Work email</label>
        <input type="email" id="email" name="email" required autocomplete="email"
               placeholder="alice@acme.com"
               style="width:100%;padding:.7rem .9rem;background:#020617;border:1px solid rgba(255,255,255,0.12);border-radius:.5rem;color:#e2e8f0;font-family:JetBrains Mono,monospace;font-size:.9rem;margin-bottom:1.25rem" />

        <label style="display:block;font-size:.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.15em;margin-bottom:.4rem" for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="12" autocomplete="new-password"
               placeholder="At least 12 characters"
               style="width:100%;padding:.7rem .9rem;background:#020617;border:1px solid rgba(255,255,255,0.12);border-radius:.5rem;color:#e2e8f0;font-family:JetBrains Mono,monospace;font-size:.9rem;margin-bottom:.5rem" />
        <p style="font-size:.7rem;color:#64748b;margin:0 0 1.25rem">Min 12 characters · mix letters and numbers/symbols</p>

        <label style="display:flex;align-items:flex-start;gap:.6rem;font-size:.8rem;color:#cbd5e1;cursor:pointer;margin-bottom:1.5rem">
          <input type="checkbox" id="accept_terms" required style="margin-top:.2rem" />
          <span>I agree to the <a href="/terms.html" target="_blank" rel="noopener" style="color:#22d3ee">Terms of Service</a> and <a href="/privacy.html" target="_blank" rel="noopener" style="color:#22d3ee">Privacy Policy</a>.</span>
        </label>

        <button type="submit" id="submit-btn"
                style="width:100%;padding:.85rem;border:none;border-radius:.5rem;background:#22d3ee;color:#020617;font-family:JetBrains Mono,monospace;font-weight:700;font-size:.9rem;text-transform:uppercase;letter-spacing:.08em;cursor:pointer">
          Create workspace
        </button>

        <p id="form-status" role="alert" aria-live="polite" style="margin:1.25rem 0 0;font-size:.8rem;text-align:center;min-height:1.2rem"></p>
      </form>

      <p style="text-align:center;color:#64748b;font-size:.75rem;margin-top:2rem">
        Already have an account? <a href="/command-center/login" style="color:#22d3ee">Sign in</a>
      </p>
    </div>
  </main>

  <script>
    const form = document.getElementById('signup-form')
    const status = document.getElementById('form-status')
    const btn = document.getElementById('submit-btn')

    form.addEventListener('submit', async function (e) {
      e.preventDefault()
      status.textContent = ''
      status.style.color = ''
      const payload = {
        workspace_name: form.workspace_name.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        accept_terms: form.accept_terms.checked,
      }
      btn.disabled = true
      btn.textContent = 'Creating…'
      try {
        const r = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
        const d = await r.json().catch(function () { return {} })
        if (r.status === 202 || r.ok) {
          status.style.color = '#22d3ee'
          status.textContent = d.detail || 'Check your inbox to confirm your workspace.'
          if (d.verify_url) {
            // Dev-mode shortcut: render the link
            status.innerHTML +=
              ' <a href="' + d.verify_url + '" style="color:#22d3ee;display:block;margin-top:.5rem;font-size:.7rem">Dev verify link →</a>'
          }
          form.reset()
        } else if (r.status === 503) {
          status.style.color = '#fbbf24'
          status.textContent = d.detail || 'Self-serve signup is not enabled on this deployment. Contact sales@weissman.io.'
        } else {
          status.style.color = '#f87171'
          status.textContent = d.detail || 'Something went wrong. Try again.'
        }
      } catch (err) {
        status.style.color = '#f87171'
        status.textContent = 'Network error — please try again.'
      } finally {
        btn.disabled = false
        btn.textContent = 'Create workspace'
      }
    })
  </script>
</body>
</html>
