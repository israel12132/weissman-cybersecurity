# Weissman production — Nginx reverse proxy → Rust on 127.0.0.1:PORT
# The upstream port MUST match `PORT` in weissman-server's environment (see `.env`; default: 8000).
# After editing PORT in .env, run: sudo bash deploy/fix-weissman-502.sh
#
# Prerequisites: certbot (Let's Encrypt) or another TLS terminator; this example uses certbot paths.
# Install websocket map once (must live in http context):
#   sudo cp deploy/nginx-snippet-websocket-map.conf /etc/nginx/conf.d/00-websocket-map.conf
#
# Install site:
#   sudo cp deploy/nginx-weissman.conf /etc/nginx/sites-available/weissman
#   sudo ln -sf /etc/nginx/sites-available/weissman /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: certbot standalone (stop nginx first, then start after certs exist):
#   sudo systemctl stop nginx
#   sudo certbot certonly --standalone -d weissmancyber.com -d www.weissmancyber.com
#   sudo systemctl start nginx

upstream weissman_backend {
    # Must match `PORT` in weissman-server `.env` (default: 8000).
    # Docker Compose and Rust default both use 8000.
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name weissmancyber.com www.weissmancyber.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name weissmancyber.com www.weissmancyber.com;

    # Certificate must include SAN for both apex and www (e.g. certbot -d weissmancyber.com -d www.weissmancyber.com)
    ssl_certificate /etc/letsencrypt/live/weissmancyber.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weissmancyber.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # Optional; certbot may create this path:
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Hardened TLS (overrides the certbot intermediate include above) ──────────
    # TLS 1.3 preferred; 1.2 kept only with AEAD/PFS ciphers for legacy clients.
    # To go 1.3-only (harvest-now-decrypt-later resistance), drop TLSv1.2 below.
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_ecdh_curve X25519:secp384r1;
    # With OpenSSL 3.5+ (or oqs-provider), enable hybrid post-quantum key exchange:
    #   ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1;
    ssl_session_tickets off;          # forward secrecy over session-ticket resumption
    ssl_session_timeout 1d;
    ssl_session_cache shared:WeissmanTLS:10m;

    # Placeholder for OpenResty ssl_client_hello_by_lua (must not be reset in location).
    set $ssl_client_hello_b64 '';
    set $weissman_proxy_ts '';
    set $weissman_proxy_hmac '';
    # ssl_client_hello_by_lua_file /etc/nginx/lua/weissman_ssl_client_hello.lua;
    # access_by_lua_file /etc/nginx/lua/weissman_proxy_hmac.lua;

    # Large report / export uploads if you increase client limits in the app
    client_max_body_size 64m;

    location / {
        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # TLS fingerprint → Axum JA3/JA4 (stock nginx vars; empty on HTTP).
        # Raw ClientHello: $ssl_client_hello_b64 is initialized in this server and
        # filled by OpenResty lua (see deploy/openresty/). Do not `set` it here.
        proxy_set_header X-SSL-Protocol $ssl_protocol;
        proxy_set_header X-SSL-Cipher $ssl_cipher;
        proxy_set_header X-SSL-Ciphers $ssl_ciphers;
        proxy_set_header X-SSL-Curves $ssl_curves;
        proxy_set_header X-SSL-Server-Name $ssl_server_name;
        proxy_set_header X-SSL-Client-Hello $ssl_client_hello_b64;
        proxy_set_header X-Weissman-Proxy-Ts $weissman_proxy_ts;
        proxy_set_header X-Weissman-Proxy-Hmac $weissman_proxy_hmac;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE / long-lived streams
        proxy_buffering off;
        proxy_cache off;
    }
}
