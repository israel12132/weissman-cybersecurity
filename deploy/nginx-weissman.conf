# Weissman production — Nginx reverse proxy → Rust on 127.0.0.1:PORT
# The upstream port MUST match `PORT` in weissman-server's environment (see `.env`; default: 8000).
# After editing PORT in .env, run: sudo bash deploy/fix-weissman-502.sh
#
# Prerequisites: certbot (Let's Encrypt) or another TLS terminator; this example uses certbot paths.
# Install websocket map once (must live in http context):
#   sudo cp deploy/nginx-snippet-websocket-map.conf /etc/nginx/conf.d/00-websocket-map.conf
#
# Install site:
#   sudo cp deploy/nginx-weissman.conf /etc/nginx/sites-available/weissman
#   sudo ln -sf /etc/nginx/sites-available/weissman /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Continuity ("maintenance") page — automatic, nothing to switch on. Install the generated page
# once (deploy/maintenance/install.sh → /opt/weissman/maintenance, state dir
# /opt/weissman/maintenance/state); from then on every restart, rebuild or crash of
# weissman-server is covered: nginx's own 502/504 become the branded HTTP 503 page below and
# the page reloads the visitor's original URL the moment /api/health answers 200 again.
#   sudo deploy/maintenance/install.sh
# Announcing a window (optional): WEISSMAN_MAINTENANCE_STATE_DIR=/opt/weissman/maintenance/state \
#   deploy/maintenance/maintenance-mode.sh on --reason "…" --until "…"
#
# TLS: certbot standalone (stop nginx first, then start after certs exist):
#   sudo systemctl stop nginx
#   sudo certbot certonly --standalone -d weissmancyber.com -d www.weissmancyber.com
#   sudo systemctl start nginx

upstream weissman_backend {
    # Must match `PORT` in weissman-server `.env` (default: 8000).
    # Docker Compose and Rust default both use 8000.
    server 127.0.0.1:8000;
    keepalive 32;
}

# ─── Continuity page routing (mirrors deploy/nginx-gateway.conf; see there for the long form) ──
# Which file answers a failed request: API / hook / WebSocket / install clients and anything
# that explicitly accepts JSON get api.json (a fetch() or a `curl | bash` must never receive
# 40 KB of HTML), a Hebrew path gets the Hebrew page, everything else the English one. Keyed on
# $request_uri (the URL asked for, untouched by the internal redirect that serves the page),
# anchored and terminated by `/`, `?` or the end, so the query string cannot influence the match.
map $http_accept $maintenance_accepts_json {
    default             0;
    ~*application/json  1;
}

map "$maintenance_accepts_json:$request_uri" $maintenance_page {
    default                                   /index.html;
    "~^[01]:/(api|hooks|ws|install)(/|\?|$)"  /api.json;
    "~^1:"                                    /api.json;
    "~^0:/he(/|\?|$)"                        /he/index.html;
}

# Optional, opt-in flag for ANNOUNCED windows (maintenance-mode.sh on|off): while the file
# exists every request gets the page even though the backend may still be up. OFF by default and
# never required — the automatic 502/504 path does not read it. Tested per request with `-f`, so
# on/off need no reload. The page's own assets under /maintenance/ must keep serving while the
# flag is up (a script that arrives with a 5xx status is refused by the browser), so for those
# URIs the map yields an empty path that `-f` can never find. The page's internal URI
# (/maintenance/_503) sits under the same prefix on purpose: the `if` runs again on the internal
# redirect, and if it re-fired there the second 503 would fall through to nginx's unbranded page.
map $uri $maintenance_flag_file {
    # nginx caches a map result for the whole request, including across the internal redirect
    # to the page: without `volatile` the second pass of the `if` would still see the flag path
    # for "/" and re-fire (measured: an unbranded default 503 with no headers).
    volatile;
    default          /opt/weissman/maintenance/state/maintenance.on;
    ~^/maintenance/  "";
}

server {
    listen 80;
    listen [::]:80;
    server_name weissmancyber.com www.weissmancyber.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name weissmancyber.com www.weissmancyber.com;

    # Certificate must include SAN for both apex and www (e.g. certbot -d weissmancyber.com -d www.weissmancyber.com)
    ssl_certificate /etc/letsencrypt/live/weissmancyber.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weissmancyber.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # Optional; certbot may create this path:
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Hardened TLS (overrides the certbot intermediate include above) ──────────
    # TLS 1.3 preferred; 1.2 kept only with AEAD/PFS ciphers for legacy clients.
    # To go 1.3-only (harvest-now-decrypt-later resistance), drop TLSv1.2 below.
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_ecdh_curve X25519:secp384r1;
    # With OpenSSL 3.5+ (or oqs-provider), enable hybrid post-quantum key exchange:
    #   ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1;
    ssl_session_tickets off;          # forward secrecy over session-ticket resumption
    ssl_session_timeout 1d;
    ssl_session_cache shared:WeissmanTLS:10m;

    # Large report / export uploads if you increase client limits in the app
    client_max_body_size 64m;

    # Announced-window flag (see $maintenance_flag_file). The only `if` in this file, in the one
    # shape nginx's "if is evil" page calls safe: server level, a bare `return`.
    if (-f $maintenance_flag_file) {
        return 503;
    }
    # The flag's `return 503` and the `error_page 502 504 =503 /maintenance/_503` below both land
    # in the internal location. No `=` on this one: the 503 is kept as-is.
    error_page 503 /maintenance/_503;

    # ─── Continuity page assets (installed by deploy/maintenance/install.sh) ───────
    # Plain 200 even while the flag is up — the 503 page loads /maintenance/maintenance.js and
    # browsers refuse to run a script that itself arrives with a 5xx. `root`, not `alias`: the
    # URI prefix equals the directory name, and a root cannot become a traversal the way an
    # alias without a trailing slash can. no-store: tiny file, and a cached copy of stale
    # recheck logic is worse than the round-trip. /maintenance/index.html is a handy preview.
    location ^~ /maintenance/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        root /opt/weissman;
        try_files $uri =404;
    }

    # The state dir sits under the page root so install.sh can create both with one owner. Only
    # status.json is meant to be public, at the URL the page polls; keep the rest of the
    # directory (the flag file) off the wire.
    location ^~ /maintenance/state/ {
        return 404;
    }

    # status.json is runtime state written by maintenance-mode.sh, not a build artefact. 404 is
    # the normal answer when no window is announced — the page treats it as "nothing to show".
    # `rewrite … break` + `root` rather than `alias`, for the traversal reason above.
    location = /maintenance/status.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        root /opt/weissman/maintenance/state;
        rewrite ^ /status.json break;
    }

    # The page itself. `internal`: reachable only through the error_page redirects (flag 503,
    # proxied 502/504); asked for directly it is a 404. A URI target rather than a named
    # `@location` because of the request METHOD: nginx rewrites the method to GET when it
    # redirects to a URI but not for a named location, and the static handler then answers a
    # POST /api/login or a DELETE with 405 instead of the page (measured). The status is already
    # 503 on arrival, so `try_files` merely picks the file the map chose; Content-Type follows
    # the extension. Retry-After tells crawlers and the Command Center when to look
    # again; no-store so no cache holds the page past the outage; X-Weissman-Maintenance lets
    # the SPA and the Cloudflare Worker tell "branded page from our own gateway" apart from an
    # anonymous 5xx. The backend normally sets the security headers; while nginx answers in its
    # place they are set here, with a CSP cut down to exactly what the page uses (its own
    # script, inline <style>, data: fonts/favicon, same-origin fetch of /api/health).
    location = /maintenance/_503 {
        internal;
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        add_header X-Weissman-Maintenance "1" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; font-src data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        charset utf-8;
        root /opt/weissman/maintenance;
        try_files $maintenance_page =503;
    }

    location / {
        # Only nginx's OWN failures become the continuity page. `proxy_intercept_errors` hands
        # every upstream 3xx/4xx/5xx to error_page too, but a location-level error_page list
        # REPLACES the inherited server-level one, so here only 502 and 504 are rewritten: the
        # backend's 404s, 429s and legitimate 503s (POST /api/public/demo-request answers 503
        # while SMTP is unconfigured, and the website relies on that) pass through untouched.
        # weissman-server can take ~90 s to come back after a restart with migrations; during
        # that window the connect is refused instantly and the page is up in one round-trip. A
        # black-holed backend (firewall) would otherwise hold the visitor for the 60 s default.
        proxy_intercept_errors on;
        error_page 502 504 =503 /maintenance/_503;
        proxy_connect_timeout 5s;

        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE / long-lived streams
        proxy_buffering off;
        proxy_cache off;
    }
}
