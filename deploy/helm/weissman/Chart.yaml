apiVersion: v2
name: weissman
description: >-
  Dedicated (single-tenant) deployment of the Weissman Cybersecurity platform.
  One isolated namespace, Postgres, Redis, JWT-signing key and secrets-at-rest
  vault key per customer. Templates the proven deploy/k8s manifests; the shared
  (logical, RLS) tier remains deploy/k8s. See docs/adr/0003-dedicated-single-tenant-tier.md.
type: application
# Chart version — bump on chart changes.
version: 0.1.0
# Default application image tag when image.digest / image.tag are unset. Prefer a
# cosign-verified digest (image.digest) in production; see deploy/k8s/backend-deployment.yaml.
appVersion: "latest"
# autoscaling/v2 (HPA) is stable from 1.23; policy/v1 (PDB) from 1.21; networking.k8s.io/v1 Ingress from 1.19.
kubeVersion: ">=1.23.0-0"
keywords:
  - weissman
  - cybersecurity
  - single-tenant
  - dedicated
  - mssp
home: https://weissmancyber.com
maintainers:
  - name: Weissman Cybersecurity
    url: https://weissmancyber.com
