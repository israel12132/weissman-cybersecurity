{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "weissman.secretName" . }}
  namespace: {{ include "weissman.namespace" . }}
  labels:
    {{- include "weissman.labels" . | nindent 4 }}
type: Opaque
stringData:
  database_url: {{ required "secrets.databaseUrl is required (weissman_app DSN — NOBYPASSRLS)" .Values.secrets.databaseUrl | quote }}
  auth_database_url: {{ required "secrets.authDatabaseUrl is required (weissman_auth DSN)" .Values.secrets.authDatabaseUrl | quote }}
  worker_database_url: {{ required "secrets.workerDatabaseUrl is required (weissman_worker DSN)" .Values.secrets.workerDatabaseUrl | quote }}
  analytics_database_url: {{ required "secrets.analyticsDatabaseUrl is required (weissman_analytics DSN)" .Values.secrets.analyticsDatabaseUrl | quote }}
  migrate_url: {{ required "secrets.migrateUrl is required (superuser/owner DSN — migrations only)" .Values.secrets.migrateUrl | quote }}
  jwt_secret: {{ required "secrets.jwtSecret is required (>=48 chars in production)" .Values.secrets.jwtSecret | quote }}
  {{- with .Values.secrets.jwtSecretPrevious }}
  jwt_secret_previous: {{ . | quote }}
  {{- end }}
  redis_url: {{ required "secrets.redisUrl is required" .Values.secrets.redisUrl | quote }}
  destructive_confirm_secret: {{ required "secrets.destructiveConfirmSecret is required (>=32 chars)" .Values.secrets.destructiveConfirmSecret | quote }}
  job_orchestrator_secret: {{ required "secrets.jobOrchestratorSecret is required (>=32 chars)" .Values.secrets.jobOrchestratorSecret | quote }}
  metrics_token: {{ required "secrets.metricsToken is required (>=32 chars)" .Values.secrets.metricsToken | quote }}
  rag_provenance_secret: {{ required "secrets.ragProvenanceSecret is required (64 hex)" .Values.secrets.ragProvenanceSecret | quote }}
  integrations_vault_key: {{ required "secrets.integrationsVaultKey is required (dedicated secrets-at-rest key, >=32 chars)" .Values.secrets.integrationsVaultKey | quote }}
  vault_key: {{ required "secrets.vaultKey is required (CEO genesis vault, 64 hex — production boot fails closed without it)" .Values.secrets.vaultKey | quote }}
  {{- with .Values.secrets.dualApprovalSecret }}
  dual_approval_secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminEmail }}
  admin_email: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  admin_password: {{ . | quote }}
  {{- end }}
{{- end }}
