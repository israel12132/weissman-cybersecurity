server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location /command-center/ {
        alias /usr/share/nginx/html/command-center/;
        try_files $uri $uri/ /command-center/index.html;
    }
    location = / {
        return 302 /command-center/;
    }
    location ~ ^/(login|signup|platform|engines|pricing|how-it-works|security|contact|company|he)(/.*)?$ {
        root /usr/share/nginx/html/www;
        try_files $uri @flagship_spa;
    }
    location @flagship_spa {
        root /usr/share/nginx/html/www;
        try_files /index.html =404;
    }
}
