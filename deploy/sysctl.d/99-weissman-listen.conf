# Weissman listen-queue sysctls — copy to /etc/sysctl.d/ and run `sysctl --system`.
# Without these, Linux silently truncates Axum's listen(4096) to somaxconn
# (often 128 or 4096 depending on distro). Agent reconnect bursts then drop
# SYNs/WSS with no error in weissman-server logs.
#
# Apply now (root):
#   sysctl -w net.core.somaxconn=4096
#   sysctl -w net.ipv4.tcp_max_syn_backlog=4096
#   install -m 0644 deploy/sysctl.d/99-weissman-listen.conf /etc/sysctl.d/99-weissman-listen.conf

net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
