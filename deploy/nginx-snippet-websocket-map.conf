# Place in /etc/nginx/conf.d/ (e.g. 00-websocket-map.conf) so it is loaded inside http { }.
# Required by deploy/nginx-weissman.conf for $connection_upgrade.

# Only forward a genuine WebSocket upgrade. Any other Upgrade value (e.g. an
# attacker's `Upgrade: h2c`) maps to "" so nginx does NOT forward a connection
# upgrade — closing the H2C-smuggling path to the backend. Empty Upgrade → close.
map $http_upgrade $connection_upgrade {
    default        "";
    ~*^websocket$  upgrade;
    ''             close;
}
