# Optional stream terminator: PROXY protocol v2 → Axum (:8000).
#
# Stock `http { proxy_pass }` cannot emit PROXY v2. Enable this alongside
# WEISSMAN_PROXY_PROTOCOL=1 on weissman-server. Optional TLV 0xE0 (raw TLS
# ClientHello) requires a terminator that can attach it; stock nginx stream
# forwards the PROXY address only. Pair with OpenResty lua
# (deploy/openresty/weissman_ssl_client_hello.lua) for X-SSL-Client-Hello.
#
# Install (http TLS site should be disabled on 443 when this stream server owns it):
#   sudo cp deploy/nginx-stream-proxy-protocol.conf /etc/nginx/modules-enabled/weissman-stream.conf
#   sudo nginx -t && sudo systemctl reload nginx

stream {
    upstream weissman_axum {
        server 127.0.0.1:8000;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        ssl_certificate     /etc/letsencrypt/live/weissmancyber.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/weissmancyber.com/privkey.pem;
        ssl_protocols TLSv1.3 TLSv1.2;
        proxy_pass weissman_axum;
        proxy_protocol on;
        proxy_timeout 3600s;
    }
}
