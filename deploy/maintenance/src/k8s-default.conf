# Weissman maintenance page — nginx server for the Kubernetes default backend.
# Image: nginxinc/nginx-unprivileged (UID 101, listens on 8080). The files next to this
# one in ConfigMap weissman-maintenance-page are mounted at /usr/share/nginx/html.
#
# ingress-nginx (custom-http-errors: 502,503,504 + default-backend) forwards an
# intercepted error to this server with the request rewritten to "/" and describes
# the visitor's original request in headers:
#   X-Original-URI  the path asked for   -> /he/...  serves the Hebrew page
#   X-Format        the Accept header    -> application/json serves api.json
# A request that reaches this server directly (no headers) is routed on its own URI.

map $http_x_original_uri $maint_uri {
    default  $http_x_original_uri;
    ""       $request_uri;
}

map $http_x_format $maint_json {
    default               0;
    "~*application/json"  1;
}

# page | he | api | script | status — the same prefixes deploy/nginx-gateway.conf treats as
# machine clients: a fetch() in the Command Center, a webhook, a WebSocket upgrade or a
# `curl … /install/agent.sh | sh` must never receive 40 KB of HTML with a 503.
map "$maint_json:$maint_uri" $maint_route {
    default                                          page;
    "~^[01]:/maintenance/maintenance\.js(?:\?|$)"    script;
    "~^[01]:/maintenance/status\.json(?:\?|$)"       status;
    "~^[01]:/(api|hooks|ws|install)(?:/|\?|$)"       api;
    "~^1:"                                           api;
    "~^0:/he(?:/|\?|$)"                              he;
}

map $maint_route $maint_page {
    default  /index.html;
    he       /he.html;
    api      /api.json;
}

# Where `location /` sends each route (one `rewrite … last`, no `if`): the page's own script
# goes to its exact location so it arrives as a genuine 200 — browsers refuse to run a
# script delivered with a 5xx; status.json is a plain 404 (no planned window is declared on
# this layer, and the page treats 404 as "nothing announced"); everything else raises the
# 503 that becomes the page.
map $maint_route $maint_entry {
    default  /_unavailable;
    script   /maintenance.js;
    status   /_404;
}

server {
    # IPv4 only, like the gateway pod's own nginx: the stock image also binds [::]:8080, and
    # nginx probes that socket at config-test time, so on a node with ipv6.disable=1 the pod
    # crash-loops before serving a single page. Service traffic reaches the pod over its
    # IPv4 address; an IPv6-only cluster would have to add `listen [::]:8080;` back.
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # Readiness / liveness probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /maintenance.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        rewrite ^ $maint_entry last;
    }

    # A plain 404 with none of the page's headers: the absent status.json, and the helper
    # URIs below when asked for directly.
    location = /_404 {
        internal;
        return 404;
    }

    location = /_unavailable {
        internal;
        return 503;
    }

    # The page itself. A URI target rather than a named `@location` because of the request
    # METHOD: nginx rewrites the method to GET when it redirects to a URI, but leaves it
    # alone for a named location, and the static handler then answers a POST /api/login or a
    # DELETE — which ingress-nginx re-issues to this backend with the original method — with
    # its own unbranded "405 Not Allowed" instead of the page (measured). `internal`: asked
    # for directly it is a 404 — sent through /_404 so the `always` headers of this location
    # (Retry-After, X-Weissman-Maintenance) do not dress a 404 up as an outage for a monitor
    # keyed on them. The status is already 503 on arrival, so `try_files` merely picks the
    # file the map chose; Content-Type follows the extension.
    error_page 503 /_503;
    location = /_503 {
        internal;
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        add_header X-Weissman-Maintenance "1" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        try_files $maint_page =503;
        error_page 404 =404 /_404;
    }
}
