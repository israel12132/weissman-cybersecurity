# Weissman maintenance page — nginx server for the Kubernetes default backend.
# Image: nginxinc/nginx-unprivileged (UID 101, listens on 8080). The files next to this
# one in ConfigMap weissman-maintenance-page are mounted at /usr/share/nginx/html.
#
# ingress-nginx (custom-http-errors: 502,503,504 + default-backend) forwards an
# intercepted error to this server with the request rewritten to "/" and describes
# the visitor's original request in headers:
#   X-Original-URI  the path asked for   -> /he/...  serves the Hebrew page
#   X-Format        the Accept header    -> application/json serves api.json
# A request that reaches this server directly (no headers) is routed on its own URI.

map $http_x_original_uri $maint_uri {
    default  $http_x_original_uri;
    ""       $request_uri;
}

map $http_x_format $maint_json {
    default               0;
    "~*application/json"  1;
}

# page | he | api | script | status
map "$maint_json:$maint_uri" $maint_route {
    default                                          page;
    "~^[01]:/maintenance/maintenance\.js(?:\?|$)"    script;
    "~^[01]:/maintenance/status\.json(?:\?|$)"       status;
    "~^[01]:/api(?:/|\?|$)"                          api;
    "~^1:"                                           api;
    "~^0:/he(?:/|\?|$)"                              he;
}

map $maint_route $maint_page {
    default  /index.html;
    he       /he.html;
    api      /api.json;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # Readiness / liveness probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The page's own script must be a genuine 200: browsers refuse to run a script
    # that arrives with a 5xx status.
    location = /maintenance.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        if ($maint_route = script) { rewrite ^ /maintenance.js last; }
        # No planned window is declared on this layer; the page treats 404 as "nothing announced".
        if ($maint_route = status) { return 404; }
        return 503;
    }

    error_page 503 @maintenance;
    location @maintenance {
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        add_header X-Weissman-Maintenance "1" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        try_files $maint_page =503;
    }
}
