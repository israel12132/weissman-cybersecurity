apiVersion: apps/v1
kind: Deployment
metadata:
  name: weissman-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weissman-gateway
  template:
    metadata:
      labels:
        app: weissman-gateway
    spec:
      containers:
        - name: nginx
          image: your-registry/weissman-gateway:latest
          imagePullPolicy: IfNotPresent
          # Least-privilege: no setuid/setgid escalation; drop every Linux
          # capability and re-add only NET_BIND_SERVICE so nginx can still bind
          # port 80. seccomp RuntimeDefault filters the syscall surface.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 80
