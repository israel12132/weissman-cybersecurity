# Weissman maintenance page — the ingress-nginx default backend for the weissman namespace.
#
# Automatic by design: nothing here is switched on by hand. deploy/k8s/ingress.yaml points
# `custom-http-errors: 502,503,504` + `default-backend` at the Service below, so whenever the
# gateway cannot answer (no ready pods, connection refused, upstream timeout) ingress-nginx
# serves the branded page from these pods instead of its own bare "502 Bad Gateway". The page
# polls /api/health and reloads the visitor's original URL on the first genuine 200, so the
# hand-off back to the gateway is automatic as well.
#
# Content comes entirely from ConfigMap weissman-maintenance-page
# (deploy/k8s/maintenance-page-configmap.yaml, generated by deploy/maintenance/build.mjs — never
# hand-edit; `node deploy/maintenance/build.mjs --check` is the CI drift gate). Its default.conf
# declares `root /usr/share/nginx/html` and reads /index.html, /he.html, /api.json and
# /maintenance.js directly under that root (the public /maintenance/maintenance.js URL is
# rewritten to /maintenance.js inside the conf), so the page keys are mounted FLAT at the html
# root — not under a maintenance/ subdirectory — and default.conf replaces the image's conf.d.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weissman-maintenance
  namespace: weissman
  labels:
    app: weissman-maintenance
spec:
  # Two replicas + the PodDisruptionBudget below: the fallback must already be Ready when the
  # gateway goes away (a rollout, a node drain, `kubectl scale --replicas=0`), otherwise
  # ingress-nginx has nothing to fall back to and shows its own error page.
  replicas: 2
  selector:
    matchLabels:
      app: weissman-maintenance
  template:
    metadata:
      labels:
        app: weissman-maintenance
    spec:
      # Static files only — this pod never talks to the API server.
      automountServiceAccountToken: false
      securityContext:
        # nginxinc/nginx-unprivileged runs as UID/GID 101 and listens on 8080; stating it here
        # keeps the pod admissible under the `restricted` Pod Security Standard.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Spread the two replicas across nodes (and zones when available): a fallback that lives
      # on the same node as the gateway would disappear with it.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: weissman-maintenance
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: weissman-maintenance
      volumes:
        # Page assets: exactly the four files default.conf serves, at the paths it expects.
        # A directory mount (no subPath) also means a regenerated ConfigMap reaches running
        # pods — nginx reads these files per request.
        - name: page
          configMap:
            name: weissman-maintenance-page
            items:
              - key: index.html
                path: index.html
              - key: he.html
                path: he.html
              - key: maintenance.js
                path: maintenance.js
              - key: api.json
                path: api.json
        # Mounted over the whole conf.d directory rather than as a subPath so the image's own
        # default.conf disappears: two `listen 8080 default_server` servers in the same
        # directory would collide. The image's entrypoint notices the directory is read-only
        # and skips its IPv6 rewrite of default.conf (the conf already listens on [::]:8080).
        - name: nginx-conf
          configMap:
            name: weissman-maintenance-page
            items:
              - key: default.conf
                path: default.conf
        # The only directory the unprivileged image writes: its nginx.conf moves the pid file
        # and every *_temp_path under /tmp (that is what lets it run as UID 101). Required
        # with readOnlyRootFilesystem, or nginx exits at start-up.
        - name: tmp
          emptyDir: {}
        # Not written by the stock config (see above) — kept writable only so a custom
        # nginx.conf that restores the packaged temp paths does not crash-loop on the
        # read-only root.
        - name: cache
          emptyDir: {}
      containers:
        - name: nginx
          # Same base image as the gateway build (deploy/frontend.Dockerfile) so both nginx
          # servers move together. For production, pin `…@sha256:<DIGEST>` as the other
          # manifests recommend.
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          # Least-privilege, as deploy/k8s/gateway-deployment.yaml: no setuid/setgid escalation,
          # every capability dropped. Nothing binds a privileged port (8080 as UID 101), and the
          # root filesystem is read-only because the content is a ConfigMap, not the image.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          # A static server sized like one — except for the memory ceiling: the image's
          # `worker_processes auto` follows the node's CPU count, not this pod's CPU limit,
          # so a 64-core node forks 64 workers, each with its own private heap and
          # connection table. The image's NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE knob
          # cannot help: it rewrites /etc/nginx/nginx.conf in place, which the read-only
          # root forbids.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # /healthz is the one location in default.conf that answers 200 (everything else is
          # a deliberate 503), so a probe on / would mark a perfectly healthy fallback unready.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
---
apiVersion: v1
kind: Service
metadata:
  name: weissman-maintenance
  namespace: weissman
  labels:
    app: weissman-maintenance
spec:
  # ClusterIP only: ingress-nginx reaches the pods through this Service's endpoints; nothing
  # outside the cluster needs the page directly. The name is what
  # `nginx.ingress.kubernetes.io/default-backend` in ingress.yaml refers to.
  type: ClusterIP
  selector:
    app: weissman-maintenance
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: weissman-maintenance
  namespace: weissman
spec:
  # Keep one replica through node drains and cluster upgrades — exactly the moments the
  # gateway is also being moved and the fallback is needed most.
  minAvailable: 1
  selector:
    matchLabels:
      app: weissman-maintenance
