# Optional: raise listen-queue sysctls in the *pod* network namespace.
# A node-level `sysctl -w` (host netns) does NOT change default CNI pods.
# Prefer Helm `deploy/helm/weissman-listen` (privilegedInit or podSysctl).
#
# This DaemonSet is for hostNetwork listeners / operators who accept a
# privileged node agent. PSS Restricted clusters: use podSysctl + kubelet
# allowedUnsafeSysctls instead.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: weissman-listen-sysctl
  namespace: weissman
  labels:
    app: weissman-listen-sysctl
spec:
  selector:
    matchLabels:
      app: weissman-listen-sysctl
  template:
    metadata:
      labels:
        app: weissman-listen-sysctl
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: sysctl
          image: busybox:1.36
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              sysctl -w net.core.somaxconn=4096
              sysctl -w net.ipv4.tcp_max_syn_backlog=4096 || true
              echo "applied listen sysctls; sleeping"
              sleep inf
