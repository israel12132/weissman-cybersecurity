# Postgres HA via CloudNativePG (https://cloudnative-pg.io) — primary + 2 hot standbys with
# automated failover, synchronous replication, and continuous WAL archiving (PITR) to object
# storage. Removes the single-Postgres SPOF.
#
# Prerequisites:
#   1. Install the CNPG operator (server-side apply the release manifest).
#   2. imageName MUST include the pgvector extension (supreme_council_memory /
#      pentest_winning_paths). Build a CNPG-compatible image FROM the operator's postgres:16
#      base + `CREATE EXTENSION vector`, or use a community pgvector CNPG image, and set it
#      below. The stock CNPG image does NOT ship pgvector.
#   3. Create the `weissman-pg-backup` secret with S3 credentials for WAL/base archiving.
#
# CNPG publishes services: weissman-pg-rw (primary), weissman-pg-ro (replicas). Point the app
# (via PgBouncer) at weissman-pg-rw; route read-only analytics at weissman-pg-ro.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: weissman-pg
  namespace: weissman
spec:
  instances: 3
  imageName: ghcr.io/your-org/cnpg-postgres16-pgvector:latest # MUST include pgvector — see header
  primaryUpdateStrategy: unsupervised
  postgresql:
    parameters:
      max_connections: "200"
      wal_level: replica
      # Synchronous commit to at least one standby (durability over a single-node loss).
      synchronous_commit: "on"
  bootstrap:
    initdb:
      database: weissman
      owner: weissman
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  storage:
    size: 50Gi
  backup:
    barmanObjectStore:
      destinationPath: s3://weissman-pg-backups/
      s3Credentials:
        accessKeyId:
          name: weissman-pg-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: weissman-pg-backup
          key: SECRET_ACCESS_KEY
      # Server-side encryption at the object store. AES256 = SSE-S3 (bucket-managed keys). For a
      # customer-managed key set encryption: "aws:kms" and add `kmsKeyId` via the bucket policy —
      # the key then lives in KMS, not the cluster. This protects the barman WAL/base objects at
      # rest independently of bucket ACLs.
      #
      # NOTE: this is the CNPG/barman path. Self-managed hosts get a STRONGER guarantee from the
      # client-side age envelope in scripts/backup_pitr_setup.sh — there the DB host never holds a
      # decryption key at all. See docs/operations/ENCRYPTED-DR-PITR.md for how the two relate and
      # when to run which. Do not disable one assuming the other; they cover different threats.
      encryption: AES256
      wal:
        compression: gzip
        encryption: AES256
      data:
        compression: gzip
        encryption: AES256
    retentionPolicy: "30d"
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
