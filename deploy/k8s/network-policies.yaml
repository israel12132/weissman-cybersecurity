# Default-deny ingress for the weissman namespace; explicit allow rules below.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: weissman
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Ingress controller / external LB → nginx gateway only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: weissman
spec:
  podSelector:
    matchLabels:
      app: weissman-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
---
# Gateway → backend API (internal ClusterIP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backend
  namespace: weissman
spec:
  podSelector:
    matchLabels:
      app: weissman-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: weissman-gateway
      ports:
        - protocol: TCP
          port: 8000
---
# Backend + worker → Redis (job bus, SOAR idempotency, rate limits).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-redis
  namespace: weissman
spec:
  podSelector:
    matchLabels:
      app: weissman-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: weissman-backend
        - podSelector:
            matchLabels:
              app: weissman-worker
      ports:
        - protocol: TCP
          port: 6379
---
# Worker liveness / internal health — no inbound except from kubelet (implicit).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-egress-dns
  namespace: weissman
spec:
  podSelector:
    matchLabels:
      app: weissman-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: weissman-redis
      ports:
        - protocol: TCP
          port: 6379
