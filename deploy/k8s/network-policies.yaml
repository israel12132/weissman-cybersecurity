# Default-deny ingress for the weissman namespace; explicit allow rules below.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: weissman
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Ingress controller / external LB → nginx gateway only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: weissman
spec:
  podSelector:
    matchLabels:
      app: weissman-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
---
# Gateway → backend API (internal ClusterIP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backend
  namespace: weissman
spec:
  podSelector:
    matchLabels:
      app: weissman-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: weissman-gateway
      ports:
        - protocol: TCP
          port: 8000
---
# Backend + worker → Redis (job bus, SOAR idempotency, rate limits).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-redis
  namespace: weissman
spec:
  podSelector:
    matchLabels:
      app: weissman-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: weissman-backend
        - podSelector:
            matchLabels:
              app: weissman-worker
      ports:
        - protocol: TCP
          port: 6379
---
# Worker liveness / internal health — no inbound except from kubelet (implicit).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker-egress-dns
  namespace: weissman
spec:
  podSelector:
    matchLabels:
      app: weissman-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: weissman-redis
      ports:
        - protocol: TCP
          port: 6379
    # Managed Postgres — set to your database's CIDR (was 0.0.0.0/0, over-broad).
    # The cloud metadata IP is excluded so a compromised pod can't pivot to
    # instance credentials over this rule (managed Postgres is never at 169.254.169.254).
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 5432
    # Engine probes reach arbitrary internet scan targets (this is a scanning product), so
    # egress here is intentionally broad on all ports — but block the cloud metadata endpoint
    # to harden against SSRF pivoting. In production, narrow the CIDR to your authorised scope
    # and add internal RFC1918 ranges to `except` unless internal scanning is in scope.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
---
# Backend egress: DNS, Redis, Postgres, and outbound HTTP(S). The backend drives
# tenant-configured SOAR/webhook/Slack/PagerDuty delivery and pulls threat-intel
# feeds (CISA KEV, FIRST EPSS), so it needs outbound internet — but the cloud
# metadata endpoint is blocked so a compromised backend or an unvalidated webhook
# URL cannot pivot to instance credentials (defence-in-depth behind the in-app
# SSRF guard on outbound webhook URLs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress
  namespace: weissman
spec:
  podSelector:
    matchLabels:
      app: weissman-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: weissman-redis
      ports:
        - protocol: TCP
          port: 6379
    # Managed Postgres — set to your database's CIDR (metadata IP excluded).
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 5432
    # Outbound HTTP(S) for threat-intel feeds and tenant SOAR/webhook delivery,
    # with the cloud metadata range blocked (SSRF hardening).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
