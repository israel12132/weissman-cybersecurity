apiVersion: apps/v1
kind: Deployment
metadata:
  name: weissman-backend
  namespace: weissman
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weissman-backend
  template:
    metadata:
      labels:
        app: weissman-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes (and zones when available) so a single node/AZ loss
      # never takes the whole backend down.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: weissman-backend
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: weissman-backend
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: backend
          # Published, cosign-signed and SLSA-provenance-attested by the CI `publish` job
          # (.github/workflows/ci.yml). PRODUCTION: do NOT deploy this mutable :latest tag —
          # roll out via `.github/workflows/deploy.yml`, which cosign-VERIFIES a given digest
          # (fail-closed) and pins `…@sha256:…` into this manifest before apply. For defence in
          # depth also enforce signature + provenance at admission (cosign policy-controller /
          # Kyverno):
          #   image: ghcr.io/israel12132/weissman-cybersecurity/weissman-backend@sha256:<DIGEST>
          image: ghcr.io/israel12132/weissman-cybersecurity/weissman-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          envFrom:
            - configMapRef:
                name: weissman-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: database_url
            - name: WEISSMAN_AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: auth_database_url
            - name: WEISSMAN_WORKER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: worker_database_url
            - name: WEISSMAN_ANALYTICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: analytics_database_url
            - name: WEISSMAN_MIGRATE_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: migrate_url
            - name: WEISSMAN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: jwt_secret
            - name: WEISSMAN_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: admin_email
                  optional: true
            - name: WEISSMAN_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: admin_password
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: redis_url
            - name: WEISSMAN_DESTRUCTIVE_CONFIRM_SECRET
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: destructive_confirm_secret
            - name: WEISSMAN_JOB_ORCHESTRATOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: job_orchestrator_secret
            - name: WEISSMAN_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: metrics_token
            - name: WEISSMAN_RAG_PROVENANCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: rag_provenance_secret
            - name: WEISSMAN_MIGRATIONS_DIR
              value: "/srv/migrations"
          readinessProbe:
            # Dependency-aware: 503 when Postgres/Redis are unreachable so traffic is
            # withheld from a replica that can't serve. Liveness stays on /api/health.
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
