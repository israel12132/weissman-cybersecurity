apiVersion: apps/v1
kind: Deployment
metadata:
  name: weissman-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weissman-redis
  template:
    metadata:
      labels:
        app: weissman-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          # Bound memory so a runaway producer can't OOM the node; LRU eviction is safe
          # because Postgres is the durable source of truth for the job bus (Redis is
          # best-effort fan-out / leases / rate-limit counters).
          args:
            - "--maxmemory"
            - "384mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: weissman-redis
spec:
  selector:
    app: weissman-redis
  ports:
    - port: 6379
      targetPort: 6379
