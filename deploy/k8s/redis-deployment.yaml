apiVersion: apps/v1
kind: Deployment
metadata:
  name: weissman-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weissman-redis
  template:
    metadata:
      labels:
        app: weissman-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: weissman-redis
spec:
  selector:
    app: weissman-redis
  ports:
    - port: 6379
      targetPort: 6379
