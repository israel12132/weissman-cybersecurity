# PgBouncer transaction pooler in front of Postgres. The app/auth/worker/intel DSNs point here
# (weissman-pgbouncer:6432); it multiplexes the fleet's short-lived connections onto a small
# DEFAULT_POOL_SIZE of real backends on the CNPG primary (weissman-pg-rw), so the HPA scaling to
# ~20 pods no longer exhausts Postgres max_connections=200.
#
# Multi-role auth: the runtime pools log in as five roles, so PgBouncer uses auth_query
# (public.pgbouncer_get_auth, migration 20260922151000). The pooler logs in as weissman_pgbouncer;
# provide its credentials in the weissman-secrets keys pgbouncer_auth_user / pgbouncer_auth_password.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weissman-pgbouncer
  namespace: weissman
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weissman-pgbouncer
  template:
    metadata:
      labels:
        app: weissman-pgbouncer
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: weissman-pgbouncer
                topologyKey: kubernetes.io/hostname
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.23.1-p2
          ports:
            - containerPort: 6432
          env:
            # Upstream = CNPG primary service (deploy/k8s/postgres-ha.yaml).
            - name: DB_HOST
              value: weissman-pg-rw
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: weissman
            - name: LISTEN_PORT
              value: "6432"
            - name: POOL_MODE
              value: transaction
            - name: MAX_CLIENT_CONN
              value: "2000"
            - name: DEFAULT_POOL_SIZE
              value: "25"
            - name: AUTH_TYPE
              value: scram-sha-256
            # The pooler's own login (weissman_pgbouncer) + auth_query for every other role.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: pgbouncer_auth_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: pgbouncer_auth_password
            - name: AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: pgbouncer_auth_user
            - name: AUTH_QUERY
              value: "SELECT rolname, rolpassword FROM public.pgbouncer_get_auth($1)"
            - name: IGNORE_STARTUP_PARAMETERS
              value: extra_float_digits
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: weissman-pgbouncer
  namespace: weissman
spec:
  selector:
    app: weissman-pgbouncer
  ports:
    - protocol: TCP
      port: 6432
      targetPort: 6432
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: weissman-pgbouncer
  namespace: weissman
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: weissman-pgbouncer

