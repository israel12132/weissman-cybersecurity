apiVersion: apps/v1
kind: Deployment
metadata:
  name: weissman-worker
  namespace: weissman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weissman-worker
  template:
    metadata:
      labels:
        app: weissman-worker
    spec:
      containers:
        - name: worker
          image: your-registry/weissman-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/weissman-worker"]
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 2Gi
          envFrom:
            - configMapRef:
                name: weissman-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: database_url
            - name: WEISSMAN_AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: auth_database_url
            - name: WEISSMAN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: jwt_secret
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: redis_url
            - name: WEISSMAN_JOB_ORCHESTRATOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: job_orchestrator_secret
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -x weissman-worker || test -d /proc/1 && grep -q weissman-worker /proc/1/comm"
            initialDelaySeconds: 30
            periodSeconds: 30
