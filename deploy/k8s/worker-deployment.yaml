apiVersion: apps/v1
kind: Deployment
metadata:
  name: weissman-worker
  namespace: weissman
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weissman-worker
  template:
    metadata:
      labels:
        app: weissman-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Must exceed WEISSMAN_WORKER_DRAIN_SECS (25s); the k8s default is 30s, which leaves
      # no margin for the drain loop's 500ms poll plus the final in-flight job.
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: ghcr.io/israel12132/weissman-cybersecurity/weissman-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/weissman-worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
          envFrom:
            - configMapRef:
                name: weissman-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: database_url
            - name: WEISSMAN_AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: auth_database_url
            - name: WEISSMAN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: jwt_secret
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: redis_url
            - name: WEISSMAN_JOB_ORCHESTRATOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: job_orchestrator_secret
            - name: WEISSMAN_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: llm_api_key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weissman-secrets
                  key: openai_api_key
                  optional: true
          # Liveness stays a pure process check: a wedged *process* is worth restarting, but the
          # failure these probes were split for — every claim erroring against the database — is
          # not fixed by a restart, and putting it on liveness would crash-loop the whole fleet
          # against an outage it cannot resolve.
          #
          # The previous single probe was also miswritten: `A || B && C` parses as `(A || B) && C`
          # in sh, so a successful `pgrep` still required the /proc/1/comm grep to pass.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -x weissman-worker >/dev/null 2>&1 || grep -q weissman-worker /proc/1/comm"
            initialDelaySeconds: 30
            periodSeconds: 30
          # Readiness is the real signal: the worker writes /tmp/weissman-worker-alive after every
          # dequeue round-trip that reached the database (an empty queue counts — that is a
          # healthy steady state; a failed claim does not). A pod that is up but cannot claim goes
          # NotReady, so a bad rollout is visibly blocked rather than silently running — which is
          # what happened for four days from 2026-08-06, when the worker reported healthy while
          # failing every claim.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'test -n "$(find /tmp/weissman-worker-alive -mmin -2 2>/dev/null)"'
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
