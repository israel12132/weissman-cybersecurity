apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: weissman-backend
  namespace: weissman
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weissman-backend
  # Never drop below 2 (the Deployment baseline + PodDisruptionBudget guarantee HA).
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
