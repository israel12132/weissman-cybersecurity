apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weissman

# App tier. Deploys the PgBouncer pooler (previously an orphan manifest) alongside the workloads,
# and repoints DB traffic at it via the weissman-secrets DSNs + WEISSMAN_DB_POOLER_MODE in the
# ConfigMap. NOT included here (apply separately):
#   - secret.yaml            (generated by scripts/k8s-generate-secrets.sh; never committed)
#   - postgres-ha.yaml       (CNPG Cluster CRD; needs the operator installed first)
#   - backup-cronjob.yaml, maintenance-deployment.yaml, maintenance-page-configmap.yaml
resources:
  - namespace.yaml
  - configmap.yaml
  - pgbouncer.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-hpa.yaml
  - worker-deployment.yaml
  - worker-hpa.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - redis-deployment.yaml
  - pod-disruption-budgets.yaml
  - network-policies.yaml
  - ingress.yaml
