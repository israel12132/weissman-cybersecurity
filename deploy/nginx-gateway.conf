upstream weissman_backend {
    server backend:8000;
    keepalive 64;
}

# Resolve the real client IP from X-Forwarded-For — but ONLY when the immediate peer is a
# trusted proxy. "Trusted proxy" means an address that actually fronts this gateway. It does
# NOT mean "private", and that distinction is the bug this replaced.
#
# The previous list trusted all of RFC1918 (10/8, 172.16/12, 192.168/16) on the theory that
# private == internal. But Docker does not NAT inbound traffic arriving on a published port:
# a client on the host's own LAN reaches nginx with its real source address intact. Measured
# against the live gateway:
#
#   curl from LAN 192.168.1.33 -> access.log $remote_addr = 192.168.1.33  (inside 192.168/16)
#   curl via loopback          -> access.log $remote_addr = 172.19.0.1    (bridge gateway)
#
# So every host on the deployment's LAN counted as a trusted proxy. Sending a fresh
# `X-Forwarded-For:` per request puts each one in a different limit_req bucket, which defeats
# the 30r/m login throttle below entirely and makes unbounded credential brute-force possible
# — while writing an attacker-chosen address into the audit log. Confirmed live: a forged
# header from the LAN was echoed straight into access.log as $remote_addr.
#
# Trust exactly two things: loopback, and the Docker bridge gateway — the address a same-host
# reverse proxy (the documented fronting deployment) arrives from. The bridge subnet is pinned
# in docker-compose.yml so 172.19.0.1 cannot drift. A real CDN or load balancer must add its
# own egress /32 here; never a range that could contain a client. real_ip_recursive walks the
# XFF chain past these trusted hops to the first untrusted address. The app layer additionally
# gates header trust via WEISSMAN_TRUST_PROXY_HEADERS.
real_ip_header X-Forwarded-For;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 172.19.0.1/32;
real_ip_recursive on;

# ─── Edge rate limiting (volumetric DoS defense-in-depth) ────────────────────────
# Per-IP token buckets keyed on the (real-IP-resolved) client address. These are
# intentionally generous — fine-grained, per-tenant business limits live in the Rust
# app (governor + Redis). This layer just sheds floods before they reach the backend.
limit_req_zone $binary_remote_addr zone=api_general:16m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_login:16m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:16m;
limit_req_status 429;
limit_conn_status 429;

# Gzip everything text-based — meaningful page-load win.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/xml+rss application/wasm application/octet-stream
    image/svg+xml;

server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;

    # ─── Auth endpoints: stricter edge limit on top of app-level lockout ───────
    location = /api/login {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_req zone=api_login burst=10 nodelay;
        limit_conn api_conn 20;

        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── API + WebSockets ────────────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_req zone=api_general burst=60 nodelay;
        limit_conn api_conn 100;

        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /ws/ {
        # No CSP on WebSocket upgrade — it's not an HTTP body, just upgrade headers.
        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Agent install scripts (curl|bash and iwr|iex one-liners). Public, no auth.
    location /install/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hook endpoints (CI/CD, Paddle webhooks, etc.).
    location /hooks/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Hashed static assets: long-cache ────────────────────────────────────
    # NOTE: must use `root` (not `alias`) inside a regex location so $uri resolves
    # correctly. The previous `alias` form double-prefixed and 404'd everything.
    location ~* ^/command-center/assets/.+\.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
    }

    # ─── SPA shell ───────────────────────────────────────────────────────────
    location /command-center/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        alias /usr/share/nginx/html/command-center/;
        try_files $uri $uri/ /command-center/index.html;
    }

    # ─── .well-known (security.txt, etc.) ────────────────────────────────────
    location /.well-known/ {
        include /etc/nginx/conf.d/security-headers.inc;
        alias /usr/share/nginx/html/public/.well-known/;
        default_type text/plain;
    }

    # ─── Public marketing site (root) ────────────────────────────────────────
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=300" always;
        # Marketing pages SHOULD be indexed; the SPA + agent + API blocks above
        # override this with explicit noindex.
        add_header X-Robots-Tag "index, follow" always;
        alias /usr/share/nginx/html/public/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
