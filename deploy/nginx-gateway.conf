upstream weissman_backend {
    server backend:8000;
    keepalive 64;
}

# Resolve the real client IP from X-Forwarded-For — but ONLY when the immediate peer is a
# trusted proxy. "Trusted proxy" means an address that actually fronts this gateway. It does
# NOT mean "private", and that distinction is the bug this replaced.
#
# The previous list trusted all of RFC1918 (10/8, 172.16/12, 192.168/16) on the theory that
# private == internal. But Docker does not NAT inbound traffic arriving on a published port:
# a client on the host's own LAN reaches nginx with its real source address intact. Measured
# against the live gateway:
#
#   curl from LAN 192.168.1.33 -> access.log $remote_addr = 192.168.1.33  (inside 192.168/16)
#   curl via loopback          -> access.log $remote_addr = 172.19.0.1    (bridge gateway)
#
# So every host on the deployment's LAN counted as a trusted proxy. Sending a fresh
# `X-Forwarded-For:` per request puts each one in a different limit_req bucket, which defeats
# the 30r/m login throttle below entirely and makes unbounded credential brute-force possible
# — while writing an attacker-chosen address into the audit log. Confirmed live: a forged
# header from the LAN was echoed straight into access.log as $remote_addr.
#
# Trust exactly two things: loopback, and the Docker bridge gateway — the address a same-host
# reverse proxy (the documented fronting deployment) arrives from. The bridge subnet is pinned
# in docker-compose.yml so 172.19.0.1 cannot drift. A real CDN or load balancer must add its
# own egress /32 here; never a range that could contain a client. real_ip_recursive walks the
# XFF chain past these trusted hops to the first untrusted address. The app layer additionally
# gates header trust via WEISSMAN_TRUST_PROXY_HEADERS.
real_ip_header X-Forwarded-For;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 172.19.0.1/32;
real_ip_recursive on;

# ─── Edge rate limiting (volumetric DoS defense-in-depth) ────────────────────────
# Per-IP token buckets keyed on the (real-IP-resolved) client address. These are
# intentionally generous — fine-grained, per-tenant business limits live in the Rust
# app (governor + Redis). This layer just sheds floods before they reach the backend.
limit_req_zone $binary_remote_addr zone=api_general:16m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_login:16m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:16m;
limit_req_status 429;
limit_conn_status 429;

# Gzip everything text-based — meaningful page-load win.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/xml+rss application/wasm application/octet-stream
    image/svg+xml;

# nginx's stock mime.types has no `webmanifest` entry, so the PWA manifest was served as
# application/octet-stream. With `X-Content-Type-Options: nosniff` (set in
# security-headers.inc) the browser then refuses to parse it, so install/offline is dead.
# (`wasm` is already mapped by the stock mime.types — adding it here is a duplicate-extension
# warning at startup, not an improvement.)
types {
    application/manifest+json  webmanifest;
}

# Hebrew marketing lives under /he/. Keep unknown Hebrew paths on a Hebrew 404
# without turning the gateway into an SPA catch-all.
map $uri $error404 {
    default     /404.html;
    ~^/he(/|$)  /he/404.html;
}

# ─── Continuity ("maintenance") page — automatic, nothing to switch on ─────────
# Whenever the backend cannot answer — restarting, rebuilding, migrating, gone — nginx itself
# fails the proxied request with 502 (connection refused / reset) or 504 (connect timeout).
# Those two codes, and only those two, become the branded page from deploy/maintenance/dist,
# answered as HTTP 503 + Retry-After so monitors, crawlers and the Command Center all read it
# as "temporarily out, come back", never as a broken site. The page appears with the first
# failed proxy attempt and stops the moment the backend answers again; the page itself polls
# /api/health and reloads the visitor's original URL on the first genuine 200. The flag map
# further down is an optional extra for ANNOUNCED windows only — the automatic path never
# reads it.
#
# Which file to serve depends on what the visitor was asking for. An API / hook / WebSocket /
# install client, or anything that explicitly accepts JSON, gets api.json: a fetch() in the
# Command Center or a `curl | bash` installer must never receive 40 KB of HTML with a 503. A
# Hebrew path (/he, /he/…) gets the Hebrew page. Everything else gets the English page. Keyed
# on $uri, the NORMALISED path — `..` and `//` resolved, %2F decoded — i.e. the same path the
# location match used, so the body always matches where the request would have gone
# (measured on $request_uri: `/he/../api/health`, proxied to /api/health, got the Hebrew
# page, and `/api%2Fhealth` the English one). $uri changes to /maintenance/_503 on the
# internal redirect that serves the page, which is why the map is evaluated once at server
# level below, before anything else: nginx caches a map result for the whole request,
# across that redirect, and the page location reads the cached choice. (The flag map
# further down is `volatile` for exactly the opposite reason.) Anchored at the start and
# terminated by `/`, `?` or the end, so nothing in the query string can influence the match.
map $http_accept $maintenance_accepts_json {
    default             0;
    ~*application/json  1;
}

map "$maintenance_accepts_json:$uri" $maintenance_page {
    default                                   /index.html;
    "~^[01]:/(api|hooks|ws|install)(/|\?|$)"  /api.json;
    "~^1:"                                    /api.json;
    "~^0:/he(/|\?|$)"                        /he/index.html;
}

# Optional, opt-in flag (deploy/maintenance/maintenance-mode.sh on|off): while
# /var/lib/weissman/maintenance/maintenance.on exists — the host state dir, bind-mounted
# read-only by docker-compose.yml — every request is answered with the page even though the
# backend may still be up (a migration that must not take writes, an announced window). OFF by
# default, never required. `-f` is evaluated per request, so on/off take effect immediately
# without a reload. The page's own assets and status.json MUST keep serving while the flag is
# up: the 503 page loads /maintenance/maintenance.js, and a browser refuses to run a script
# that itself arrives with a 5xx status. For those URIs the map yields an empty path, which
# `-f` can never find, so the server-level `if` below lets them through. The page's own
# internal URI (/maintenance/_503) is under the same prefix on purpose: the `if` runs again on
# the internal redirect, and if it re-fired there the second 503 would fall through to nginx's
# unbranded default page.
map $uri $maintenance_flag_file {
    # nginx caches a map result for the whole request, including across the internal redirect
    # to the page: without `volatile` the second pass of the `if` would still see the flag path
    # for "/" and re-fire (measured: an unbranded default 503 with no headers).
    volatile;
    default          /var/lib/weissman/maintenance/maintenance.on;
    ~^/maintenance/  "";
}

# Do not advertise the exact nginx version in every response and error page — free
# version-matching for anyone scanning for a known CVE in this build.
server_tokens off;

server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;
    # Keep HTTP 404. Without `=404` nginx would 302/200 the error document and
    # every typo would look like a real page to crawlers and monitors.
    error_page 404 =404 $error404;

    # Pin the page choice to the path the visitor asked for (see $maintenance_page above):
    # this first read fills nginx's per-request cache of the map before the flag check and
    # before any proxied location can redirect to the page. Load-bearing — do not move it
    # below the `if`, and do not make the map `volatile`.
    set $maintenance_page_pinned $maintenance_page;

    # Announced-window flag (see $maintenance_flag_file above). The only `if` in this file, and
    # in the one shape nginx's own "if is evil" page calls safe: server level, a bare `return`.
    if (-f $maintenance_flag_file) {
        return 503;
    }
    # Both the flag's `return 503` and the `error_page 502 504 =503 /maintenance/_503` inside
    # every proxied location end up in the internal location below. No `=` on this one: the 503
    # is kept as-is.
    error_page 503 /maintenance/_503;

    # ─── Auth endpoints: stricter edge limit on top of app-level lockout ───────
    location = /api/login {
        include /etc/nginx/conf.d/security-headers.inc;
        # The backend sets its own security headers, and nginx's `add_header` does not replace
        # them — both are emitted. A browser receiving two Content-Security-Policy headers
        # enforces the INTERSECTION, so the effective policy silently became stricter than
        # either side intended (the backend omits `wss:` from connect-src; nginx allows it).
        # Hide the upstream copies so exactly one policy, this one, applies.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_req zone=api_login burst=10 nodelay;
        limit_conn api_conn 20;

        # Continuity page on nginx's own 502/504 only — see the /api/ block for why the list is
        # deliberately this short.
        proxy_intercept_errors on;
        error_page 502 504 =503 /maintenance/_503;
        proxy_connect_timeout 5s;
        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/strip-internal-headers.inc;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── API + WebSockets ────────────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        # The backend sets its own security headers, and nginx's `add_header` does not replace
        # them — both are emitted. A browser receiving two Content-Security-Policy headers
        # enforces the INTERSECTION, so the effective policy silently became stricter than
        # either side intended (the backend omits `wss:` from connect-src; nginx allows it).
        # Hide the upstream copies so exactly one policy, this one, applies.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header X-Robots-Tag "noindex, nofollow" always;

        limit_req zone=api_general burst=60 nodelay;
        limit_conn api_conn 100;

        # Only nginx's OWN failures become the continuity page. `proxy_intercept_errors` hands
        # every upstream 3xx/4xx/5xx to error_page too, but a location-level error_page list
        # REPLACES the inherited server-level one (the 404 map, the flag's 503), so inside this
        # block only 502 and 504 are rewritten: the backend's 404s, 429s and legitimate 503s
        # (POST /api/public/demo-request answers 503 while SMTP is unconfigured, and the website
        # relies on that) pass through byte-for-byte. A dead upstream is refused instantly; a
        # black-holed one (container recreated on a new address, host firewall) would otherwise
        # hold the visitor for the 60 s default connect timeout before the page appears.
        proxy_intercept_errors on;
        error_page 502 504 =503 /maintenance/_503;
        proxy_connect_timeout 5s;
        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        include /etc/nginx/conf.d/strip-internal-headers.inc;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /ws/ {
        # No CSP on WebSocket upgrade — it's not an HTTP body, just upgrade headers.
        # Continuity page on nginx's own 502/504 only — see the /api/ block for why the list is
        # deliberately this short.
        proxy_intercept_errors on;
        error_page 502 504 =503 /maintenance/_503;
        proxy_connect_timeout 5s;
        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        include /etc/nginx/conf.d/strip-internal-headers.inc;
    }

    # Agent install scripts (curl|bash and iwr|iex one-liners). Public, no auth.
    location /install/ {
        include /etc/nginx/conf.d/security-headers.inc;
        # The backend sets its own security headers, and nginx's `add_header` does not replace
        # them — both are emitted. A browser receiving two Content-Security-Policy headers
        # enforces the INTERSECTION, so the effective policy silently became stricter than
        # either side intended (the backend omits `wss:` from connect-src; nginx allows it).
        # Hide the upstream copies so exactly one policy, this one, applies.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Continuity page on nginx's own 502/504 only — see the /api/ block for why the list is
        # deliberately this short.
        proxy_intercept_errors on;
        error_page 502 504 =503 /maintenance/_503;
        proxy_connect_timeout 5s;
        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/strip-internal-headers.inc;
    }

    # Hook endpoints (CI/CD, Paddle webhooks, etc.).
    location /hooks/ {
        include /etc/nginx/conf.d/security-headers.inc;
        # The backend sets its own security headers, and nginx's `add_header` does not replace
        # them — both are emitted. A browser receiving two Content-Security-Policy headers
        # enforces the INTERSECTION, so the effective policy silently became stricter than
        # either side intended (the backend omits `wss:` from connect-src; nginx allows it).
        # Hide the upstream copies so exactly one policy, this one, applies.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Continuity page on nginx's own 502/504 only — see the /api/ block for why the list is
        # deliberately this short.
        proxy_intercept_errors on;
        error_page 502 504 =503 /maintenance/_503;
        proxy_connect_timeout 5s;
        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/strip-internal-headers.inc;
    }

    # ─── Hashed static assets: long-cache ────────────────────────────────────
    # NOTE: must use `root` (not `alias`) inside a regex location so $uri resolves
    # correctly. The previous `alias` form double-prefixed and 404'd everything.
    # `wasm` and the fonts/ subtree were missing, so 1.27 MB of content-hashed assets fell
    # through to the SPA-shell block below and were served `no-store` — re-downloaded in
    # full on every page load despite having immutable, hashed names.
    location ~* ^/command-center/(?:assets|fonts)/.+\.(?:js|css|wasm|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        # Do NOT use `always` here. A missing hashed file (rolling deploy, stale tab) must
        # not be remembered as immutable for a year — browsers would keep serving that 404
        # even after the matching chunk is on disk, which surfaces as
        # "error loading dynamically imported module".
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        root /usr/share/nginx/html;
        try_files $uri @command_center_asset_miss;
        access_log off;
    }

    location @command_center_asset_miss {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        # `return 404;` alone never produced this location's headers: a bodiless 404 is
        # picked up by the server-level `error_page 404 =404 $error404`, which internally
        # redirects to /404.html and answers from the marketing block — with ITS
        # `Cache-Control: public, max-age=300`. So a missing chunk during a rolling deploy was
        # cached for five minutes, the exact thing this block exists to prevent
        # (scripts/test_gateway_contract.sh asserts no-store here). A `return` WITH a body is
        # a complete response and is never routed through error_page.
        return 404 "not found\n";
    }

    # ─── SPA shell ───────────────────────────────────────────────────────────
    # Without this, the bare path falls through to `location /` (the marketing alias) and
    # returns HTTP 200 with the public homepage — no redirect, no error. nginx's automatic
    # directory redirect does not fire because the SPA is mounted via `alias` in a separate
    # location. A user typing /command-center, or any link that lost its trailing slash, was
    # told the application does not exist.
    # `absolute_redirect off` is load-bearing, not tidiness. With nginx's default
    # (absolute_redirect on) a `return 301 /path/` is rewritten to an absolute URL using this
    # server's *listen* port — 8080 — so the browser is sent to http://host:8080/command-center/,
    # a port that is not published. Verified: the default emitted
    # `Location: http://127.0.0.1:8080/command-center/` and following it connected to nothing.
    # Relative Location headers are valid per RFC 7231 §7.1.2 and sidestep the whole
    # host/port/scheme reconstruction problem behind a proxy.
    location = /command-center {
        absolute_redirect off;
        return 301 /command-center/;
    }

    location /command-center/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        alias /usr/share/nginx/html/command-center/;
        try_files $uri $uri/ /command-center/index.html;
    }

    # ─── Public status page (SLA_AND_STATUS.md §4) ───────────────────────────
    # Without an explicit location this falls through to the marketing catch-all, which is how
    # /status came to return HTTP 200 with the homepage byte-for-byte while being linked from the
    # site footer and named in the Terms of Service as the maintenance-notice channel.
    location = /status {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        # Never cache a status page.
        add_header Cache-Control "no-store, must-revalidate" always;
        limit_req zone=api_general burst=30 nodelay;

        # Continuity page on nginx's own 502/504 only — see the /api/ block for why the list is
        # deliberately this short.
        proxy_intercept_errors on;
        error_page 502 504 =503 /maintenance/_503;
        proxy_connect_timeout 5s;
        proxy_pass http://weissman_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/strip-internal-headers.inc;
        proxy_set_header Connection "";
    }

    # ─── Continuity page assets (deploy/maintenance/dist, COPY'd into the image) ────
    # Served with a plain 200 even while the flag is up (see $maintenance_flag_file): the 503
    # page loads /maintenance/maintenance.js, and browsers refuse to execute a script that
    # itself arrives with a 5xx. `root`, not `alias`, on purpose: the URI prefix equals the
    # directory name, and a `root` cannot be turned into a traversal the way an alias without a
    # trailing slash can. no-store because the file is tiny and a cached copy of stale recheck
    # logic is worse than the round-trip. /maintenance/index.html is a handy preview.
    location ^~ /maintenance/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        root /usr/share/nginx/html;
        try_files $uri =404;
        error_page 404 =404 @maintenance_miss;
    }

    # A missing file under /maintenance/ — above all status.json when no window is announced —
    # must be a plain 404, not the marketing 404 page: the server-level `error_page 404`
    # redirects through /404.html, which re-runs the flag check, and while a window is
    # announced the page's harmless status poll came back 503 (measured). Named, so no server
    # rewrite pass happens on the way here.
    location @maintenance_miss {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        return 404;
    }

    # status.json is runtime state written by maintenance-mode.sh on the HOST and bind-mounted
    # read-only (${WEISSMAN_MAINTENANCE_STATE_DIR}, docker-compose.yml), not a build artefact,
    # so it lives in /var/lib/weissman/maintenance rather than next to the page. 404 is the
    # normal answer when no window is announced — the page treats it as "nothing to show".
    # `rewrite … break` + `root` rather than `alias`, for the same traversal reason as above.
    location = /maintenance/status.json {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        root /var/lib/weissman/maintenance;
        rewrite ^ /status.json break;
        error_page 404 =404 @maintenance_miss;
    }

    # The page itself. `internal`: reachable only by the error_page redirects above (the flag's
    # server-level 503, a 502/504 from a proxied location); asked for directly it is a 404. A
    # URI target rather than a named `@location` because of the request METHOD: nginx rewrites
    # the method to GET when it redirects to a URI, but leaves it alone for a named location, and
    # the static handler then answers a POST /api/login or a DELETE with 405 instead of the page
    # (measured). The status is already 503 on arrival, so `try_files` merely picks the file the
    # map chose; Content-Type follows the extension (text/html or application/json).
    # `add_header` here REPLACES the originating location's set, which is why the security
    # headers are included again: they appear exactly once. Retry-After tells crawlers and the
    # Command Center when to look again; no-store so no cache ever holds the page past the
    # outage; X-Weissman-Maintenance lets the SPA and the Cloudflare Worker tell "branded page
    # from our own gateway" apart from an anonymous 5xx.
    location = /maintenance/_503 {
        internal;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        add_header X-Weissman-Maintenance "1" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        charset utf-8;
        root /usr/share/nginx/html/maintenance;
        try_files $maintenance_page =503;
        # Asked for directly, `internal` answers 404; keep that off the marketing 404 map for
        # the same flag-re-check reason as the asset locations.
        error_page 404 =404 @maintenance_miss;
    }

    # ─── .well-known (security.txt, etc.) ────────────────────────────────────
    location /.well-known/ {
        include /etc/nginx/conf.d/security-headers.inc;
        alias /usr/share/nginx/html/public/.well-known/;
        default_type text/plain;
    }

    # ─── Public marketing site (root) ────────────────────────────────────────
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=300" always;
        # Marketing pages SHOULD be indexed; the SPA + agent + API blocks above
        # override this with explicit noindex.
        add_header X-Robots-Tag "index, follow" always;
        alias /usr/share/nginx/html/public/;
        index index.html;
        # `try_files $uri $uri/ /index.html` made this an SPA-style catch-all: EVERY unknown
        # path returned HTTP 200 with the full marketing homepage. The marketing site is static
        # HTML with no client-side router, so it needs no catch-all — and a site that can never
        # 404 tells crawlers every typo is a real page (each one indexable, since this block sets
        # `index, follow`) and hides genuinely broken links from monitoring, which only ever sees
        # 200s. =404 restores the real answer.
        try_files $uri $uri/ =404;
    }
}
