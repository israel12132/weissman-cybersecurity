# Weissman Command Center — Prometheus alerting rules.
#
# Consumes the metrics emitted by fingerprint_engine::observability (exposed at
# GET /api/metrics on weissman-server). Load via prometheus.yml:
#   rule_files:
#     - /etc/prometheus/rules/weissman-alerts.yml
#
# Thresholds are conservative starting points — tune per environment SLOs.
groups:
  - name: weissman-http
    rules:
      - alert: WeissmanHigh5xxRatio
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: critical, service: weissman-server }
        annotations:
          summary: "High 5xx ratio (>5%) on the API"
          description: "5xx responses exceed 5% of traffic over the last 5m."

      - alert: WeissmanHighRequestLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels: { severity: warning, service: weissman-server }
        annotations:
          summary: "API p95 latency above 1s"
          description: "The 95th-percentile request duration has exceeded 1s for 10m."

      - alert: WeissmanErrorsSpiking
        expr: sum(rate(weissman_errors_total[5m])) > 1
        for: 5m
        labels: { severity: warning, service: weissman-server }
        annotations:
          summary: "Server 5xx errors are spiking"
          description: "weissman_errors_total is increasing at >1/s over 5m."

      - alert: WeissmanRateLimitPressure
        expr: sum(rate(weissman_rate_limit_violations_total[5m])) > 5
        for: 10m
        labels: { severity: warning, service: weissman-server }
        annotations:
          summary: "Sustained rate-limit (429) pressure"
          description: "429 responses exceed 5/s for 10m — possible abuse or an undersized limit."

  - name: weissman-infra
    rules:
      - alert: WeissmanDbPoolExhausted
        expr: min by (pool) (weissman_db_pool_idle) == 0
        for: 5m
        labels: { severity: critical, service: weissman-db }
        annotations:
          summary: "DB pool {{ $labels.pool }} has no idle connections"
          description: "weissman_db_pool_idle for pool {{ $labels.pool }} has been 0 for 5m — requests may be queuing."

      - alert: WeissmanJobBacklog
        expr: weissman_async_jobs_pending > 100
        for: 10m
        labels: { severity: warning, service: weissman-worker }
        annotations:
          summary: "Async job backlog is growing"
          description: "weissman_async_jobs_pending > 100 for 10m — workers may be under-provisioned or stuck."

      - alert: WeissmanDependencyDown
        expr: weissman_dependency_up == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "A tracked dependency is down"
          description: "weissman_dependency_up == 0 for 3m (see the 'dependency' label)."

  - name: weissman-fleet
    rules:
      - alert: WeissmanAllAgentsOffline
        expr: weissman_agents_registered > 0 and weissman_agents_online == 0
        for: 5m
        labels: { severity: critical, service: weissman-agent }
        annotations:
          summary: "No endpoint agents are online"
          description: "Agents are registered but none are reporting online for 5m."

      - alert: WeissmanAgentsStaleHigh
        expr: |
          weissman_agents_registered > 0
          and (weissman_agents_stale / clamp_min(weissman_agents_registered, 1)) > 0.5
        for: 15m
        labels: { severity: warning, service: weissman-agent }
        annotations:
          summary: "Over half of agents are stale"
          description: "More than 50% of registered agents are stale for 15m."

      - alert: WeissmanSelfHealingDegraded
        expr: weissman_heal_total_requests > 0 and weissman_heal_success_rate < 0.8
        for: 15m
        labels: { severity: warning, service: weissman-agent }
        annotations:
          summary: "Self-healing success rate below 80%"
          description: "weissman_heal_success_rate < 0.8 while healing is active."

  # Platform self-healing (fingerprint_engine::self_healing + self_heal_recovery). The 10s health
  # loop diagnoses the platform's own health and executes bounded recovery; these alerts surface a
  # sustained fault the recovery layer is actively working around. See docs/PLATFORM_SELF_HEALING.md.
  - name: weissman-platform-self-healing
    rules:
      - alert: WeissmanPlatformCriticalDiagnosis
        expr: sum by (subsystem) (rate(weissman_self_heal_diagnosis_total{severity="critical"}[5m])) > 0
        for: 5m
        labels: { severity: critical, service: weissman-server }
        annotations:
          summary: "Platform self-diagnosis critical: {{ $labels.subsystem }}"
          description: "The self-healing loop has diagnosed {{ $labels.subsystem }} as critically unhealthy for 5m (postgres/redis down, pool saturated, or async backlog past critical)."

      - alert: WeissmanPlatformLoadShedding
        expr: rate(weissman_self_heal_scan_shed_total[5m]) > 0
        for: 5m
        labels: { severity: critical, service: weissman-server }
        annotations:
          summary: "Platform is shedding scan intake"
          description: "New scan-trigger POSTs have been rejected with 503 for 5m because the self-healing load-shed gate is engaged — the platform is critically saturated. Investigate DB pool / async backlog."

      - alert: WeissmanPlatformSustainedRecovery
        expr: sum by (subsystem, action) (rate(weissman_self_heal_recovery_total{outcome="cooldown"}[10m])) > 0
        for: 15m
        labels: { severity: warning, service: weissman-server }
        annotations:
          summary: "Self-healing recovery sustained: {{ $labels.subsystem }} / {{ $labels.action }}"
          description: "Recovery for {{ $labels.subsystem }}/{{ $labels.action }} has stayed engaged (cooldown-suppressed rounds) for 15m — the fault is not transient. The platform is coping, but the underlying cause needs attention."

      - alert: WeissmanPlatformCronBackoff
        expr: rate(weissman_self_heal_cron_backoff_total[5m]) > 0
        for: 10m
        labels: { severity: warning, service: weissman-worker }
        annotations:
          summary: "Cron scans deferred by self-healing backoff"
          description: "The scan-schedule worker has been deferring cron ticks for 10m due to sustained transient pressure (async backlog past the warn threshold). Scheduled scans are delayed, not lost."

      # Durable cross-replica coordination (self_heal_shared, opt-in via
      # WEISSMAN_SELFHEAL_SHARED_STATE_ENABLED). The fleet gate lifts load-shed/backoff from a
      # single replica to the whole fleet; these surface a fleet-wide engagement and a shared-store
      # outage (which fails open to local-only gating).
      - alert: WeissmanFleetLoadShedding
        expr: max(weissman_self_heal_shared_gate_active{gate="load_shed"}) > 0
        for: 5m
        labels: { severity: critical, service: weissman-server }
        annotations:
          summary: "Fleet-wide self-healing load-shed engaged"
          description: "The durable cross-replica load-shed gate has been engaged for 5m — at least one replica diagnosed critical saturation and the whole fleet is now shedding new scan intake. Investigate DB pool / async backlog across the fleet."

      - alert: WeissmanSelfHealSharedStoreErrors
        expr: rate(weissman_self_heal_shared_refresh_total{outcome="error"}[5m]) > 0
        for: 15m
        labels: { severity: warning, service: weissman-server }
        annotations:
          summary: "Self-healing shared-gate store unreachable"
          description: "Cross-replica self-heal refresh has been failing for 15m — replicas are degraded to local-only gating (fail-open, no lost work). Check Postgres reachability from the fleet."
