# gitleaks configuration — secret scanning gate (CI: security-scan job runs
#   gitleaks detect --no-git --redact --exit-code 1 --source .
# which auto-loads this file from the repo root).
#
# Start from gitleaks' full default rule set, then allow the *example* secrets
# that are intrinsic to a security product and are NOT real credentials:
#
#   1. The offensive / detection engines (fingerprint_engine/src) carry example
#      tokens as their own test corpora — a secret-detection engine must contain
#      realistic-looking fixtures (AWS-style access-key IDs, Google-OAuth-style
#      tokens, GitHub-PAT-style strings, PEM key headers) so its detectors and
#      redactors can be unit tested. Real runtime secrets are read from env /
#      Vault (see ceo/vault.rs, scan_payload_redaction.rs), never hardcoded here.
#
#   2. Three frontend surfaces render *demo* misconfigurations and input
#      placeholders for the operator (the canonical AWS-docs example key, GitHub
#      token placeholders, OpenSSH private-key input placeholders). These are
#      illustrative, not credentials.
#
# gitleaks stays fully active everywhere else (deploy/, backend/, crates/,
# scripts/, config, .env*, the rest of frontend/) — the places a real secret
# would actually leak. Semgrep's p/secrets rules also remain active on the
# engine source, so a genuine hardcoded token there is still caught.

title = "Weissman gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Example/fixture secrets in the security engines' test corpora, the IaC/secret-scanner demo UI, and CI/E2E test fixtures (non-real placeholders; real secrets come from env/Vault)."
paths = [
    # Detection-engine fixture corpora ONLY. Example AWS keys, PEM private keys, poison
    # prompts and alg:none JWTs are these engines' own detector TEST INPUTS, not credentials.
    # Scoped to the specific engine files that carry them (was a blanket
    # `fingerprint_engine/src/.*\.(rs|inc)$` that also exempted every platform handler in the
    # same tree — auth_*.rs, admin_users.rs, audit_log.rs, ceo/, billing/, secret_zeroize/,
    # soar/, server_handlers_*.inc — from the secret scan; those are now scanned again).
    # The canonical AWS example key (the AWS-documentation example key ID) that most other engine fixtures use
    # is handled by a content regex below, so deception_*, engine_probes and pipeline_engine
    # need no path entry and stay scanned for real secrets.
    '''fingerprint_engine/src/cicd_ast_scan\.rs$''',
    # AWS EventBridge deception engine: JSON honeytoken payloads embed placeholder AWS keys
    # (the AWS-documentation example key ID and, in earlier commits, the all-A / all-B placeholder IDs).
    # A path entry (not just the AWS-documentation example key ID content regex) so the git-history scan,
    # which sees those older commits, is covered too.
    '''fingerprint_engine/src/deception_eventbridge\.rs$''',
    '''fingerprint_engine/src/exploit_synthesis_engine\.rs$''',
    '''fingerprint_engine/src/honey_deception_node\.rs$''',
    '''fingerprint_engine/src/identity_engine\.rs$''',
    '''fingerprint_engine/src/llm_fuzzer_engine\.rs$''',
    '''fingerprint_engine/src/web_scan_intel\.rs$''',
    '''fingerprint_engine/src/timing_sidechannel_engine\.rs$''',
    '''fingerprint_engine/src/iac_misconfig_engine/.*\.rs$''',
    '''frontend/src/pages/IacSecurityCenter\.jsx$''',
    '''frontend/src/pages/SovereignDefenseMatrix\.jsx$''',
    '''frontend/src/lib/engineParamDefsExplicit\.js$''',
    # Generated vitest coverage report + production bundle — embed the
    # (already-allowlisted) source, so they inherit the same illustrative demo
    # placeholders. dist/ is a build artifact, not committed.
    '''frontend/coverage/''',
    '''frontend/dist/''',
    # Playwright saved login state — JWTs signed with the CI-only test secret,
    # scoped to a test tenant; worthless outside CI.
    '''frontend/tests-e2e/\.auth/''',
    # The CI supply-chain gate is itself a secret/IaC scanner: its detector regexes
    # (AKIA…, -----BEGIN…PRIVATE KEY-----) and its --selftest planted fixtures are
    # non-real placeholders by design. Narrow single-file entry; gitleaks stays
    # active on the rest of scripts/.
    '''scripts/ci_supply_chain_gate\.mjs$''',
    # Nightly-e2e + CI smoke workflows boot an ephemeral throwaway stack; every
    # hardcoded value here is a CI-only fixture (JWT/orchestrator/metrics/vault
    # placeholders like the repeating-hex WEISSMAN_VAULT_KEY). Real secrets in
    # workflows come from `${{ secrets.* }}`, never inline. gitleaks stays
    # active on every other workflow and on deploy/, backend/, crates/,
    # scripts/, .env*, etc.
    '''\.github/workflows/nightly-e2e\.yml$''',
    '''\.github/workflows/ci\.yml$''',
    # crates.io package checksums are 64-hex and trip git-history generic-api-key
    # even though the working-tree scan ignores `checksum = "..."` context.
    '''Cargo\.lock$''',
]
regexes = [
    # Canonical AWS-docs example key. It is the test input for many engine detectors AND the
    # #[cfg(test)] round-trip in the ceo/vault.rs HANDLER. A content allowlist (not a path)
    # so ceo/vault.rs, the deception engines, engine_probes and pipeline_engine all keep being
    # scanned for genuine secrets while this one non-credential example is ignored everywhere.
    '''AKIAIOSFODNN7EXAMPLE''',
    # slack_interactivity.rs unit-test signing-secret fixture (the literal contains `yyyzzz`,
    # i.e. deliberately not hex — a mock, not a real Slack secret). Content regex so the Slack
    # interactivity handler itself stays under the scanner.
    '''8f742231b10e8888abcd99yyyzzz85a5''',
    # ws_intelligence_bus.rs unit-test JWT fixture (sub=1, literal `sig` signature). Content
    # regex so the websocket bus handler stays scanned for real tokens.
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxIn0\.sig''',
    # `key = 'enable_rfc3161_signing'` is a config FLAG NAME, not a credential —
    # the generic-api-key heuristic mis-fires on the `key = '...'` shape.
    '''enable_rfc3161_signing''',
    # Literal CI test env secret in the nightly-e2e workflow (not a real secret).
    '''nightly-e2e-secret-min-32-chars''',
    # Throwaway 64-hex WEISSMAN_VAULT_KEY fixtures in CI / nightly-e2e —
    # scoped to the ephemeral runner DB only, never a real vault key.
    '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
    '''cafebabecafebabecafebabecafebabecafebabecafebabecafebabecafebabe''',
    '''a1b2c3d4e5f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff00''',
    '''deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef''',
    # SHA-pinned actions/setup-node@v7.0.0 (40-hex commit). Git-history mode
    # scores the added pin as a generic key; the working-tree scan does not.
    '''820762786026740c76f36085b0efc47a31fe5020''',
    # Fake SCIM token PREFIX fixture in a frontend unit test (mock API response in
    # ScimProvisioning.test.jsx). Not a real credential — a display-only `token_prefix`
    # column value. A regex (not an inline allow) so the git-history scan, which sees
    # the commit that first added it, is covered too.
    '''wsm_scim_abcd1234''',
]
