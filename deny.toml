[licenses]
version = 2
# Permissive licenses acceptable for a proprietary product. Copyleft
# (GPL/AGPL/LGPL) is intentionally NOT listed, so any such dependency fails the
# gate and must be reviewed/removed before it can ship.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9
# First-party crates carry no SPDX license field (proprietary); do not fail on them.
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

