# cargo-deny configuration — supply-chain / license / advisory gate.
# Run locally: `cargo deny check`  (CI runs it too — see .github/workflows/ci.yml)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only fail on unmaintained crates we could actually act on (workspace/direct);
# any transitive unmaintained crate (e.g. rustls-pemfile via rustls) has no safe
# upgrade and is pinned upstream — surfaced as warnings. The genpdf→printpdf subtree
# (stdweb/rusttype/stb_truetype/encoding/lzw) that previously dominated this list is
# gone: PDF export is now a native %PDF-1.4 writer with no third-party PDF crate.
unmaintained = "workspace"
# Transitive advisories with no upstream fix yet — mirror of the documented
# cargo-audit ignores in ci.yml. Re-review on every dependency bump.
ignore = [
    "RUSTSEC-2023-0071", # rsa (Marvin timing) via openidconnect (OIDC) — no fixed release
    # RUSTSEC-2026-0098/0099/0104 (rustls-webpki 0.101.7) are NO LONGER ignored: the AWS
    # SDK crates were switched to default-features = false + the modern rustls-aws-lc
    # connector (see fingerprint_engine/Cargo.toml), so the legacy rustls 0.21 subtree that
    # pulled that rustls-webpki is gone from the lock. Reintroducing it now fails this gate.
    # Also NOT ignored (confirmed absent on the current lock): RUSTSEC-2026-0049 (stale
    # rustls-webpki CRL distribution-point) and the genpdf->printpdf->lopdf subtree
    # advisories incl. RUSTSEC-2026-0187 (lopdf parse-DoS) — genpdf was dropped for the
    # native %PDF-1.4 writer in fingerprint_engine/src/pdf_report.rs. A regression that
    # reintroduces any of them will fail this gate.
]

[licenses]
version = 2
# Permissive licenses acceptable for a proprietary product. Copyleft
# (GPL/AGPL/LGPL) is intentionally NOT listed, so any such dependency fails the
# gate and must be reviewed/removed before it can ship.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "0BSD", # BSD Zero Clause (public-domain-equivalent, OSI-approved) — via quoted_printable→lettre
    "CDLA-Permissive-2.0", # permissive data license on the Mozilla CA-root bundle — via webpki-roots→sqlx
]
confidence-threshold = 0.9
# First-party crates carry no SPDX license field (proprietary); do not fail on them.
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Duplicate major versions are common in large trees; surface them without failing the build.
multiple-versions = "warn"
# A wildcard version requirement is a real supply-chain smell (pulls anything).
# Enforced as a hard failure: the current lock has zero `version = "*"` requirements,
# so this cannot break today's build and blocks any future wildcard from being introduced.
wildcards = "deny"

[sources]
# Only crates.io — reject any unknown registry or git source (typosquat / unvetted origin).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
